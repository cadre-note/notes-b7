作規則處理，涉及賠償先和人資確認。"}], [{"k": "tool", "t": "懲處前三確認", "i": ["工作規則有沒有寫這項規定？", "事實有沒有紀錄與證據？", "過去同樣的情況怎麼處理？"], "back": ["找出本廠工作規則，確認懲處程序與人資窗口。"]}, {"k": "reflect", "q": "你們的工作規則放在哪裡？組員看過嗎？"}, {"k": "take", "t": "懲處要有依據，主管一句話不算數。"}]], "C-9": [[{"k": "head", "t": "案例：檢測機被關掉", "g": "能做出你職務的判斷、排出處置順序，並和其他職務對照。"}, {"k": "story", "who": "案發經過", "t": "優格冰線的金屬檢測機頻繁誤報。夜班組員覺得「反正都是誤報」，23:00 自行關機，繼續生產到 02:00 才重新開機。上一次用測試片確認檢測機正常是 22:00。產線每小時 1,200 杯。"}], [{"k": "table", "t": "時間線（示意）", "head": ["時間", "事件"], "rows": [["22:00", "測試片確認正常"], ["22:00–23:00", "頻繁誤報"], ["23:00", "自行關機，繼續生產"], ["02:00", "重新開機"], ["隔天 08:00", "這批要出貨 3,000 杯"]], "note": "示意數據。"}, {"k": "recall", "key": "c9-r0", "q": "偏離處置的四步是什麼？", "a": "控制產品、矯正原因、評估影響、紀錄與驗證。"}, {"k": "recall", "key": "c9-r1", "q": "發生異常時，處理的第一順位是什麼？", "a": "人員安全，接著停止或隔離可疑產品；不能自行略過檢測或關閉警報。"}], [{"k": "byrole", "r": {"prod": [{"k": "quiz", "key": "c9-prod", "star": 2, "q": "可疑產品要重新過金屬檢測，速度每小時 1,200 杯，06:00 開始。08:00 出貨前，能完成 3,000 杯嗎？", "o": ["可以，還多 600 杯", "不行，只能完成 2,400 杯，要先通知業務", "不用重檢，直接出貨"], "a": 1, "y": "06:00–08:00 共 2 小時 × 1,200＝2,400 杯，少 600 杯。要先通知業務分批或延後。"}], "qa": [{"k": "quiz", "key": "c9-qa", "star": 3, "q": "需要重新過檢或評估的範圍是？", "o": ["23:00–02:00，約 3,600 杯", "22:00–02:00，約 4,800 杯", "只有 02:00 之後"], "a": 1, "y": "22:00 是最後一次用測試片確認正常；之後頻繁誤報，代表機台狀態可疑。範圍從 22:00 算到 02:00，4 小時 × 1,200＝4,800 杯。"}], "line": [{"k": "quiz", "key": "c9-line", "star": 2, "q": "組員為什麼覺得可以關機？最根本的改善是？", "o": ["記過關機的人", "明訂「誤報時停線找原因，不可關機」，誤報由工務排除，停線產量由主管承擔", "把檢測機的靈敏度調低"], "a": 1, "y": "組員關機是因為誤報讓他們無法生產，又沒有人告訴他們該怎麼辦。規則清楚、主管承擔產量壓力、根本解決誤報，才不會再發生。調低靈敏度等於降低防護。"}]}}], [{"k": "order", "key": "c9-o", "t": "檢測機被關掉後的處理順序", "i": ["立即恢復檢測並停止出貨", "隔離可疑時段的產品", "用測試片確認檢測機功能", "可疑產品重新過檢", "找出誤報原因並修正", "宣導規則並記錄"], "y": "先恢復防護、控制產品；確認機台正常後重新過檢才有意義；最後要解決誤報，否則還會有人關機。", "s": "從發現 23:00–02:00 檢測機被關掉那一刻開始，排出 6 個步驟。"}], [{"k": "roles", "r": {"prod": "生管：隔離 3 小時的產品，對出貨的影響？", "qa": "衛管：這段時間的產品要怎麼處置？", "line": "生產主管：為什麼組員覺得可以關機？規則清楚嗎？"}}, {"k": "reflect", "q": "寫下你的職務明天就能做的一件事，月會時和其他職務對照。"}]], "T-10": [[{"k": "head", "t": "管理人：衝突處理", "g": "能先處理情緒，再處理衝突本身。"}, {"k": "ben", "me": "能處理衝突，是成熟主管的標誌。", "co": "團隊氣氛更好，合作更順利。"}, {"k": "predict", "key": "p-T10n", "q": "生管和衛管在會議上為了「先出貨還是先等報告」吵起來。你是主持人，第一步是？", "o": ["先暫停爭論，分別請雙方說出顧慮與想要的結果", "依過去慣例直接裁決，避免拖延", "請雙方會後自己協調，會議繼續"], "a": 0, "r": "先處理情緒、了解完整狀況，才找得到雙方都能接受的做法。"}], [{"k": "points", "h": "重點", "i": ["先讓雙方冷靜，分開了解狀況。", "聚焦在事實與共同目標。", "訂出具體的做法，並追蹤是否落實。"]}, {"k": "flip", "key": "f-T10", "x": "衝突越少越好。", "r": "適度的意見衝突能找出問題；要避免的是人身攻擊和不處理。"}], [{"k": "fact", "t": "衝突放著不處理，通常不會自己消失，只會轉成私下的不合作。"}, {"k": "adv", "t": "處理衝突四步", "i": ["分開聽：先分別了解雙方的說法。", "找事實：把意見和事實分開。", "找共同目標：例如準時出貨、不出食安問題。", "訂做法並追蹤：避免同樣的衝突再發生。"]}], [{"k": "quiz", "key": "q-T10n", "star": 2, "q": "了解雙方顧慮後：生管怕失去客戶，衛管怕不合格品出廠。哪一個方向最可能兩邊都接受？", "o": ["由主管決定這次先出貨", "請衛管下次盡量提早出報告", "先出前一批已放行的庫存補位，這批等報告合格再出"], "a": 2, "y": "找到同時解決兩邊顧慮的做法，衝突才會真正結束；只裁決一方，另一方的顧慮還在。"}], [{"k": "tool", "t": "衝突處理四步", "i": ["分開聽", "找事實", "找共同目標", "訂做法並追蹤"], "back": ["回想最近一次衝突，用四步重新檢視。"]}, {"k": "reflect", "q": "你最近處理過的一次衝突，有什麼可以做得更好？"}, {"k": "take", "t": "先處理情緒，再處理事情。"}]], "C-10": [[{"k": "head", "t": "案例：待驗原料被先用了", "g": "能做出你職務的判斷、排出處置順序，並和其他職務對照。"}, {"k": "story", "who": "案發經過", "t": "週三早上，果醬線缺冷凍草莓，組員從待驗區拿了一批先投料。下午驗收快篩結果異常，這批原料已經做成 1,200 瓶果醬，其中 600 瓶已裝箱入庫。冷凍草莓 07:30 才到廠，驗收約需 4 小時，果醬線 08:00 開線。"}], [{"k": "table", "t": "時間線（示意）", "head": ["時間", "事件"], "rows": [["07:30", "冷凍草莓到廠，放待驗區"], ["08:00", "果醬線開線，缺料，組員從待驗區取用"], ["14:00", "驗收快篩異常"], ["當下", "1,200 瓶：600 瓶入庫、600 瓶在線上"]], "note": "示意數據。"}, {"k": "recall", "key": "c10-r0", "q": "物料狀態標示常見哪幾種？", "a": "待驗、可使用、不合格（待處理）、待報廢；顏色與標示依廠內規定，待驗品不得使用。"}, {"k": "recall", "key": "c10-r1", "q": "原料什麼時候才能投料？", "a": "驗收合格、狀態改為「可使用」之後。"}], [{"k": "byrole", "r": {"prod": [{"k": "quiz", "key": "c10-prod", "star": 2, "q": "驗收需要 4 小時，果醬線 08:00 開線。冷凍草莓最晚要幾點到廠？", "o": ["07:30", "04:00", "前一天 20:00"], "a": 1, "y": "08:00 − 4 小時＝04:00。驗收時間沒有排進去，07:30 到廠就一定來不及；前一天到廠也可以，但不是「最晚」。"}], "qa": [{"k": "quiz", "key": "c10-qa", "star": 2, "q": "1,200 瓶要怎麼處理？", "o": ["只隔離入庫的 600 瓶", "1,200 瓶全部隔離，確認檢驗結果後依程序判定", "快篩只是初篩，先出貨"], "a": 1, "y": "所有用到這批原料的成品都在範圍內；快篩異常要確認，結果出來前一律不得出貨。"}], "line": [{"k": "quiz", "key": "c10-line", "star": 2, "q": "組員為什麼分不出待驗與可用？最有效的改善是？", "o": ["口頭提醒", "待驗區實體隔離並明確標示，領料時要確認「可使用」標示", "讓組員自己判斷"], "a": 1, "y": "分區不清、標示不明，就會有人在趕時間時拿錯。實體隔離加上領料確認，讓錯誤很難發生。"}]}}], [{"k": "order", "key": "c10-o", "t": "待驗原料被誤用後的處理順序", "i": ["停止使用這批原料", "隔離 1,200 瓶成品與剩餘原料", "確認檢驗結果（複驗）", "依結果判定處置", "改善分區標示與領料規則", "生管把驗收時間排進排程"], "y": "先止血與隔離，再確認結果；最後從標示和排程兩頭改，才不會再因為缺料而誤用。", "s": "從下午快篩結果異常那一刻開始，排出 6 個步驟。"}], [{"k": "roles", "r": {"prod": "生管：排程為什麼會缺料？驗收與放行的時間有沒有排進去？", "qa": "衛管：1,200 瓶要怎麼隔離與判定？驗收為什麼來不及？", "line": "生產主管：為什麼組員分不出待驗與可用？標示與分區哪裡要改？"}}, {"k": "reflect", "q": "寫下你的職務明天就能做的一件事，月會時和其他職務對照。"}]], "T-11": [[{"k": "head", "t": "管理人：時間管理", "g": "能用四象限排出每天的優先順序。"}, {"k": "ben", "me": "管好時間，你才有空做真正重要的事。", "co": "預防做得好，緊急事件變少。"}, {"k": "predict", "key": "p-T11n", "q": "生產主管這個月每天加班處理異常，組員訓練、換線改善都沒進度。最需要先做的是？", "o": ["申請增加人手", "每週固定保留一段時間，做訓練、改善這類預防的事", "先把異常處理完，下個月再做改善"], "a": 1, "r": "一直在處理緊急事件，往往是重要但不緊急的事被擠掉了；不先保留時間做預防，下個月還是一樣忙。"}], [{"k": "points", "h": "重點", "i": ["用重要／緊急分成四類。", "先處理重要且緊急的事，再排時間做重要但不緊急的事，例如訓練與預防。", "每天開工前寫下今日三件要事；能交辦的就交辦。"]}, {"k": "flip", "key": "f-T11", "x": "主管每天都很忙，代表很有效率。", "r": "一直在處理緊急事件，代表預防工作沒做；忙不等於有成效。"}], [{"k": "fact", "t": "這個方法常被稱為「艾森豪矩陣」。重要但不緊急的事一直被拖延，就會變成下一個緊急事件。"}, {"k": "adv", "t": "主管的時間", "i": ["每週五花 10 分鐘，規劃下週要做的重要但不緊急的事。", "把會議集中在固定時段，保留完整的現場時間。", "處理完緊急事件後，回頭問：能不能預防它再發生？", "每天結束前，檢查三件要事完成了幾件。"]}], [{"k": "table", "t": "一位主管一週 40 小時", "head": ["項目", "時間"], "rows": [["處理異常", "14 小時"], ["會議", "8 小時"], ["現場巡線", "10 小時"], ["文書", "6 小時"], ["訓練組員", "1 小時"], ["改善專案", "1 小時"]], "note": ""}, {"k": "quiz", "key": "q-T11", "star": 2, "q": "哪兩項最屬於「重要但不緊急」，卻被擠壓了？", "o": ["會議與文書", "訓練組員與改善專案", "處理異常與巡線"], "a": 1, "y": "訓練與改善是減少未來異常的關鍵，卻只占 2 小時；處理異常占 14 小時，正是預防做太少的結果。"}], [{"k": "tool", "t": "每日三件要事", "i": ["開工前寫下今天最重要的三件事", "每週排一件重要但不緊急的事", "下班前檢查完成了幾件"], "back": ["檢查你這週的行事曆，有沒有排訓練或改善的時間。"]}, {"k": "reflect" 久」這個題目開始，排出提案的 5 個步驟。"}], [{"k": "roles", "r": {"prod": "生管：用哪一個數據證明這個問題存在？", "qa": "衛管：這項改善會不會影響食安管制？", "line": "生產主管：現場要改變哪一個動作？"}}, {"k": "reflect", "q": "寫下你的職務明天就能做的一件事，月會時和其他職務對照。"}]]}, "weeks": {"prod": ["BOM 的意義與應用", "前置時間：進貨到出貨", "工時計算", "人時產能", "節拍與產線平衡", "瓶頸與產能", "食安限制下的排程", "換線縮短與七大浪費", "插單評估與產銷協調", "異常的連鎖影響", "需求預測與淡旺季", "安全庫存與 MRP", "效期管理：先到期先出、庫齡與即期品", "批號、效期與追溯", "KPI：達交率與 OEE", "從排程看成本"], "qa": ["優格流程、CCP 與乳酸菌", "優格冰流程：PRP 與 OPRP", "果醬流程與 CCP", "病原菌與殺菌原理", "GHP：人員與環境", "環境監測與李斯特菌", "原料驗收與 COA 判讀", "設備校正與量測可信度", "偏離處置與損失擴大", "GHP：清潔、病媒、用水", "添加物、標示與效期", "過敏原管理", "非登不可、非追不可與模擬回收", "成品檢驗、放行與留樣", "稽查、不符合事項與客訴", "教育訓練與跨部門溝通"], "line": ["線上主管要懂的 HACCP／GHP", "工作教導 JI（一）", "工作教導 JI（二）", "回報：何時報、報什麼", "物料狀態標示、首件與交班", "清潔死角與離牆離地", "交叉汙染與零件遺失", "職安：冷凍庫、機械、化學品", "異常處理與損失擴大", "良率與損耗", "人力配置與人力成本", "回饋與獎懲", "SOP 與設備基本保養", "5S、目視管理與早會", "食品廠常見違規與後果", "稽查現場應對"], "common": ["管理人：從做事到帶人", "勞基法：工時、休息與加班", "管理人：交辦與追蹤", "管理人：報告與會議", "勞基法：特休與請假", "管理人：跨部門溝通", "勞基法：輪班與換班間隔", "管理人：回饋與績效面談", "勞基法：工作規則與懲處", "管理人：衝突處理", "管理人：時間管理", "勞基法：職災與主管責任", "管理人：寫改善提案", "管理人：向上管理", "勞基法：新進、試用與離職", "管理人：培養接班人"]}, "caseTitles": ["換線延誤", "新人操作失誤", "優格發酵異常", "生乳延遲到貨", "效期印錯", "環境採樣陽性", "過敏原漏標", "溫度計校正過期", "檢測機被關掉", "待驗原料被先用了", "旺季缺人", "冷凍庫斷電", "攪拌刀缺角", "客訴異物", "稽查前一天", "14 週總檢討"], "factory": {"intro": "課程裡的雪坊情境、人物與數字都是示意，用來練習判斷，不代表公司實際數據。", "lines": [], "kpi": [], "people": [["生產主管", "新任生產組長", "剛從資深作業員升上來，什麼都想自己做。"], ["生管", "資深生管", "排程高手，每天被插單追著跑。"], ["衛管", "衛生管理負責人", "做事仔細，最在意紀錄有沒有確實。"]]}, "orient": {"relay": {"steps": ["業務訂單與預測", "生管排程與備料", "生產主管帶班生產", "衛管驗收與放行", "出貨給客戶"], "note": "任何一棒掉了，後面都會受影響。這也是每週五三個職務要一起討論同一個案例的原因。"}, "prod": {"title": "生管：工廠的節拍器", "duty": ["依訂單與預測排定生產計畫。", "計算備料，追蹤原料與包材到位。", "追蹤生產進度與交期。", "協調業務、產線、衛管與倉庫。", "管控庫存與效期，減少報廢。"], "why": ["排程決定產線什麼時候做什麼，直接影響交期、成本與報廢。", "排錯一次，產線、倉庫、業務都要一起收拾。"], "take": "業務的訂單與預測、採購的物料到貨。", "give": "給生產主管可執行的排程，給衛管安排放行的時間，給業務可靠的交期。"}, "qa": {"title": "衛管：食品安全的守門員", "duty": ["執行 HACCP 與 GHP，監控每個 CCP。", "原料與成品驗收，判定能不能放行。", "環境監測與清潔確認。", "把關法規、標示與食品添加物。", "處理客訴、回收與稽核。"], "why": ["每一批產品能不能出廠，由衛管把關。", "一次食安事件，可能讓多年建立的品牌信任消失。"], "take": "法規、客戶要求與本廠 HACCP 計畫。", "give": "給產線清楚、做得到的標準，給生管放行結果與時間，給客戶安全的產品。"}, "line": {"title": "生產主管：把計畫變成產品的人", "duty": ["帶班生產，達成產量與品質。", "調度人力，教導新人。", "落實 SOP、CCP 監控與紀錄。", "第一時間處理並回報異常。", "維持 5S 與職場安全。"], "why": ["排程與標準最後都要靠現場做出來。", "主管是公司與作業員之間的橋樑；現場做得好不好，大多取決於主管。"], "take": "生管的排程、衛管的標準與要求。", "give": "給生管與衛管現場的真實狀況，把合格的產品交給下一站。"}, "how": ["每週一開放整週 5 關：概念、應用、練習、共同課、案例。", "打開就會跳到你的下一關，一天一關最剛好。", "進度和筆記只存在你自己的手機，別人看不到。", "畫底線的名詞，點一下就有白話解釋。"]}, "gloss": {"BOM": "物料清單：做一個成品需要哪些原料、包材，各要多少。", "MRP": "物料需求計畫：依生產計畫與 BOM，算出什麼時候要備多少料。", "FIFO": "先進先出：先入庫的先用。", "FEFO": "先到期先出：最早到期的先用，短效期原料適用。", "OEE": "整體設備效率＝稼動率 × 性能率 × 良率，衡量設備真正有效產出的比例。", "SMED": "快速換線法：把能在停機前做的準備先做好，縮短停機時間。", "CCP": "重要管制點：一旦失控就可能造成食安危害、必須監控的步驟，例如殺菌。", "HACCP": "危害分析重要管制點：找出危害、設定管制點並持續監控的食安管理制度。", "GHP": "食品良好衛生規範：人員、環境、設備、倉儲等基本衛生要求。", "SIP": "原位殺菌：不拆設備，直接用熱水或蒸汽對管路與設備殺菌。", "CIP": "原位清洗：不拆設備，讓清潔液在管路中循環清洗。", "pH": "酸鹼值：7 是中性，數字越小越酸。", "Brix": "糖度：溶液中可溶性固形物（主要是糖）的百分比。", "ATP": "快速檢測表面還有沒有有機物殘留，幾分鐘就有結果。", "PCR": "分子檢測方法，能快速篩檢特定病原菌的基因。", "JI": "工作教導：用四個步驟有效教會新人的方法。", "SBI": "回饋模型：情境（Situation）、行為（Behavior）、影響（Impact）。", "LOTO": "上鎖掛牌：維修或清潔前切斷能源並上鎖，防止別人誤開機。", "SDS": "安全資料表：說明化學品的危害、防護與緊急處理方式。", "TOC": "限制理論：找出並改善最大限制（瓶頸）的管理方法。", "KPI": "關鍵績效指標：用來衡量目標達成程度的數字。", "PDCA": "計畫、執行、檢查、改善的循環。", "5S": "整理、整頓、清掃、清潔、素養。", "節拍時間": "為了剛好滿足需求，每隔多久要做出一個產品。", "週期時間": "一個工站實際做完一個產品需要的時間。", "前置時間": "從開始到完成（例如下單到出貨）總共花的時間。", "人時": "一個人工作一小時；4 個人做 2 小時＝8 人時。", "在製品": "已經開始加工、還沒變成成品的半成品。", "膨脹率": "優格冰凝凍時打入空氣，使體積增加的比例。", "巴氏殺菌": "用適當的溫度與時間加熱，殺滅病原菌，同時保留風味。", "管制界限": "CCP 必須符合的標準值，例如最低溫度與時間。", "矯正措施": "發現偏離後，處理受影響產品並排除原因的行動。", "柏拉圖": "把不良原因依次數由多到少排列的圖，用來找出主要問題。", "稼動率": "設備實際運轉時間占計畫時間的比例。", "性能率": "實際生產速度與標準速度的比例。", "良率": "良品占投入數量的比例。", "追溯": "用批號找出原料來源與產品去向。", "首件檢查": "開機或換線後，對第一批產品做全面確認。", "熱衝擊": "冷凍品反覆回溫又冷凍，造成冰晶變大、口感變粗。", "凝凍": "優格冰一邊冷凍、一邊攪拌打入空氣的步驟。", "均質": "用高壓把脂肪球打碎變小，讓口感滑順、結構穩定。", "指標菌": "用來判斷整體衛生狀況的菌，例如大腸桿菌群。", "生菌數": "樣品中可以培養出的細菌總數。", "技能矩陣": "列出每個人會哪些工站、熟練程度的表。", "熱充填": "趁產品還很熱時充填封蓋，降低汙染機會。", "凍結期": "排程前一段時間內不接受變更，讓備料穩定。", "艾森豪矩陣": "依「重要」和「緊急」把事情分成四類的方法。", "PRP": "前提方案：維持食品安全所需的基本條件與活動，例如人員衛生、清潔、病媒防治、用水。", "OPRP": "操作性前提方案：針對危害分析判定的顯著危害，用「行動準則」管控的措施；偏離時要評估產品。", "行動準則": "OPRP 用來判斷管控是否有效的可量測或可觀察標準。", "COA": "檢驗報告（Certificate of Analysis）：供應商提供的批次檢驗結果。", "生物膜": "細菌附著在表面並包上一層保護膜，一般沖洗很難去除。", "安全庫存": "為了應付需求波動與交期延誤，額外保留的庫存。", "正向放行": "確認檢驗與紀錄都合格之後，才允許產品出廠。", "留樣": "每批成品保留的樣品，用來在客訴或異常時比對。", "允收期": "客戶收貨時要求產品至少還剩多少效期，常用比例表示。", "庫齡": "產品或原料入庫到現在的天數。", "即期品": "剩餘效期已經不多、需要優先處理的原料或產品。", "食品防護": "防止有人蓄意破壞或汙染食品的管理措施。", "食品詐欺": "原料被摻假、以次充好或不實標示，以謀取經濟利益的行為。"}, "flows": {"chain": {"name": "農場到出貨", "start": {"t": "源頭：農場與牧場", "i": "水果、生乳等原料的品質與安全，從種植和飼養就開始。選擇供應商時，要了解他們的用藥與管理方式。"}, "end": {"t": "交給消費者", "i": "這套課程聚焦在工廠內到出貨為止。產品到了消費者手上，任何一段沒守住，結果都由消費者承擔。"}, "steps": [{"n": "供應商管理", "k": "衛管・採購", "p": "選對供應商，源頭就把風險降低。", "c": "供應商評核、原料規格書、定期稽核。", "r": "源頭有農藥、動物用藥或摻假問題，後面再怎麼做都救不回來。"}, {"n": "原料驗收與放行", "k": "衛管", "p": "確認這一批符合規格才能使用。", "c": "核對 COA、現場檢查、抽驗；合格才貼放行標示。", "r": "不合格原料流入產線，影響所有用到它的成品。"}, {"n": "原料倉儲", "k": "倉管・生管", "p": "維持原料品質直到使用。", "c": "溫度紀錄、先到期先出、物料狀態分區標示。", "r": "過期或狀態不明的原料被誤用。"}, {"n": "生產", "k": "生產主管", "p": "依標準做出安全的產品。", "c": "CCP 與 OPRP 監控、清潔、首件、交叉汙染管制。", "r": "偏離沒被發現，整批產品都可能不安全。"}, {"n": "成品檢驗與放行", "k": "衛管", "p": "確認整批合格才出廠。", "c": "紀錄審查、檢驗、正向放行、留樣。", "r": "先出貨再發現不合格，只能從客戶手上回收。"}, {"n": "成品入庫", "k": "倉管・生管", "p": "保存條件正確，效期管理清楚。", "c": "冷藏冷凍溫度、離牆離地、庫齡與即期品管理。", "r": "回溫、滯留過久，或剩餘效期不符客戶要求。"}, {"n": "出貨", "k": "物流", "p": "冷鏈不中斷，把產品完整交出去。", "c": "車輛預冷、溫度紀錄、出貨核對批號與效期。", "r": "溫度失控或送錯批號，前面的努力就白費。"}], "qc": "整條鏈的共同語言是「批號」：每一段都留下批號紀錄，出事時才能在幾小時內追到源頭與去向。"}, "yogurt": {"name": "優格", "start": {"t": "開工前：SIP 熱水殺菌", "i": "以熱水對管路與設備殺菌，確認殺菌溫度、時間與清潔都完成並記錄，才可開機。"}, "end": {"t": "收工後：CIP 清潔", "i": "一般流程為預沖洗 → 鹼洗 → 沖洗 → 酸洗 → 沖洗。最後以 pH 試紙或導電度確認沖洗水恢復中性、無清潔劑殘留，並記錄。"}, "steps": [{"n": "原料驗收", "k": "效期、溫度", "p": "確保生乳安全與新鮮。", "c": "核對效期、量測溫度、檢查包裝與供應商文件，填寫驗收紀錄。", "r": "溫度過高或效期不足時，拒收或隔離待判定。"}, {"n": "倉儲", "k": "", "p": "維持原料品質直到使用。", "c": "冷藏在 7°C 以下、凍結點以上；標示批號與到期日。", "r": "冷藏庫溫度異常、不同批混放。"}, {"n": "倒料", "k": "先進先出", "p": "依序使用原料，並保留追溯資料。", "c": "依批號與效期順序取用，記錄投料批號。", "r": "跳批使用，舊批過期報廢；投料批號沒記錄，無法追溯。"}, {"n": "加熱（巴氏殺菌）", "k": "", "ccp": 1, "p": "殺滅病原菌，並讓乳清蛋白變性，提升優格稠度。", "c": "溫度與時間連續監控並記錄，依本廠 HACCP 計畫的管制界限判定。", "r": "溫度不足或紀錄中斷：立即隔離、評估，無法證實就不得放行。"}, {"n": "冷卻", "k": "", "p": "降到適合接菌的溫度。", "c": "確認冷卻後的溫度並記錄。", "r": "冷卻不足或過度，影響發酵。"}, {"n": "加乳酸菌", "k": "", "p": "加入菌種啟動發酵。", "c": "菌種品項、批號、效期與添加量，雙人確認。", "r": "投入量錯誤；菌種保存不當造成活性下降。"}, {"n": "充填", "k": "效期、重量", "p": "把優格分裝到杯中。", "c": "首件確認杯、蓋、標籤、效期；抽檢封口與重量。凝固型優格充填後要盡快進入發酵室。", "r": "封口不良、效期印錯、重量不足、充填後等待過久。"}, {"n": "發酵", "k": "", "p": "乳酸菌產酸，使乳蛋白凝結成形。", "c": "記錄發酵室溫度、時間與終點 pH（常見發酵溫度約 42–43°C，依本廠規格）。", "r": "發酵過長或過短，造成酸度與質地異常。"}, {"n": "冷藏", "k": "", "p": "快速降溫，停止發酵並保存。", "c": "冷藏在 7°C 以下，記錄溫度。", "r": "降溫太慢會持續產酸，產品變酸（後酸化）。"}, {"n": "出貨", "k": "效期", "p": "把合格產品送到客戶手上。", "c": "確認放行狀態、效期、批號，以及出貨與車廂溫度。", "r": "等車過久造成溫度上升。"}], "qc": "質地（凝結狀態、是否離水）、pH（確認發酵終點）、品評（風味、酸度、口感），並確認效期與重量。不合格品隔離待判定。"}, "icecream": {"name": "優格冰", "start": {"t": "開工前：熱水清洗機器", "oprp": 1, "i": "開工前的熱水清洗是保護產品的關鍵。依本廠規定的溫度使用煮過的熱水，讓熱水流過冰淇淋機內部完成清洗，並在出水口確認水溫達本廠規定的下限，記錄水溫與時間；出水溫度未達下限不得投產，要重新清洗並通知衛管。秤具、均質機、冷藏桶也要確認清潔乾燥。"}, "end": {"t": "收工後：拆洗與消毒", "i": "當日最後一個口味完成後，拆洗冰淇淋機與充填機接觸面、消毒並記錄；清點拆下的零件與工具，確認沒有遺失或破損，再組回或歸位。"}, "steps": [{"n": "備料", "k": "先進先出、確認今日口味", "p": "依今天的排程準備原料與包材，避免用錯料、用到過期料。", "c": "核對今日口味與數量；原料依先進先出取用，同時確認效期，快到期的優先使用；包材與標籤要和口味一致。", "r": "拿錯口味的香料或醬料；效期過期或沒標開封日；標籤版本拿錯。發現就退回並通知生管。"}, {"n": "秤料", "k": "雙人核對", "p": "依配方準確秤量每一種原料。", "c": "使用校正有效期內的秤；照配方逐項秤量並勾選，雙人核對；含過敏原的原料（例如堅果、蛋）分開秤、分開放。", "r": "漏加或重複加料；秤具未歸零；過敏原原料混用工具。發現時停止投料，通知主管與衛管判定。"}, {"n": "均質", "k": "", "p": "把脂肪球打碎變小，讓口感滑順、結構穩定。", "c": "記錄均質壓力與溫度；確認混合液沒有結塊或分層。", "r": "壓力不足造成口感粗糙、油水分離。優格冰依本廠 HACCP 計畫管控，均質機的清潔與原料品質特別重要。"}, {"n": "冷藏備用", "k": "溫度、時間", "p": "讓混合液降溫並暫存，等待上機製冰。", "c": "冷藏在 7°C 以下；容器標示口味、批號與製作時間；依本廠規定的存放時間上限使用，先做的先用。溫度和時間是抑制雜菌的重要防線，依本廠 HACCP 計畫管控。", "r": "冷藏溫度偏高，或放太久超過時限：隔離並交衛管評估。容器沒標示：無法確認時間就不得使用。"}, {"n": "冰淇淋機入料製冰", "k": "膨脹率", "p": "一邊冷凍、一邊攪拌打入空氣，形成優格冰的口感與體積。", "c": "入料前確認口味與容器標示一致；監控出料溫度與膨脹率；機器運轉中不可伸手進入。", "r": "膨脹率過高，產品偏輕、可能不符標示淨重；出料太軟，後段成形不好。依規格調整並記錄。"}, {"n": "依規格裝填（秤重）", "k": "淨重、標籤、效期", "p": "把優格冰裝成規格包裝，並確認重量與標示正確。", "c": "開機與換口味後做首件確認：口味、標籤、效期、批號、過敏原標示；依頻率抽檢淨重，看平均也看最小值。", "r": "重量不足、標籤或效期印錯：停機調整，隔離可疑產品並重新確認。"}, {"n": "急速冷凍", "k": "越快越好", "p": "快速把產品降到冷凍溫度，讓冰晶保持細小、口感滑順。", "c": "裝填後盡快送進急凍設備，不在室溫等待；記錄急凍時間與產品溫度。", "r": "等待太久或急凍溫度不足：冰晶變大、口感變粗；表面融化又冷凍要交衛管評估。"}, {"n": "換口味洗機器", "k": "淺到深、無過敏原先做", "p": "避免口味混雜與過敏原交叉接觸。", "c": "排程原則：淺色先、深色後；不含過敏原的先做，含過敏原的放最後。換口味時拆洗接觸面、清線確認並記錄；拆下的零件要清點。", "r": "洗不乾淨造成口味殘留或過敏原交叉接觸；零件遺失沒發現可能混入產品。零件找不到時，立即停線並隔離產品。"}, {"n": "入庫", "k": "−18°C 以下、離牆離地", "p": "把成品存放在穩定的冷凍環境，等待出貨。", "c": "冷凍庫 −18°C 以下並記錄；棧板離牆離地、不擋出風口；依批號與效期擺放，先到期的放出口端。", "r": "庫溫波動或靠牆堆放造成局部回溫：量產品溫度並交衛管評估。"}, {"n": "出貨", "k": "冷鏈、效期", "p": "把合格產品安全送到客戶手上。", "c": "確認產品已放行；核對效期、批號與數量；記錄出庫到上車的時間與車廂溫度，盡量縮短等車時間。", "r": "等車過久表面融化：不可直接再冷凍出貨，要交衛管評估。"}], "qc": "秤重（淨重是否符合標示，也反映膨脹率）、品評（外觀、冰晶口感、風味），並確認效期標示正確。"}, "jam": {"name": "果醬", "start": {"t": "開工前：設備與器具清潔", "i": "確認烹煮鍋、刀具、砧板、充填設備已清潔消毒；清點刀具數量並記錄。"}, "end": {"t": "收工後：清潔與刀具清點", "i": "拆洗設備與器具、消毒並記錄；再次清點刀具，確認沒有遺失或破損。"}, "steps": [{"n": "驗收", "k": "農藥、效期", "p": "確保水果原料安全。", "c": "確認農藥殘留檢驗報告或快篩紀錄、效期、外觀；冷凍原料要量測溫度。", "r": "農藥超標或腐爛比例過高時拒收。"}, {"n": "挑選", "k": "", "p": "去除腐爛、破損、發霉的水果。", "c": "依標準樣品或照片判定，記錄剔除量。", "r": "發霉原料混入，可能帶有真菌毒素。"}, {"n": "清洗", "k": "", "p": "去除泥沙、灰塵與表面汙染。", "c": "用水符合標準；清洗方式與時間依標準作業。", "r": "清洗不足，殘留泥沙或汙染。"}, {"n": "挑選", "k": "異物、昆蟲", "p": "清洗後再次挑出異物與昆蟲。", "c": "光源充足；記錄異物的種類與數量。", "r": "漏挑，造成客訴。"}, {"n": "裁切／退冰", "k": "", "p": "處理成適合烹煮的大小與狀態。", "c": "刀具清點與破損檢查；退冰在控溫環境下進行。", "r": "刀具碎片混入；退冰溫度過高讓微生物增生。"}, {"n": "烹煮", "k": "", "ccp": 1, "p": "濃縮、殺菌，並讓果膠形成凝膠。", "c": "溫度與時間記錄，依本廠 HACCP 計畫的管制界限判定。", "r": "加熱不足時隔離評估。"}, {"n": "糖度", "k": "", "p": "確認濃縮程度，影響保存性與凝膠。", "c": "用糖度計測 Brix，達規格才停止烹煮並記錄。", "r": "糖度不足，保存性與凝膠不良。"}, {"n": "裝瓶", "k": "效期、重量", "p": "熱充填並封蓋。", "c": "確認充填溫度、瓶蓋封合；首件確認標籤與效期；抽檢重量與異物。", "r": "封蓋不良、效期印錯、重量不足。"}], "qc": "pH function shuf(k,n){ let h=7; for(const ch of k) h=(h*131+ch.charCodeAt(0))%2147483647; const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){ h=(h*48271)%2147483647; const j=h%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.every((v,i)=>v===i)) a.reverse(); return a; }
function orderHTML(b,S){

    h+=`<p class="small">依序點選下面的步驟（已選 ${pick.length}／${n}）。</p>`;

  } else {
    const ok=pick.filter((v,i)=>v===i).length;
    h+=`<div class="why ${ok===n?"ok":"no"}">${ok===n?praise(b.key).replace("答對","排對"):`排對 ${ok}／${n} 個位置，看看正確順序：`}<span>${gl(b.y,S)}</span></div>`;
    h+=`<ol class="ord-res">${b.i.map((t,i)=>`<li class="${pick[i]===i?"r":"w"}">${esc(t)}${pick[i]===i?"":` <small>（你排的是：${esc(b.i[pick[i]])}）</small>`}</li>`).join("")}</ol>`;
    h+=`<button type="button" class="btn ghost" data-act="ordreset" data-key="${b.key}">再排一次</button>`;

function calcHTML(b){

  if (b.kind==="bom") return box("試算：備料夠不夠", f("qty","生產數量（杯）")+f("use","每杯用量（g）")+f("loss","損耗率（%）")+f("stock","庫存（kg）")+f("transit","在途（kg）"), "outs");

}
function updateWidget(){

  } else if (w==="loss"){

    box.innerHTML=st.map((s,i)=>`<div><div class="lab"><span>${s[0]}</span><span>${n(v[i])} 元${i&&v[0]?" · "+(v[i]/v[0]).toFixed(0)+" 倍":""}</span></div><div class="track"><i style="width:${v[i]/mx*100}%"></i></div></div>`).join("")+`<p class="small">示範數字可修改，未計入商譽損失。</p>`;
  } else if (w==="manhour"){

  } else if (w==="takt"){

  } else if (w==="oee"){
    const o=calc.av*calc.pf*calc.ql/10000, fs_=[["稼動率",calc.av],["性能率",calc.pf],["良率",calc.ql]], low=fs_.reduce((a,b)=>b[1]<a[1]?b:a);
    box.innerHTML=`<div><span>OEE</span><b>${o.toFixed(1)}%</b><span>三者相乘</span></div><div><span>優先改善</span><b style="font-size:1rem">${low[0]}</b><span>三個因子中最低</span></div>`;
  }
}

  const slides = L.map(sl=>sl.map(b=>block(b,c,S)).join(""));
  const mins=Math.max(1,Math.ceil(slides.reduce((n,s)=>n+stripLen(s),0)/350));
  return {id, slides, doneLabel:"完成這一關", mins};
}

/* ---------- 每週錯題回顧 ---------- */
function weekWrong(w){
  const out=[];
  for (let d=0; d<5; d++){
    const key = d<3 ? `${role}-${w}-${d}` : d===3 ? `T-${w}` : `C-${w}`, L=D.lessons[key]; if(!L) continue;
    const walk=b=>{ if(b.k==="byrole") (b.r[role]||[]).forEach(walk);
      else if(b.k==="quiz" && quiz[b.key]!==undefined && quiz[b.key]!==b.a) out.push({b,d});
      else if(b.k==="order"){ const p=orders[b.key]||[]; if(p.length===b.i.length && p.some((v,i)=>v!==i)) out.push({b,d}); } };
    L.forEach(sl=>sl.forEach(walk));
  }
  return out;
}
function renderReview(){
  const {w}=review, items=weekWrong(w);
  if (!items.length){ review=null; return renderToday(); }
  if (review.i>=items.length) review.i=items.length-1;
  const it=items[review.i], last=review.i===items.length-1, S=new Set();
  const body=block(it.b,{w,d:it.d,id:"rev"},S).replace(/<button type="button" class="btn ghost" data-act="ordreset"[^>]*>[^<]*<\/button>/,"");
  const dots=items.map((_,i)=>`<i class="${i===review.i?"on":""}"></i>`).join("");
  return `<div class="hero"><div class="top"><span class="wk">第 ${w} 週 · 錯題回顧</span><span class="wk">${review.i+1} / ${items.length}</span></div><div class="tt">🏅 第 ${w} 週完成！看一下答錯的題目</div><div class="soft">紅色是當時選的，綠色是正確答案，看完解析就好，不用重新作答。</div></div>
  <section class="deck" id="deck"><div class="slide" id="slide"><div class="eyebrow">${esc(eyebrow({w,d:it.d}))}</div>${body}</div>
  <div class="deckfoot"><div class="dots">${dots}</div><div class="nav2"><button type="button" class="btn ghost" data-act="revprev" ${review.i===0?"disabled":""}>上一題</button>${last?`<button type="button" class="btn primary" data-act="revdone">看完了 ▶</button>`:`<button type="button" class="btn primary" data-act="revnext">下一題</button>`}</div></div></section>`;
}

  const medalPart=`${medalNoteHTML()}<section class="card"><h3>週獎章 · ${medalsN} 枚</h3><p class="small">金 ${tn.gold} · 銀 ${tn.silver} · 銅 ${tn.bronze}。5 關完成是銅牌；題目都答完、錯題也看過是銀牌；第一次作答就全對是金牌。</p><div class="medals2">${medals}</div></section>`;
  const revPart=(()=>{ const L=Array.from({length:WEEKS},(_,i)=>i+1).filter(x=>weekDone(x)===5).map(x=>[x,weekWrong(x).length]); if(!L.length) return "";
    return `<section class="card"><h3>錯題回顧</h3><p class="small">完成一整週後，可以回來看當時答錯的題目。</p><div class="revlist">${L.map(([x,k])=>k?`<button type="button" class="btn ghost" data-act="wrongs" data-w="${x}">第 ${x} 週 · 錯 ${k} 題</button>`:`<span class="revok">第 ${x} 週 · 全對 ✓</span>`).join("")}</div></section>`; })();
  const notePart=`<section class="card"><h3>我的筆記</h3><div class="notes">${nlist}</div></section>`;
  const progPart=`${firstHint}${ringHTML}${revPart}
  <section class="card"><h3>完整目錄</h3><p class="small">所有週次都可以點開。標日期的週次是建議閱讀時間，想先看也沒問題。</p><div class="cat">${cat}</div></section>
  <section class="card"><h3>備份我的進度</h3><p class="small">進度只存在這支手機的這個瀏覽器。換手機、換瀏覽器或清除資料前，先複製進度碼存起來（例如傳給自己），之後貼回來就能還原，三個職務的進度都在裡面。</p>
    <div class="bk"><code id="bk-code">${esc(backupCode())}</code><button type="button" class="btn ghost" data-act="bkcopy">複製進度碼</button></div>
    <div class="bk"><input id="bk-in" type="text" placeholder="貼上進度碼" autocomplete="off"><button type="button" class="btn" data-act="bkload">還原</button></div>
    <p class="small" id="bk-msg" aria-live="polite"></p></section>
  <button type="button" class="btn" data-act="open" data-w="0" data-d="0">重看職務開場</button>`;
  return seg + (pt==="medal" ? medalPart : pt==="note" ? notePart : progPart);
}
/* ---------- 進度碼 ---------- */
function bkKeys(){ const k=["ori-prod","ori-qa","ori-line"]; for(const r of ["prod","qa","line"]) for(let w=1;w<=WEEKS;w++) for(let d=0;d<3;d++) k.push(`${r}-${w}-${d}`); for(let w=1;w<=WEEKS;w++){ k.push(`T-${w}`); k.push(`C-${w}`); } return k; }
function backupCode(){ const K=bkKeys(), by=new Uint8Array(Math.ceil(K.length/8)); K.forEach((k,i)=>{ if(done[k]) by[i>>3]|=1<<(i&7); });
  let b=""; by.forEach(x=>b+=String.fromCharCode(x)); return "XF1-"+btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function restoreCode(c){ c=String(c||"").trim(); if(!/^XF1-[A-Za-z0-9_-]+$/.test(c)) return -1;
  let b; try{ b=atob(c.slice(4).replace(/-/g,"+").replace(/_/g,"/")); }catch(e){ return -1; }
  const K=bkKeys(); if(b.length!==Math.ceil(K.length/8)) return -1; let n=0;
  K.forEach((k,i)=>{ if((b.charCodeAt(i>>3)>>(i&7))&1){ if(!done[k]) n++; done[k]=1; } }); store.set("done",done); return n; }

/* ---------- 加工流程 ---------- */
function renderFlow(){
  const F=D.flows[flowKey], S=new Set();
  const btns=Object.entries(D.flows).map(([k,v])=>`<button type="button" data-flow="${k}" aria-pressed="${k===flowKey}">${v.name}</button>`).join("");
  const clean=(c,m)=>`<li class="clean ${c.oprp?"oprp":""}"><span class="n">${m}</span><details><summary><b>${esc(c.t)}</b>${c.oprp?`<span class="pill oprp">OPRP</span>`:""}<span class="pill cl">清潔</span><span class="more">展開</span></summary><dl class="det"><dt>確認內容</dt><dd>${gl(c.i,S)}</dd></dl></details></li>`;
  const steps=F.steps.map((s,i)=>`<li class="${s.ccp?"ccp":s.oprp?"oprp":""}"><span class="n">${String(i+1).padStart(2,"0")}</span><details><summary><b>${esc(s.n)}</b>${s.ccp?`<span class="pill ccp">CCP</span>`:""}${s.oprp?`<span class="pill oprp">OPRP</span>`:""}${s.k?`<span class="pill kw">${esc(s.k)}</span>`:""}<span class="more">展開</span></summary><dl class="det"><dt>目的</dt><dd>${gl(s.p,S)}</dd><dt>管控重點</dt><dd>${gl(s.c,S)}</dd><dt>常見異常與處置</dt><dd>${gl(s.r,S)}</dd></dl></details></li>`).join("");
  return `<div class="eyebrow">雪坊三條產品線 · 點每一步看細節</div><div class="seg" role="group" aria-label="選擇產品">${btns}</div>
  <ol class="flow">${clean(F.start,"開工")}${steps}${clean(F.end,"收工")}</ol>
  <div class="qc"><b>衛管驗收</b>　${gl(F.qc,S)}</div>
  <p class="small">紅色為 CCP、橘色為 OPRP，僅供學習參考；實際分類與管制界限以本廠 HACCP 計畫為準。</p>`;
}

/* ---------- 共同知識 ---------- */
function fsHTML(){
  if (!FSI.length) return `<section class="card"><h3>食安事件</h3><p class="small">每週二更新一則可以查證的真實食安事件，整理成「發生什麼、根本原因、對應要求、如果在我們廠怎麼擋」。第一則預計 10/20（二）上線。</p></section>`;
  const s=[...FSI].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);
  return `<h3>食安事件</h3>`+s.map(e=>`<article class="reading fsx"><span class="src">${esc(e.date)} · ${esc(e.source||"")}</span>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:`<b>${esc(e.title)}</b>`}
    <dl>${[["發生什麼",e.happened],["根本原因",e.cause],["對應要求",e.req],["在我們廠怎麼擋",e.guard]].filter(x=>x[1]).map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>${e.q?`<div class="rq"><b>討論：</b>${esc(e.q)}</div>`:""}</article>`).join("");
}
function renderKnow(){
  const seg=[["news","每週更新"],["law","勞基法"],["tools","管理工具"]].map(([k,n])=>`<button type="button" data-k="${k}" aria-pressed="${k===kTab}">${n}</button>`).join("");
  let body="";
  if (kTab==="news"){
    body=`${fsHTML()}
      <h3>推薦閱讀</h3><p class="small">每週一、三、五更新。摘要是重點整理，完整內容請點標題閱讀原文。</p>`+
      D.readings.map(r=>`<article class="reading"><span class="src">${esc(r.date)} · ${esc(r.source)}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><p>${esc(r.sum)}</p><div class="rq"><b>討論：</b>${esc(r.q)}</div></article>`).join("");
  } else {
    const list=kTab==="law"?D.know.law:D.know.tools, S=new Set();
    body=`<div class="kcards">${list.map(c=>`<div class="kcard"><h4>${esc(c.t)}</h4><ul>${c.i.map(x=>`<li>${gl(x,S)}</li>`).join("")}</ul></div>`).join("")}</div>`;
    if (kTab==="law") body+=`<p class="small">資料日期 2026/10。速查僅供參考，請以<a href="https://law.moj.gov.tw/" target="_blank" rel="noopener">全國法規資料庫</a>最新原文與公司工作規則為準，實際處理前先和人資確認。</p>`;
  }
  return `<div class="eyebrow">三個職務共用 · 隨時查閱</div><div class="seg" role="group" aria-label="共同知識分類">${seg}</div>${body}`;
}

/* ---------- 繪製 ---------- */
function fitDeck(){
  const deckEl=document.getElementById("deck"); if(!deckEl) return;
  const top=deckEl.getBoundingClientRect().top, nav=document.querySelector("nav.tabs").offsetHeight;
  deckEl.style.height=Math.max(400, window.innerHeight-top-nav-14)+"px";
}
const STORE_OK=(()=>{ try{ const k="xf5-__t"; localStorage.setItem(k,"1"); const ok=localStorage.getItem(k)==="1"; localStorage.removeItem(k); return ok; }catch(e){ return false; } })();
const INAPP=/\bLine\/|FBAN|FBAV|Instagram|MicroMessenger|Teams\//i.test(navigator.userAgent||"");
function saveNotice(){
  if(!STORE_OK) return `<div class="savewarn"><b>這個瀏覽器無法保存進度</b>關掉後進度會不見。請改用 Safari 或 Chrome 開啟，並關閉「無痕模式」。</div>`;
  if(INAPP) return `<div class="savewarn"><b>你正在 App 內建的瀏覽器裡</b>關掉後進度可能會不見。請點右上角選單，選「用瀏覽器開啟」，再「加入主畫面」。</div>`;
  return "";
}
function render(keepScroll){
  const sc = keepScroll ? (document.getElementById("slide")?.scrollTop||0) : 0;
  document.documentElement.dataset.role=(tab==="flow"||tab==="know")?"common":role;
  document.documentElement.style.fontSize=(FS[fs]*100)+"%";
  document.querySelectorAll("button[data-role]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.role===role));
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const v=document.getElementById("view");
  v.innerHTML = (tab==="today"||tab==="prog"?saveNotice():"") + (tab==="today"?(review?renderReview():renderToday()):tab==="prog"?renderProg():tab==="flow"?renderFlow():renderKnow());
  const ta=document.getElementById("note"); if(ta) ta.value=notes[ta.dataset.id]||"";
  updateWidget(); fitDeck();
  if (keepScroll){ const s2=document.getElementById("slide"); if(s2) s2.scrollTop=sc; }
}
function nextSeq(w,d){ const s=seq(); const i=s.findIndex(x=>x.w===w&&x.d===d); return i>=0&&i<s.length-1 ? s[i+1] : null; }
function reviewBtns(w,d){
  const ns=nextSeq(w,d), nu=nextUnfinished();
  if (!ns) return nu ? `<button type="button" class="btn primary" data-act="gonext">回到最新進度 ▶</button>` : `<button type="button" class="btn primary" data-act="tabtoday">✓ 全部完成</button>`;
  return `<button type="button" class="btn primary" data-act="goseq" data-w="${ns.w}" data-d="${ns.d}">下一課 ▶</button>`;
}
function reviewRow(w,d){
  const ns=nextSeq(w,d), nu=nextUnfinished();
  if (!ns || (nu && nu.w===ns.w && nu.d===ns.d)) return "";
  return `<div class="revrow">${nu?`<button type="button" class="lnk" data-act="gonext">回到最新進度（第 ${nu.w} 週 · ${STEPN[nu.d]}）</button>`:`<button type="button" class="lnk" data-act="tabtoday">✓ 全部完成，回到今日關卡</button>`}</div>`;
}
function go(w,d){ viewing={w,d}; slide=0; celebrate=false; tab="today"; render(); window.scrollTo(0,0); }

document.addEventListener("click",e=>{
  const tm=e.target.closest(".term"); if(tm){ termSeen++; store.set("termSeen",termSeen); document.getElementById("sheet-t").textContent=tm.dataset.term; document.getElementById("sheet-p").textContent=D.gloss[tm.dataset.term]||""; document.getElementById("sheet").hidden=false; return; }
  if (e.target.id==="sheet"){ document.getElementById("sheet").hidden=true; return; }
  const r=e.target.closest("button[data-role]"); if(r){ review=null; role=r.dataset.role; store.set("role",role); viewing=null; slide=0; celebrate=false; render(); return; }
  const t=e.target.closest("button[data-tab]"); if(t){ tab=t.dataset.tab; if(tab==="today"){viewing=null;slide=0;celebrate=false;review=null;} render(); window.scrollTo(0,0); return; }
  const fl=e.target.closest("button[data-flow]"); if(fl){ flowKey=fl.dataset.flow; render(); return; }
  const k=e.target.closest("button[data-k]"); if(k){ kTab=k.dataset.k; render(); return; }
  const a=e.target.closest("[data-act]"); if(!a||a.disabled) return;
  const act=a.dataset.act;
  if (act==="closesheet") document.getElementById("sheet").hidden=true;
  else if (act==="fs"){ fs=Math.max(0,Math.min(FS.length-1,fs+(+a.dataset.v))); store.set("fs",fs); render(true); }
  else if (act==="next"){ slide++; render(); }
  else if (act==="prev"){ slide=Math.max(0,slide-1); render(); }
  else if (act==="open") go(+a.dataset.w,+a.dataset.d);
  else if (act==="done"){
    const id=a.dataset.id, c=current(); if (done[id]){ const n=nextUnfinished(); if(n) go(n.w,n.d); return; }
    done[id]=1; store.set("done",done); try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){} store.set("todayDone",{date:todayStr,role,w:c.w,d:c.d});
    viewing={w:c.w,d:c.d};
    if (c.w>0 && weekDone(c.w)===5 && !revSeen[role+"-"+c.w] && weekWrong(c.w).length){ revSeen[role+"-"+c.w]=1; store.set("revSeen",revSeen); review={w:c.w,i:0}; celebrate=false; render(); window.scrollTo(0,0); return; }
    celebrate=true; render();
  }
  else if (act==="revnext"){ review.i++; render(); }
  else if (act==="revprev"){ review.i=Math.max(0,review.i-1); render(); }
  else if (act==="revdone"){ const rw=review.w; review=null; viewing={w:rw,d:4}; slide=0; tab="today"; celebrate=true; render(); window.scrollTo(0,0); }
  else if (act==="wrongs"){ revSeen[role+"-"+a.dataset.w]=1; store.set("revSeen",revSeen); review={w:+a.dataset.w,i:0}; tab="today"; render(); window.scrollTo(0,0); }
  else if (act==="goseq"){ go(+a.dataset.w, +a.dataset.d); }
  else if (act==="gonext"){ const n=nextUnfinished(); if(n){ store.set("todayDone",{date:todayStr,role,w:n.w,d:n.d}); go(n.w,n.d); } }
  else if (act==="tabtoday"){ viewing=null; slide=0; celebrate=false; render(); }
  else if (act==="ptab"){ ptab=a.dataset.v; render(); }
  else if (act==="medalnote"){ store.set("medalNote",1); render(); }
  else if (act==="closecel"){ celebrate=false; slide=0; render(); }
  else if (act==="ans"){ quiz[a.dataset.key]=+a.dataset.i; store.set("quiz",quiz); render(true); }
  else if (act==="bkcopy"){ const c=backupCode(), m=document.getElementById("bk-msg");
    const ok=()=>{ if(m) m.textContent="已複製。建議貼到 LINE 傳給自己，或存在備忘錄。"; };
    const fb=()=>{ const r=document.createRange(), el=document.getElementById("bk-code"); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); if(m) m.textContent="已幫你選取進度碼，請長按複製。"; };
    try{ navigator.clipboard.writeText(c).then(ok,fb); }catch(e){ fb(); } }
  else if (act==="bkload"){ const v=document.getElementById("bk-in")?.value, n=restoreCode(v), m=document.getElementById("bk-msg");
    if(n<0){ if(m) m.textContent="進度碼格式不對，請確認是完整複製的（XF1- 開頭）。"; } else { render(true); const m2=document.getElementById("bk-msg"); if(m2) m2.textContent=n?`已還原 ${n} 關。`:"這個進度碼的關卡你都已經完成了。"; } }
  else if (act==="ord"){ const k=a.dataset.key; orders[k]=[...(orders[k]||[]),+a.dataset.i]; store.set("orders",orders); render(true); }
  else if (act==="ordreset"){ delete orders[a.dataset.key]; store.set("orders",orders); render(true); }
  else if (act==="flip"){ flips[a.dataset.key]=!flips[a.dataset.key]; store.set("flips",flips); render(true); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("sheet").hidden=true; if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('div[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener("input",e=>{
  if (e.target.id==="note"){ notes[e.target.dataset.id]=e.target.value; store.set("notes",notes); return; }
  if (e.target.dataset.c){ const v=parseFloat(e.target.value); calc[e.target.dataset.c]=isNaN(v)?0:v; store.set("calc",calc); updateWidget(); }
});
let sx=null, sy=null;
document.addEventListener("pointerdown",e=>{ if(e.target.closest("#slide") && !e.target.closest("input,textarea,button,a")){ sx=e.clientX; sy=e.clientY; } else sx=null; });
document.addEventListener("pointerup",e=>{
  if (sx===null || celebrate) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if (Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)*1.5) return;
  const c=current(), n=deck(c.w,c.d).slides.length;
  if (dx<0 && slide<n-1){ slide++; render(); } else if (dx>0 && slide>0){ slide--; render(); }
});
window.addEventListener("resize",fitDeck);
render();
fetch("readings.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(Array.isArray(j)&&j.length){ D.readings=j; if(tab==="know") render(); } }).catch(()=>{});
fetch("foodsafety.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(Array.isArray(j)&&j.length){ FSI=j; if(tab==="know") render(); } }).catch(()=>{});
</script>
