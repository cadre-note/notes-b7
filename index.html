<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幹部學堂">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8f6ec">
<title>雪坊幹部學堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：手機一屏一關。職務決定主色（生管靛藍／衛管翠綠／生產主管琥珀），頂部關卡條＋可左右翻的課卡＋底部四分頁 */
:root{
  --surface:#FFFFFF; --ink:#17212B; --muted:#5E6A75; --line:#DCE2E8;
  --ok:#2E8A57; --ok-soft:#E0F3E8; --warn:#A35F00; --warn-soft:#FDF0DA; --bad:#B3261E; --bad-soft:#FBE5E3;
  --accent:#3B5BDB; --accent-soft:#E7ECFF; --tint:#F3F5FE; --on-accent:#FFFFFF; --accent-deep:#2B44A8;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-role="qa"]{--accent:#1E8A5A; --accent-soft:#DDF3E8; --tint:#F1F8F4; --accent-deep:#14663F}
:root[data-role="line"]{--accent:#D2602A; --accent-soft:#FDE9DE; --tint:#FCF5F1; --accent-deep:#A8461A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--surface:#18202A; --ink:#E7ECF1; --muted:#9BA7B3; --line:#2B3541;
    --ok:#7FD4A3; --ok-soft:#163323; --warn:#F2B860; --warn-soft:#3A2B12; --bad:#F2A097; --bad-soft:#3D1C19;
    --accent:#94AAFF; --accent-soft:#1F2850; --tint:#10142A; --on-accent:#0B1220; --accent-deep:#C3CFFF; color-scheme:dark}
  :root:not([data-theme="light"])[data-role="qa"]{--accent:#6DD3A2; --accent-soft:#133626; --tint:#0D1A14; --accent-deep:#A6E8C6}
  :root:not([data-theme="light"])[data-role="line"]{--accent:#FFA477; --accent-soft:#3D2316; --tint:#1C130E; --accent-deep:#FFC9AC}
}
:root[data-theme="dark"]{--surface:#18202A; --ink:#E7ECF1; --muted:#9BA7B3; --line:#2B3541;
  --ok:#7FD4A3; --ok-soft:#163323; --warn:#F2B860; --warn-soft:#3A2B12; --bad:#F2A097; --bad-soft:#3D1C19;
  --accent:#94AAFF; --accent-soft:#1F2850; --tint:#10142A; --on-accent:#0B1220; --accent-deep:#C3CFFF; color-scheme:dark}
:root[data-theme="dark"][data-role="qa"]{--accent:#6DD3A2; --accent-soft:#133626; --tint:#0D1A14; --accent-deep:#A6E8C6}
:root[data-theme="dark"][data-role="line"]{--accent:#FFA477; --accent-soft:#3D2316; --tint:#1C130E; --accent-deep:#FFC9AC}
*{box-sizing:border-box}
body{background:var(--tint);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7;transition:background .3s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(80px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--tint);padding-block:10px 8px;display:grid;gap:8px;transition:background .3s}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-size:1.35rem;margin:0;color:var(--accent)}
.brand small{color:var(--muted);font-family:var(--f-mono);font-size:.78rem;white-space:nowrap}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 .92rem var(--f-body);padding:7px 4px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;gap:12px;padding-top:4px}
.hero{border-radius:18px;padding:12px 14px;background:linear-gradient(125deg,var(--accent),var(--accent-deep));color:var(--on-accent);display:grid;gap:8px}
.hero .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .wk{font:500 .78rem var(--f-mono);opacity:.9;letter-spacing:.06em}
.hero .tt{font-family:var(--f-display);font-size:1.05rem;line-height:1.35}
.hero .behind{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:99px;padding:2px 10px;font:500 .75rem var(--f-body);cursor:pointer;white-space:nowrap}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.steps5 button{border:0;background:transparent;color:inherit;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:0;font:500 .7rem var(--f-body);opacity:.75}
.steps5 button .dot{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font:500 .72rem var(--f-mono);background:transparent}
.steps5 button.done .dot{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.steps5 button.cur{opacity:1}
.steps5 button.cur .dot{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.steps5 button:disabled{opacity:.4;cursor:not-allowed}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:380px}
.slide{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:12px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.deckfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:all .2s}
.dots i.on{width:20px;background:var(--accent)}
.nav2{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;font:500 .95rem var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.eyebrow{font:500 .74rem var(--f-mono);letter-spacing:.06em;color:var(--accent)}
h2.title{font-family:var(--f-display);font-size:1.45rem;line-height:1.35;margin:0;text-wrap:balance}
.goal{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:.92rem}
.goal b{color:var(--accent);white-space:nowrap}
.hook{font-family:var(--f-display);font-size:1.12rem;line-height:1.65;margin:0}
h3{font-size:.98rem;margin:0;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--accent)}
ul.pts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ul.pts li{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start}
ul.pts li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:.7em}
ol.st{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
ol.st li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;background:var(--tint);border-radius:12px;padding:9px 12px}
ol.st li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:500 .75rem var(--f-mono)}
.fact{border-radius:16px;background:var(--accent-soft);padding:14px 16px;display:grid;gap:6px}
.fact b{color:var(--accent);font-size:.85rem}
.fact p{margin:0}
.term{border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.quiz{display:grid;gap:8px}
.quiz .q{font-weight:700;margin:0}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--f-mono);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{border-radius:12px;padding:10px 12px;font-size:.93rem}
.why.ok{background:var(--ok-soft);color:var(--ok)}
.why.no{background:var(--bad-soft);color:var(--bad)}
.why span{color:var(--ink);display:block;margin-top:2px}
.disc{display:grid;gap:6px}
.disc p{margin:0;font-weight:500}
textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--tint);color:var(--ink);font:inherit}
.small{font-size:.8rem;color:var(--muted);margin:0}
.todo{border:2px dashed var(--accent);border-radius:16px;padding:12px 14px;display:grid;gap:4px}
.todo b{color:var(--accent);font-size:.85rem}
.todo p{margin:0;font-weight:500}
.roleq{display:grid;gap:8px}
.roleq div{border-radius:12px;padding:9px 12px;background:var(--tint)}
.roleq div.mine{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.roleq small{display:block;font-weight:700;color:var(--muted);font-size:.78rem}
.roleq div.mine small{color:var(--accent)}
.relay{display:grid;gap:6px}
.relay div{display:flex;align-items:center;gap:10px;background:var(--tint);border-radius:12px;padding:8px 12px;font-weight:500}
.relay div.me{background:var(--accent);color:var(--on-accent)}
.relay span{font:500 .75rem var(--f-mono);opacity:.7;width:16px}
.relay .arr{justify-content:center;background:transparent;padding:0;height:10px;color:var(--muted);font-size:.8rem}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hand div{background:var(--tint);border-radius:12px;padding:10px 12px;font-size:.92rem}
.hand b{display:block;color:var(--accent);font-size:.8rem}
.toc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.84rem}
.toc li{display:flex;gap:6px}
.toc span{font-family:var(--f-mono);color:var(--accent);min-width:2.2em}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:.88rem}
.celebrate{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;animation:in .3s ease}
.celebrate .big{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:2.4rem;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.celebrate h2{font-family:var(--f-display);margin:0;font-size:1.4rem}
.celebrate p{margin:0;color:var(--muted)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid}
.stat b{font:500 1.5rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:.78rem;color:var(--muted)}
.ring{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.ring svg{width:76px;height:76px;flex:none}
.ring .lbl{display:grid}
.ring .lbl b{font-family:var(--f-display);font-size:1.15rem}
.ring .lbl span{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.medals{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.medal{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font:500 .7rem var(--f-mono);border:1.5px dashed var(--line);color:var(--muted)}
.medal.on{border:0;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent));color:var(--on-accent);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pending{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pending button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pending small{color:var(--muted);display:block;font-size:.78rem}
.pending .go{font-size:.82rem;color:var(--accent);font-weight:700;white-space:nowrap}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;font-size:.72rem}
table.grid th{color:var(--muted);font-weight:500;font-family:var(--f-mono)}
table.grid td button{width:100%;min-width:30px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);font:500 .7rem var(--f-mono)}
table.grid td button.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
table.grid td button.miss{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
table.grid td button:disabled{opacity:.35;cursor:not-allowed}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.flow{list-style:none;margin:0;padding:0;display:grid}
.flow>li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative}
.flow>li::before{content:"";position:absolute;left:16px;top:32px;bottom:-2px;width:2px;background:var(--line)}
.flow>li:last-child::before{display:none}
.flow .n{width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:grid;place-items:center;font:500 .78rem var(--f-mono);color:var(--accent);z-index:1}
.flow li.ccp .n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.flow li.clean .n{border-style:dashed;border-color:var(--ok);color:var(--ok);font-size:.66rem}
.flow details{padding-bottom:12px;min-width:0}
.flow summary{list-style:none;cursor:pointer;padding-top:4px}
.flow summary::-webkit-details-marker{display:none}
.flow summary .more{float:right;font-size:.75rem;color:var(--accent)}
.flow details[open] summary .more{visibility:hidden}
.pill{display:inline-block;margin-left:6px;font-size:.7rem;padding:1px 8px;border-radius:99px;font-weight:700;vertical-align:2px}
.pill.ccp{background:var(--bad-soft);color:var(--bad)}
.pill.cl{background:var(--ok-soft);color:var(--ok)}
.pill.kw{background:var(--warn-soft);color:var(--warn)}
dl.det{margin:8px 0 0;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
dl.det dt{font-size:.76rem;color:var(--muted);font-weight:700}
dl.det dd{margin:0 0 4px}
.qc{border-radius:14px;padding:12px 14px;background:var(--accent-soft)}
.qc b{color:var(--accent)}
.calc{display:grid;gap:8px;background:var(--tint);border-radius:14px;padding:12px}
.field{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center;font-size:.88rem}
.field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:500 .95rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.loss{display:grid;gap:8px}
.loss .lab{display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
.loss .lab span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.loss .track{height:12px;background:var(--surface);border-radius:4px;overflow:hidden;margin-top:3px}
.loss .track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s;opacity:.55}
.loss>div:last-child .track i{opacity:1;background:var(--bad)}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.outs div{background:var(--surface);border-radius:10px;padding:8px 10px}
.outs b{display:block;font:500 1.2rem var(--f-mono);font-variant-numeric:tabular-nums}
.outs span{font-size:.75rem;color:var(--muted)}
.tbl{display:grid;gap:6px}
.tbl .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.tbl th{background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:left;padding:7px 10px;white-space:nowrap}
.tbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:500}
.adv{border-left:4px solid var(--accent);background:var(--tint);border-radius:0 14px 14px 0;padding:12px 14px;display:grid;gap:8px}
.adv .lv{font:500 .7rem var(--f-mono);color:var(--accent);letter-spacing:.08em}
.mis{display:grid;gap:8px}
.mis div{border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.mis .x{background:var(--bad-soft)}
.mis .x b{color:var(--bad)}
.mis .r{background:var(--ok-soft)}
.mis .r b{color:var(--ok)}
.mis p{margin:0}
.mis .x p{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.5px;color:var(--muted)}
.room{display:grid;gap:14px}
.ben{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ben div{border-radius:12px;padding:7px 10px;background:var(--tint);font-size:.82rem;line-height:1.5}
.ben b{display:block;font-size:.74rem;color:var(--accent);letter-spacing:.04em}
.cat{display:grid;gap:6px}
.cat details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cat summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.cat summary::-webkit-details-marker{display:none}
.cat .wk{font:500 .75rem var(--f-mono);color:var(--accent);min-width:2.6em}
.cat .nm{min-width:0}
.cat .nm b{display:block;font-size:.95rem}
.cat .nm small{color:var(--muted);font-size:.76rem;display:block;line-height:1.4}
.cat .nm b{line-height:1.4}
.cat .st{font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap}
.cat .st.full{color:var(--ok)}
.cat ul{list-style:none;margin:0;padding:0 10px 10px;display:grid;gap:2px}
.cat li button{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 8px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}
.cat li button:hover:not(:disabled){background:var(--tint)}
.cat li button:disabled{cursor:default;color:var(--muted)}
.cat li small{display:block;color:var(--muted);font-size:.75rem}
.cat .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);margin-top:3px;display:grid;place-items:center;font-size:.7rem;color:var(--on-accent)}
.cat .ck.on{background:var(--accent);border-color:var(--accent)}
.kcards{display:grid;gap:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.kcard h4{margin:0;font-family:var(--f-display);font-size:1.05rem}
.kcard ul{margin:0;padding-left:1.2em;display:grid;gap:3px}

.new{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 8px;font:500 .7rem var(--f-body);margin-left:6px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}

@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h4{margin:0;font-family:var(--f-display);font-size:1.3rem;color:var(--accent)}
#sheet p{margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:5px calc(5px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

body{font-size:1rem}
.brand{flex-wrap:wrap}

.brand .sp{flex:1}
.fs{display:flex;gap:4px}
.fs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 8px;font:500 .8rem var(--f-body);cursor:pointer}
.hero .soft{font-size:.78rem;opacity:.9}
.tag{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px;justify-self:start;width:max-content}
h3.plain::before{display:none}
.pred{display:grid;gap:8px;border:2px solid var(--accent-soft);border-radius:16px;padding:12px}
.why.info{background:var(--accent-soft);color:var(--accent)}
.event{display:grid;gap:8px;background:var(--tint);border-radius:16px;padding:14px;border-left:4px solid var(--bad)}
.event .tag{color:var(--bad);background:var(--bad-soft)}
.event p{margin:0}
.event .src{font-size:.78rem;color:var(--muted)}
.event .src a{color:var(--muted)}
.flipc{border:0;border-radius:16px;padding:16px;text-align:left;font:inherit;cursor:pointer;display:grid;gap:6px;background:var(--bad-soft);color:var(--ink);transition:background .25s}
.flipc .side{font-weight:700;color:var(--bad);font-size:.85rem}
.flipc .txt{font-size:1.02rem;font-weight:500}
.flipc .hint{font-size:.75rem;color:var(--muted)}
.flipc.on{background:var(--ok-soft);animation:flip .35s ease}

@keyframes flip{from{transform:rotateX(70deg);opacity:.4}to{transform:none;opacity:1}}
.take{border-radius:16px;padding:14px 16px;background:linear-gradient(125deg,var(--accent),var(--accent-deep));color:var(--on-accent);display:grid;gap:4px}
.take span{font:500 .72rem var(--f-mono);opacity:.85;letter-spacing:.06em}
.take p{margin:0;font-family:var(--f-display);font-size:1.12rem;line-height:1.6}
.story{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;background:var(--tint);border-radius:16px;padding:12px}

.story.r-prod .av{background:#3B5BDB}.story.r-qa .av{background:#1E8A5A}.story.r-line .av{background:#D2602A}

.story p{margin:2px 0 0}
.diag{margin:0;display:grid;gap:8px}

.flowrow .node.ccp{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}

.range{position:relative;height:84px;margin:6px 28px 0}

.range .pt small{font-size:.72rem;color:var(--muted);line-height:1.3}
.tool{display:grid;gap:8px;border:2px dashed var(--accent);border-radius:16px;padding:14px}

.tool .back b{color:var(--warn);font-size:.85rem}
.tool .back ul{margin:0;padding-left:1.2em;display:grid;gap:3px;font-size:.92rem}

.qwrap{display:grid;gap:6px}
.stars{color:var(--warn);letter-spacing:2px;font-size:.85rem}

.home b{color:var(--accent)}
.home span{display:block;font-weight:700;font-size:.78rem;color:var(--muted)}
ol.toc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.84rem}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.kpis small{font-size:.7rem;color:var(--muted);line-height:1.35}
.ppl{display:grid;gap:8px}
.notes{display:grid;gap:8px}
.note{background:var(--tint);border-radius:12px;padding:10px 12px}

.note p{margin:2px 0 0;white-space:pre-wrap}
.cheer{color:var(--accent)!important;font-weight:700}

.pill.kw{background:var(--tint);color:var(--muted)}

<script>
const D = {"lessons": {"prod-1-0": [[{"k": "head", "t": "BOM 的意義與應用", "g": "看懂 BOM 的層次，知道錯一行會影響哪些人。"}, {"k": "ben", "me": "看懂 BOM，你就能抓出成本差異的源頭，這是升任管理職必備的能力。", "co": "備料準、報廢少，每一杯的成本都更穩定。"}, {"k": "predict", "key": "p-prod1", "q": "BOM 少列了一行果粒醬，通常最先發現的是誰？", "o": ["研發", "會計月結時", "產線，在停線等料的那一刻"], "a": 2, "r": "BOM 的錯誤，常常在最糟的時間點才被發現。所以生管在備料前就要先核對。"}], [{"k": "points", "h": "BOM 是什麼", "i": ["BOM（物料清單）列出做一單位成品需要的全部物料與用量，包材也要列。", "BOM 有層次：成品 → 半成品 → 原料。", "備料、領料、成本、追溯，全都以 BOM 為源頭。"]}, {"k": "diagram", "kind": "tree", "title": "草莓優格的 BOM 層次", "root": "草莓優格 1 杯", "kids": [["優格基底 120 g", ["生乳", "糖", "菌種"]], ["草莓果粒醬 30 g", ["草莓", "糖", "果膠"]], ["包材", ["杯", "蓋", "封膜", "紙箱（分攤）"]]]}], [{"k": "points", "h": "BOM 錯了，會發生什麼事", "i": ["少列或用量偏低：備料不足，產線停線等料。", "用量偏高：多備的料過期報廢，成本也被高估。", "版本沒更新：新舊配方混用，追溯時對不上。"]}, {"k": "flip", "key": "f-prod1", "x": "BOM 是研發的事，生管照著用就好。", "r": "生管是每天使用 BOM 的人，最早看得到用量差異；發現不合理要主動回報校正。"}], [{"k": "fact", "t": "常見做法是把「損耗率」另外設定，而不是直接灌進 BOM 用量。這樣月底比對時，才分得出差異是配方問題，還是現場損耗。"}, {"k": "take", "t": "BOM 是備料、成本、追溯共同的源頭；改一行 BOM，就是改了整條線。"}]], "prod-1-1": [[{"k": "head", "t": "BOM 的意義與應用", "g": "會用 BOM 算出備料量，並抓出用量差異。"}, {"k": "story", "who": "生管", "t": "週一早上，生管對帳發現：上週草莓優格做了 4,000 杯，果粒醬卻領了 132 kg。照 BOM 算應該只要 126 kg，多出來的 6 kg 去哪了？"}, {"k": "table", "t": "上週果粒醬用量", "head": ["項目", "數值"], "rows": [["產量", "4,000 杯"], ["每杯用量", "30 g"], ["損耗率（BOM 設定）", "5%"], ["理論用量", "126 kg"], ["實際領料", "132 kg"], ["差異", "+6 kg（約 4.8%）"]], "note": "理論用量＝4,000 × 30 g ×（1＋5%）＝126 kg。"}], [{"k": "calc", "kind": "bom"}, {"k": "points", "h": "差異可能從哪裡來", "i": ["實際損耗高於 BOM 設定的 5%（例如換線時清管的損失）。", "領料多領、沒有退回倉庫。", "充填重量偏高，每杯多裝了一點。"]}], [{"k": "tool", "t": "備料前三核對", "i": ["BOM 是最新版本嗎？看版本號與生效日。", "損耗率用的是最近 3 個月的實際值，還是很久以前的設定？", "庫存和在途，有沒有扣掉其他工單已經預留的量？"], "back": ["找出本廠的配方表或 BOM，看有沒有「版本」與「生效日」欄位。", "問倉管：系統顯示的庫存，有沒有扣掉已預留的量。"]}]], "prod-1-2": [[{"k": "head", "t": "BOM 的意義與應用", "g": "能用數據算出備料缺口與用量差異率。"}, {"k": "adv", "t": "BOM 與損耗", "i": ["實際備料量＝標準用量 ×（1＋損耗率）。", "用量差異率＝實際領料 ÷ 理論用量 − 1；長期偏高，代表損耗率設太低或現場有浪費。", "BOM 改版有三種生效方式：指定日期、舊料用完再切換、指定工單。舊包材還有庫存時，常選「舊料用完再切換」。"]}], [{"k": "table", "t": "本週果粒醬備料", "head": ["項目", "數值"], "rows": [["本週生產", "4,000 杯"], ["每杯用量", "30 g"], ["損耗率", "5%"], ["倉庫庫存", "100 kg"], ["在途（明天到）", "20 kg"]]}, {"k": "quiz", "key": "q-prod1a", "star": 2, "q": "果粒醬還需要再補多少？", "o": ["不用補，庫存加在途剛好夠", "還要補 6 kg", "還要補 26 kg"], "a": 1, "y": "需求＝4,000 × 30 g × 1.05＝126 kg；可用＝100＋20＝120 kg，不足 6 kg。選「剛好夠」是忘了損耗率；選 26 kg 是沒算在途。"}], [{"k": "quiz", "key": "q-prod1b", "star": 3, "q": "上週理論用量 126 kg、實際領料 132 kg，用量差異率約是多少？下一步該做什麼？", "o": ["約 4.8%：先查換線損耗、退料與充填重量，再決定是否調整損耗率", "約 6%：直接把 BOM 損耗率改成 11%", "約 1.05%：在誤差範圍內，不用處理"], "a": 0, "y": "132 ÷ 126 − 1≈4.8%。差異要先找原因再決定要不要改 BOM；直接調高損耗率，會把現場的浪費合理化。"}], [{"k": "reflect", "q": "你負責的產品中，哪一項的實際用量最常和 BOM 對不上？你猜原因是什麼？"}]], "qa-1-0": [[{"k": "head", "t": "優格流程、CCP 與乳酸菌", "g": "說得出優格每個管控點的目的，以及乳酸菌在做什麼。"}, {"k": "ben", "me": "能把製程原理說清楚，你在稽核與客訴時會更有說服力。", "co": "每一杯優格的安全與口感都更穩定。"}, {"k": "predict", "key": "p-qa1", "q": "優格的酸味，是從哪裡來的？", "o": ["加了醋或檸檬酸", "乳酸菌把乳糖變成乳酸", "生乳本來就是酸的"], "a": 1, "r": "乳酸菌分解乳糖產生乳酸，pH 下降，乳蛋白凝結成形。優格的酸度和質地，其實都是菌在做的事。"}], [{"k": "diagram", "kind": "flow", "title": "優格產線", "steps": [["開工 SIP", "clean"], ["原料驗收", ""], ["倉儲", ""], ["倒料", ""], ["加熱殺菌", "ccp"], ["冷卻", ""], ["加乳酸菌", ""], ["充填", ""], ["發酵", ""], ["冷藏", ""], ["出貨", ""], ["收工 CIP", "clean"]], "note": "紅色為常見 CCP，實際以本廠 HACCP 計畫為準。"}, {"k": "points", "h": "三個關鍵", "i": ["開工前 SIP，確認熱水殺菌與清潔完成才開機；收工後 CIP，確認清潔完成並恢復中性。", "加熱殺菌是 CCP：溫度與時間要「同時」達標。", "發酵終點看 pH，到點後要盡快降溫，否則會持續變酸。"]}], [{"k": "points", "h": "認識乳酸菌", "i": ["傳統優格菌：嗜熱鏈球菌先快速產酸，保加利亞乳桿菌接著讓酸度與香氣成形，兩者互相幫忙（共生）。", "市售產品常另外添加：嗜酸乳桿菌、比菲德氏菌、鼠李糖乳桿菌、副乾酪乳桿菌。", "2020 年乳桿菌屬重新分類，部分學名改了，看規格書時要對照新舊名稱。"]}], [{"k": "table", "t": "同質發酵 vs. 異質發酵", "head": ["", "同質發酵", "異質發酵"], "rows": [["主要產物", "乳酸", "乳酸＋二氧化碳、乙醇或醋酸"], ["風味", "酸味乾淨", "較複雜，可能產氣"], ["代表菌", "嗜熱鏈球菌、保加利亞乳桿菌", "明串珠菌、短乳桿菌"]], "note": "比菲德氏菌走自己的代謝路徑，同時產生醋酸與乳酸，所以風味不同。"}, {"k": "flip", "key": "f-qa1", "x": "最後有殺菌，前面衛生差一點沒關係。", "r": "殺菌之後的冷卻、接菌、充填都可能再汙染；有些細菌產生的毒素，加熱也破壞不了。"}, {"k": "take", "t": "優格好不好，看兩件事：殺菌有沒有確實，菌有沒有照計畫在做事。"}], [{"k": "points", "h": "PRP、OPRP、CCP 怎麼分", "i": ["PRP（前提方案）：維持基本衛生的地基，例如人員衛生、清潔、病媒防治、用水。", "OPRP（操作性前提方案）：針對危害分析判定的顯著危害，用「行動準則」管控，可以是量測或觀察。", "CCP（重要管制點）：針對顯著危害，有可量測的「管制界限」，偏離要立即修正。"]}, {"k": "table", "t": "雪坊三條線怎麼對照", "head": ["", "例子", "偏離時"], "rows": [["PRP", "進廠洗手、病媒防治、用水檢驗", "依程序矯正，追蹤趨勢"], ["OPRP", "優格冰開工前熱水清洗（熱水流過機器內部，出水溫度達本廠規定）", "不得投產；已生產的產品要評估"], ["CCP", "優格的加熱殺菌", "隔離受影響產品並矯正"]], "note": "實際分類以本廠危害分析與 HACCP 計畫為準。"}], [{"k": "points", "h": "CCP 是什麼", "i": ["針對顯著危害：不管住，可能讓人生病或受傷。", "這一步是關鍵：在這裡沒管住，後面沒有步驟能把危害降到可接受的程度。", "有可量測的管制界限：例如溫度、時間、pH，當下就能判斷合格或偏離；數值依本廠規定。"]}, {"k": "points", "h": "判定是不是 CCP：四個問題", "i": ["① 這一步或後面，有沒有管制措施？沒有、但需要管，就要修改步驟或製程。", "② 這一步是不是專門設計來消除或降低危害？是 → CCP。", "③ 汙染會不會在這一步發生，或增加到不可接受？不會 → 不是 CCP。", "④ 後面的步驟能不能消除或降低這個危害？能 → 不是 CCP；不能 → CCP。"]}], [{"k": "table", "t": "本廠產品常見的 CCP", "head": ["產品", "常見 CCP（管控的危害）", "監控什麼"], "rows": [["優格", "加熱殺菌（病原菌存活）", "溫度與時間同時達標，依本廠規定"], ["優格／果醬", "金屬檢測（金屬異物）", "開線前與定時用測試片確認，頻率依本廠規定"], ["果醬", "加熱濃縮／充填（微生物存活）", "溫度與時間；糖度、pH，依本廠規定"], ["優格冰", "屬 OPRP（依本廠 HACCP 計畫管控）", "開工前清洗確認"]], "note": "常見例子，實際 CCP 以本廠 HACCP 計畫為準。果醬的細節在第三週。"}], [{"k": "flip", "key": "f-qa1b", "x": "沒有 CCP 的產線，食安風險比較低、管得比較鬆。", "r": "優格冰依本廠 HACCP 計畫管控，OPRP 和 PRP 一樣要守得嚴，不能因為不是 CCP 就放鬆。"}, {"k": "take", "t": "CCP 和 OPRP 都是 HACCP 計畫的一部分，靠的是每一次確實的監控、清洗與溫度控制。"}]], "qa-1-1": [[{"k": "head", "t": "優格流程、CCP 與乳酸菌", "g": "會判讀殺菌紀錄，劃出偏離時受影響的範圍。"}, {"k": "story", "who": "衛管", "t": "10:05，衛管巡線時翻開殺菌紀錄，發現 10:00 那一筆溫度低於下限。操作員說：「才低一點點，而且 10:30 就恢復了。」衛管要決定哪些產品必須隔離。"}, {"k": "table", "t": "殺菌紀錄（示意，管制界限依本廠規定）", "head": ["時間", "溫度", "持溫", "判定"], "rows": [["09:00", "高於下限", "達標", "符合"], ["09:30", "高於下限", "達標", "符合"], ["10:00", "低於下限", "達標", "偏離"], ["10:30", "高於下限", "達標", "符合"]]}], [{"k": "diagram", "kind": "range", "title": "受影響範圍怎麼劃", "marks": [["09:30", "最後一次正常", "ok"], ["10:00", "發現偏離", "bad"], ["10:30", "確認恢復", "ok"]], "span": [0, 2], "note": "從「最後一次確認正常」算到「確認恢復」，中間生產的都要隔離評估。"}, {"k": "points", "h": "偏離處置四步", "i": ["控制產品：隔離並標示受影響範圍。", "矯正原因：找出為什麼溫度掉下來。", "評估與紀錄：判定產品去向，寫下矯正措施，由主管審核。"]}], [{"k": "tool", "t": "CCP 紀錄判讀三問", "i": ["溫度和時間，是不是「同時」達標？", "有沒有空白、塗改沒簽名，或筆跡像事後一次補上？", "偏離時，有沒有寫下矯正措施和受影響範圍？"], "back": ["拿出本廠的殺菌紀錄表，看這三件事是不是都有欄位可以填。", "確認本廠 HACCP 計畫中，優格殺菌的管制界限是多少。"]}], [{"k": "points", "h": "一個 CCP 要寫齊的 5 件事", "i": ["危害：管的是什麼危害，例如病原菌、金屬異物。", "管制界限：合格與偏離的分界，依本廠規定。", "監控：量什麼、怎麼量、多久量一次、誰量。", "矯正措施：偏離時誰停線、產品怎麼隔離、怎麼恢復。", "確認：主管定期覆核紀錄、量測儀器定期校正。"]}, {"k": "flip", "key": "f-qa1c", "x": "監控有做、有紀錄，就夠了。", "r": "還要有「確認」：主管覆核紀錄、溫度計和測試片定期校正，才能證明監控本身是可信的。"}]], "qa-1-2": [[{"k": "head", "t": "優格流程、CCP 與乳酸菌", "g": "能用數據判斷偏離範圍，並辨認異常發酵的訊號。"}, {"k": "adv", "t": "殺菌、CIP 與發酵", "i": ["優格乳的加熱通常比一般鮮乳更高溫、更久，除了殺菌，也讓乳清蛋白變性、提高稠度；實際條件以本廠驗證參數為準。", "清潔效果取決於四要素：濃度、溫度、時間、流速。CIP 紀錄要四項都有。", "優格脹杯、有氣泡或酒味，可能是異質發酵菌或酵母汙染，要查菌種批號、環境與冷藏溫度。", "ISO 22000:2018 中，CCP 用「管制界限」、OPRP 用「行動準則」。兩者都針對顯著危害，偏離時都要評估受影響的產品。"]}], [{"k": "table", "t": "同一份殺菌紀錄", "head": ["時間", "溫度", "判定"], "rows": [["09:30", "高於下限", "符合"], ["10:00", "低於下限", "偏離"], ["10:30", "高於下限", "符合（已恢復）"]]}, {"k": "quiz", "key": "q-qa1a", "star": 2, "q": "受影響的產品範圍應該怎麼劃？", "o": ["只有 10:00 那個時間點生產的產品", "09:30 之後，到 10:30 確認恢復前生產的產品", "當天生產的全部產品"], "a": 1, "y": "範圍從「最後一次確認正常」（09:30）算到「確認恢復」（10:30）。只看 10:00 會低估；整天全部隔離會擴大不必要的損失。"}], [{"k": "table", "t": "兩批優格的客訴與紀錄（示意）", "head": ["項目", "批次 A", "批次 B"], "rows": [["殺菌紀錄", "符合", "符合"], ["發酵終點 pH", "4.5", "4.5"], ["出貨等車", "20 分鐘", "2 小時，車廂 12°C"], ["客訴", "無", "脹杯 3%、輕微酒味"]]}, {"k": "quiz", "key": "q-qa1b", "star": 3, "q": "批次 B 最可能的原因與下一步是？", "o": ["殺菌不足，整批銷毀", "出貨時溫度偏高，讓異質發酵菌或酵母有機會生長；查冷鏈紀錄、留樣與環境", "發酵時間太長"], "a": 1, "y": "殺菌與發酵終點都正常，兩批的差別在出貨溫度。產氣和酒味是異質發酵菌或酵母的訊號，下一步要查冷鏈並驗留樣。"}], [{"k": "quiz", "key": "q-qa1d", "star": 2, "q": "原料驗收時會檢查生乳，後面還有加熱殺菌。用判定四問來看，對「病原菌」這個危害，驗收是不是 CCP？", "o": ["是，因為它是第一道關卡", "不是，因為後面的加熱殺菌能把病原菌降到可接受程度", "不是，因為驗收不需要紀錄"], "a": 1, "y": "第 ④ 問：後面的步驟能消除或降低這個危害，所以驗收不是病原菌的 CCP，加熱殺菌才是。驗收仍然要做、要記錄，屬於前提方案的一部分。"}], [{"k": "table", "t": "金屬檢測監控紀錄（示意）", "head": ["時間", "測試片", "結果", "簽名"], "rows": [["08:00", "鐵／非鐵／不鏽鋼", "全部剔除", "✓"], ["10:00", "鐵／非鐵／不鏽鋼", "非鐵未剔除", "✓"]]}, {"k": "quiz", "key": "q-qa1e", "star": 3, "q": "10:00 的紀錄只寫「非鐵未剔除」，產線繼續生產。這份紀錄最缺什麼？", "o": ["缺溫度欄位", "缺矯正措施與受影響範圍：08:00 之後到修復確認前的產品要隔離重新檢測", "沒缺，有簽名就夠了"], "a": 1, "y": "測試片沒被剔除，代表 08:00 到 10:00 之間檢測可能失效。要停線修復、重新確認，並隔離這段時間的產品重新檢測，再寫下矯正措施。"}], [{"k": "quiz", "key": "q-qa1c", "star": 2, "q": "優格冰開工前的熱水清洗，紀錄顯示出水溫度比本廠規定的下限低了 4°C，但產線已經投料 15 分鐘。正確處置是？", "o": ["不確定影響範圍，直接報廢全部原料", "停止生產、重新清洗；這 15 分鐘的產品隔離，交衛管評估", "不影響，因為之後會急速冷凍"], "a": 1, "y": "OPRP 未達行動準則時，要先停下來恢復管控，再評估受影響的產品。直接全部報廢太武斷；冷凍只能停止細菌生長，不能殺菌。"}, {"k": "reflect", "q": "你們的殺菌紀錄或熱水清洗紀錄，最可能在哪裡出現空白？"}]], "line-1-0": [[{"k": "head", "t": "線上主管要懂的 HACCP／GHP", "g": "分得清 HACCP 和 GHP，知道線上主管要守住哪三件事。"}, {"k": "ben", "me": "懂食安原理，你帶的線就是稽核時最讓人放心的線。", "co": "問題在產線上就被攔下，不會流到客人手上。"}, {"k": "event", "t": "一間冰淇淋廠的教訓", "d": "2015 年・美國", "x": "Blue Bell 冰淇淋被驗出李斯特菌，相關的 10 位病患全部住院，其中 3 人死亡。公司在 4 月回收市面上所有產品。FDA 稽查發現熱水供應有問題，還有設施老舊、可能讓不潔的水滴進原料。2020 年公司認罪，被判罰 1,725 萬美元。", "src": [["CDC 疫情調查", "https://archive.cdc.gov/www_cdc_gov/listeria/outbreaks/ice-cream-03-15/index.html"], ["just-food 報導", "https://www.just-food.com/news/us-ice-cream-maker-blue-bell-handed-fine-for-2015-listeria-outbreak/"]]}], [{"k": "points", "h": "HACCP 在做什麼", "i": ["找出危害：哪裡可能讓產品變得不安全。", "管住關鍵點（CCP）：例如殺菌溫度與時間。", "留下證據：每一次監控都要記錄，出事時才證明得了。"]}, {"k": "diagram", "kind": "ccpmap", "title": "雪坊三條線的關鍵管控點", "cols": [["優格", ["原料驗收", "加熱殺菌*", "充填", "發酵"]], ["優格冰", ["熱水清洗#", "秤料", "製冰", "急速冷凍"]], ["果醬", ["挑選", "烹煮*", "糖度", "裝瓶"]]], "note": "紅色＝CCP，橘色＝OPRP。實際管控點以本廠 HACCP 計畫為準。"}], [{"k": "points", "h": "GHP 是地基，HACCP 是房子", "i": ["GHP 管的是基本衛生：人員、清潔、病媒、用水、倉儲。", "地基不穩，CCP 管得再好也擋不住汙染。Blue Bell 的問題，就出在環境衛生。", "線上主管要守住三件事：監控照頻率做、紀錄當下寫、偏離立刻停並回報。"]}, {"k": "flip", "key": "f-line1", "x": "HACCP 是品管的事。", "r": "CCP 的監控和紀錄，大多在產線上由線上人員完成；線上主管是第一個能發現偏離的人。"}, {"k": "take", "t": "食安不是品管一個人的事，是產線每一格紀錄累積出來的。"}]], "line-1-1": [[{"k": "head", "t": "線上主管要懂的 HACCP／GHP", "g": "遇到紀錄空白或補填時，知道怎麼處理、怎麼教。"}, {"k": "story", "who": "生產主管", "t": "生產主管第一天當組長。交班時發現，前一班的殺菌紀錄有兩格空白。組員說：「溫度一直都正常啦，我等一下補寫就好。」"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["不能補填：沒看到的數字寫上去，就是造假。", "調閱設備自動紀錄或其他資料，交給衛管評估這段時間的產品。", "找出空白的原因（忘記、太忙、表單位置不順），一起改善。"]}], [{"k": "table", "t": "紀錄的三不", "head": ["不要", "正確做法"], "rows": [["不補填", "沒有記錄就是沒有，誠實說明並請衛管評估"], ["不塗改", "寫錯時劃一條線更正，簽名並寫日期"], ["不空白", "依規定頻率當下記錄；來不及要立刻回報"]]}, {"k": "tool", "t": "早會 1 分鐘講稿：紀錄為什麼要當下寫", "script": "大家早。今天講一件小事：殺菌紀錄要當下寫。這張表不是為了應付稽核，是出事時唯一能證明我們產品安全的東西。如果有一格空白，那段時間做的產品就說不清楚，可能要整批隔離。所以，到了記錄的時間就寫，來不及就跟我說，不要事後補。謝謝大家。", "back": ["找出本廠產線上的 CCP 監控紀錄表，確認每位組員都知道它放在哪裡、多久記一次。"]}]], "line-1-2": [[{"k": "head", "t": "線上主管要懂的 HACCP／GHP", "g": "會從一份紀錄看出問題，分得清 CCP 與 GHP。"}, {"k": "adv", "t": "HACCP 七原則", "i": ["危害分析 → 決定重要管制點（CCP）→ 建立管制界限。", "建立監測方法 → 建立矯正措施。", "建立確認程序 → 建立文件與紀錄。", "台灣依《食品良好衛生規範準則》推行 GHP；部分業別依規定還要實施 HACCP。", "不是每個關鍵管控都叫 CCP：雪坊的優格冰開工前用熱水清洗、確認出水溫度達本廠規定，依本廠 HACCP 計畫屬於 OPRP，一樣不能跳過。"]}], [{"k": "table", "t": "交班時看到的殺菌紀錄", "head": ["時間", "溫度", "備註"], "rows": [["08:00", "高於下限", ""], ["08:30", "（空白）", ""], ["09:00", "高於下限", ""], ["09:30", "（空白）", ""], ["10:00", "高於下限", "08:30–10:00 筆跡相同，10:05 一次寫上"]]}, {"k": "quiz", "key": "q-line1a", "star": 2, "q": "這份紀錄最大的問題是什麼？", "o": ["溫度太接近下限", "有空白，而且疑似事後一次補填，無法證明這段時間符合管制界限", "沒有問題，寫上的溫度都高於下限"], "a": 1, "y": "寫上的數字看起來正常，但空白和事後補填讓紀錄失去證明力。要調閱設備紀錄並交給衛管評估。"}], [{"k": "quiz", "key": "q-line1b", "star": 1, "q": "下列哪一項屬於 CCP 監控，而不是 GHP？", "o": ["進廠洗手", "殺菌溫度與時間記錄", "捕蟲燈檢查"], "a": 1, "y": "洗手、病媒防治屬於 GHP 的基本衛生；殺菌溫度與時間是 CCP 的監控項目。"}], [{"k": "reflect", "q": "你的產線上，哪一張紀錄最容易出現空白？為什麼？"}]], "T-1": [[{"k": "head", "t": "管理人：從做事到帶人", "g": "分得清「自己做」和「讓團隊做到」的差別。"}, {"k": "ben", "me": "學會帶人，是你從執行者成為管理者的第一步。", "co": "團隊能力提升，公司才有成長空間。"}, {"k": "predict", "key": "p-T1", "q": "新任組長最常掉進哪個陷阱？", "o": ["太嚴格", "什麼都自己做，因為這樣比較快", "太少開會"], "a": 1, "r": "自己做確實快，但團隊永遠學不會；組長一請假，整條線就卡住。"}], [{"k": "points", "h": "主管的槓桿", "i": ["自己做一次，只有一次的產出；教會一個人，產出會持續累積。", "放手三步：先示範、再陪做、最後讓他做並追蹤。", "每週檢查自己的時間：教導和追蹤的時間有沒有增加。"]}, {"k": "flip", "key": "f-T1", "x": "主管要比組員更會做。", "r": "主管要會做，但更重要的是讓團隊做得到；一 ", "拆洗與清線", "清線確認並記錄", "首件檢查", "開始生產"], "y": "準備工作移到停機前，停機後只做必須停機才能做的事；清線確認和首件檢查不能跳過，否則省下的時間會變成重工或客訴。", "s": "下一次換口味時，從「上一個口味還在生產、還沒停機」開始，排出 6 個步驟。"}], [{"k": "roles", "r": {"prod": "生管：排程有沒有預留換線緩衝？延誤後要怎麼通知業務？", "qa": "衛管：清線確認要怎麼安排，才不會讓產線空等？", "line": "生產主管：哪些動作可以在停機前就準備好？"}}, {"k": "reflect", "q": "寫下你的職務明天就能做的一件事，月會時和其他職務對照。"}]], "prod-2-0": [[{"k": "head", "t": "前置時間：進貨到出貨", "g": "能把一個產品從進貨到出貨拆成各段時間，找出最該縮短的等待。"}, {"k": "ben", "me": "能拆解前置時間，你回覆交期時會更有底氣，也不會被業務追著跑。", "co": "交期準確，客戶更信任雪坊，緊急訂單也少了。"}, {"k": "predict", "key": "p-prodR2", "q": "一杯優格從生乳進廠到出貨約 72 小時，真正在「加工」的時間大約占多少？", "o": ["約八成", "約一半", "不到兩成"], "a": 2, "r": "大部分時間都在等：等驗收、等放行、等出貨。縮短等待，比讓機器跑快更有效。"}], [{"k": "points", "h": "前置時間由哪些段組成", "i": ["進貨驗收、待料、加工、檢驗放行、倉儲、出貨準備。", "真正在加工的時間通常只占一小部分，大部分是等待。", "優格要等發酵與放行，這段不能省，但可以排得更好。"]}, {"k": "diagram", "kind": "flow", "title": "杯裝優格的前置時間（示意）", "steps": [["驗收後待用 10h", "kw"], ["加熱接菌 2h", ""], ["充填 2h", ""], ["發酵 6h", ""], ["冷藏 4h", ""], ["等放行 24h", "kw"], ["等出貨 24h", "kw"]], "note": "深色是等待段，合計 58 小時，占約八成。"}], [{"k": "points", "h": "縮短前置時間的方向", "i": ["先量：把每一段的時間量出來，才知道該改哪一段。", "再排：固定要等的時間（發酵、放行）在排程時就排進去。", "最後縮：減少等待段，例如讓出貨排程配合放行時間。"]}, {"k": "flip", "key": "f-prodR2", "x": "機器跑快一點，交期就會提早。", "r": "加工只占前置時間的一小部分。先縮短等待段，交期才會明顯提早。"}], [{"k": "fact", "t": "利特爾法則（Little's Law）：平均前置時間＝在製品數量 ÷ 產出速度。在製品堆得越多，產品走完全程的時間就越長。"}, {"k": "take", "t": "客戶問「多久能出貨」，答案藏在每一段的等待時間裡。"}]], "prod-2-1": [[{"k": "head", "t": "前置時間：進貨到出貨", "g": "能用倒推排程回覆交期，不漏掉固定要等的時間。"}, {"k": "story", "who": "生管", "t": "週一下午業務來問：「量販週三要 8,000 杯草莓優格，可以嗎？」生管看產線週二有空檔，就回答可以。週二晚上衛管提醒：放行檢驗要 24 小時，週二做的產品最快週四才能出貨。"}, {"k": "points", "h": "生管該怎麼做", "i": ["回覆前先倒推：出貨時間往回減放行、冷藏、發酵、充填、驗收各段。", "把放行檢驗當成排程的一段，而不是生產完才開始算。", "算出最早可出貨時間後，提出選項：延到週四，或週三先出庫存品。"]}], [{"k": "table", "t": "杯裝優格前置時間拆解（示意）", "head": ["段落", "類型", "時間"], "rows": [["生乳驗收後待用", "等待", "10 小時"], ["加熱、冷卻、接菌", "加工", "2 小時"], ["充填", "加工", "2 小時"], ["發酵", "加工", "6 小時"], ["冷藏降溫", "加工", "4 小時"], ["等待放行檢驗", "等待", "24 小時"], ["等待出貨", "等待", "24 小時"]], "note": "總前置時間 72 小時， ；630 kg 是沒扣庫存與在途。"}], [{"k": "quiz", "key": "q-prod12b", "star": 3, "q": "冷凍草莓每天用 1,200 kg、交期 5 天、安全庫存 2,400 kg。目前庫存 9,000 kg，照常使用，大約多久後要下單？", "o": ["今天馬上", "約半天後", "5 天後"], "a": 1, "y": "下單點＝1,200 × 5 ＋ 2,400＝8,400 kg。目前 9,000 kg，多出 600 kg，約 0.5 天就會降到下單點。"}], [{"k": "reflect", "q": "你負責的原料中，哪一項最常斷料？安全庫存是怎麼訂的？"}]], "prod-13-0": [[{"k": "head", "t": "效期管理：先到期先出、庫齡與即期品", "g": "會管理原料與成品效期，正確處理即期品。"}, {"k": "ben", "me": "懂效期管理，你就能幫公司把報廢降下來。", "co": "少報廢、少退貨，客戶收貨也更順利。"}, {"k": "predict", "key": "p-prod13n", "q": "一批果粒醬原料再 10 天就到期（示意），下週剛好可以排進優格冰生產。排程前最先要確認的是？", "o": ["下週排程有沒有空檔插進去", "這批原料品質是否仍符合規格，並交衛管確認", "做成成品後，冷凍倉放不放得下"], "a": 1, "r": "即期原料可以優先使用，但要先確認品質；把有疑慮的原料做成產品，風險只是轉到客戶手上。成品效期與客戶允收期也要一起確認，排程和倉容是之後的事。"}], [{"k": "points", "h": "效期管理三件事", "i": ["原料：先到期先出，入庫就標示到期日。", "成品：記錄庫齡（入庫多久），找出滯留太久的批次。", "客戶允收：很多客戶要求剩餘效期達一定比例才收貨，比例依客戶規定。"]}], [{"k": "points", "h": "即期品怎麼處理", "i": ["即期原料：優先排進近期工單，使用前請衛管確認品質。", "即期成品：評估是否還符合客戶的允收條件，或改走其他處置。", "絕對不可以為了消耗即期品而改標示或延長效期。"]}, {"k": "flip", "key": "f-prod13", "x": "產品還沒過期，就一定可以出貨。", "r": "還要看客戶的允收期限；剩餘效期不夠，客戶可能拒收，退回來的成本更高。"}], [{"k": "fact", "t": "成品的有效日期是依保存試驗設定的。原料品質變差時，成品可能在標示日期前就出問題，所以即期原料一定要先確認品質。"}, {"k": "take", "t": "效期不是倉庫的事，從排程就開始了。"}]], "prod-13-1": [[{"k": "head", "t": "效期管理：先到期先出、庫齡與即期品", "g": "能決定即期原料與滯留成品的處理方式。"}, {"k": "story", "who": "生管", "t": "盤點發現冷凍草莓有 3,000 kg 只剩 10 天到期；業務也說倉庫裡有一批優格冰已經放了很久，客戶可能不收。生管要決定怎麼處理。"}, {"k": "table", "t": "庫存效期盤點（示意）", "head": ["品項", "數量", "狀況"], "rows": [["冷凍草莓（批 A）", "3,000 kg", "剩 10 天；每日用量 1,200 kg"], ["優格冰成品（批 F）", "20,000 杯", "剩餘效期已低於客戶要求的 1/2"]], "note": ""}], [{"k": "points", "h": "生管怎麼做", "i": ["冷凍草莓：約 2.5 天就能用完，排進最近的果醬與果粒醬工單，並請衛管確認品質。", "優格冰批 F：已不符合這位客戶的允收條件，和業務討論其他處置。", "找原因：為什麼批 F 會滯留？是預測太高，還是先進的沒有先出？"]}, {"k": "tool", "t": "每週效期巡檢", "i": ["列出剩餘效期低於一定比例（例如 30%，依本廠訂定）的原料與成品", "即期原料：排進近期工單，請衛管確認品質", "即期成品：對照客戶允收條件，提早和業務討論", "追查滯留原因，回饋到預測與排程"], "back": ["確認本廠主要客戶的允收期限，以及即期品處置的權責。"]}]], "prod-13-2": [[{"k": "head", "t": "效期管理：先到期先出、庫齡與即期品", "g": "能用數據判斷先到期先出與客戶允收。"}, {"k": "adv", "
