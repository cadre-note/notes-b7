 {"k": "points", "h": "生管該怎麼做", "i": ["從原料批號查所有投料紀錄，找出用到的工單與成品批號。", "從出貨紀錄查每一批成品給了誰、各多少。", "用物料平衡核對：進貨量、各工單用量、倉庫剩餘量加起來要對得上。"]}], [{"k": "table", "t": "一批草莓優格的追溯鏈（示意）", "head": ["層級", "內容"], "rows": [["成品批號", "YG0915A，24,000 杯"], ["工單", "W0915-03"], ["投料", "生乳 R0914-2、果粒醬 J0910-1（720 kg）、菌種 C0901"], ["出貨", "量販 A 12,000 杯、超商 B 8,000 杯、庫存 4,000 杯"]], "note": ""}], [{"k": "tool", "t": "追溯演練計時表", "i": ["原料批號 → 所有工單（記下花幾分鐘）", "工單 → 成品批號", "成品 → 出貨客戶與數量", "物料平衡：進貨 ＝ 各工單用量＋庫存＋紀錄的損耗"], "script": "「衛管，J0910-1 共用在兩批成品：YG0915A 和 YG0916B，合計 48,000 杯。已出貨 26,000 杯，客戶名單附在信裡；倉庫 22,000 杯已請倉管隔離。原料進貨 1,500 kg，兩批用掉 1,440 kg，倉庫剩下的也已隔離，數量我正在核對。」", "back": ["用本廠一個實際批號，計時完成一次追溯，並做一次物料平衡。"]}]], "prod-14-2": [[{"k": "head", "t": "批號、效期與追溯", "g": "能算出回收數量，並從物料平衡看出紀錄的漏洞。"}, {"k": "adv", "t": "批號與追溯", "i": ["批號至少要能對應：生產日期、產線、班別。", "追溯演練要計時，記錄每一段花的時間與卡關原因。", "物料平衡（mass balance）：原料進貨量＝各工單用量＋庫存＋紀錄的損耗；對不上就代表有紀錄漏洞。", "出貨紀錄要查得到客戶、批號、數量、出貨日；缺一項就追不完整。"]}], [{"k": "table", "t": "果粒醬批 J0910-1 有疑慮", "head": ["成品批號", "使用量", "已出貨", "庫存"], "rows": [["YG0915A", "720 kg（24,000 杯）", "20,000 杯", "4,000 杯"], ["YG0916B", "720 kg（24,000 杯）", "6,000 杯", "18,000 杯"]], "note": ""}, {"k": "quiz", "key": "q-prodR14a", "star": 2, "q": "需要通知客戶回收的總杯數是多少？", "o": ["24,000 杯", "26,000 杯", "48,000 杯"], "a": 1, "y": "兩批都用了疑慮原料。已出貨 20,000＋6,000＝26,000 杯要追回，庫存 22,000 杯直接隔離。48,000 是把庫存也算進回收；24,000 只算了一批。"}], [{"k": "table", "t": "J0910-1 物料平衡（示意）", "head": ["項目", "數量"], "rows": [["進貨", "1,500 kg"], ["YG0915A 投料", "720 kg"], ["YG0916B 投料", "720 kg"], ["倉庫盤點剩餘", "40 kg"]], "note": ""}, {"k": "quiz", "key": "q-prodR14b", "star": 3, "q": "這份物料平衡代表什麼？", "o": ["帳實相符，可以結案", "有 20 kg 去向不明，要查是否有其他工單使用或未記錄的損耗", "多出 20 kg，供應商多給了"], "a": 1, "y": "1,500 − 720 − 720＝60 kg，應剩 60 kg，實際只有 40 kg，少了 20 kg。這 20 kg 可能用在沒記錄的工單，也就是可能還有一批成品沒被追到，必須查清楚才能結案。"}, {"k": "reflect", "q": "你們追溯一批產品，目前大概要多久？哪一段最慢？"}]], "prod-15-0": [[{"k": "head", "t": "KPI：達交率與 OEE", "g": "能拆解 OEE 三個因子、算對達交率，找出最該改善的一項。"}, {"k": "ben", "me": "會拆解 KPI，你就能說清楚問題在哪、該怎麼改。", "co": "改善集中在最有效的地方，報告也更有說服力。"}, {"k": "predict", "key": "p-prodR15n", "q": "優格冰線 OEE 從 70% 升到 80%，同月達交率卻從 92% 掉到 88%（示意）。最可能的原因是？", "o": ["為了減少換線，拉長單一口味的批量，其他口味的急單排到後面", "停機變少了，達交率下降應該是報表時間差", "產能變大，接的訂單也變多，所以準時率下降"], "a": 0, "r": "OEE 看設備效率，達交率看有沒有在對的時間做對的東西。為了衝 OEE 少換線、拉大批量，常讓其他品項的交期延後，兩個指標要一起看。"}], [{"k": "points", "h": "兩個核心指標", "i": ["達交率＝準時且足量交貨的訂單 ÷ 總訂單；部分出貨不算達交。", "OEE＝稼動率 × 性能率 × 良率。", "拆開三個因子，才知道損失來自停機、速度還是不良。"]}, {"k": "diagram", "kind": "tree", "title": "OEE 的三種損失", "root": "OEE", "kids": [["稼動率", ["換線", "故障", "清潔", "待料"]], ["性能率", ["小停頓", "降速"]], ["良率", ["不良", "重工"]]]}], [{"k": "points", "h": "看指標的原則", "i": ["先看總指標有沒有達標，再拆因子，找最低的一項。", "指標之間會互相影響：OEE 高但做錯產品，達交率還是低。", "要有目標值與趨勢，只看單月數字容易誤判。"]}, {"k": "flip", "key": "f-prodR15", "x": "OEE 越高，工廠表現就越好。", "r": "OEE 衡量設備效率，不代表做的是客戶要的產品；要和達交率、庫存一起看。"}], [{"k": "fact", "t": "OEE 常被引用的世界級標竿約 85%，但和同業比較前，要先確認計算方式一致，例如計畫停機有沒有扣除。"}, {"k": "take", "t": "指標不是用來交報告的，是用來找下一個改善點。"}]], "prod-15-1": [[{"k": "head", "t": "KPI：達交率與 OEE", "g": "能用兩個指標一起解釋「效率變好、客戶卻抱怨」的原因。"}, {"k": "story", "who": "生管", "t": "月會上生管報告：優格冰線 OEE 從 70% 提升到 73.5%。業務馬上說：「可是這個月客戶抱怨缺貨更多。」生管回去查，發現為了拉高 OEE，產線集中做大量的原味，少量的季節口味被往後排。"}, {"k": "points", "h": "生管該怎麼做", "i": ["把達交率和 OEE 放在同一張報表，一起檢討。", "算出達交率時，部分出貨也要算成未達交。", "排程以達交為優先，OEE 改善放在換線與故障，而不是只做大單。"]}], [{"k": "table", "t": "雪坊 9 月 OEE（示意）", "head": ["產線", "稼動率", "性能率", "良率", "OEE"], "rows": [["優格線", "90%", "90%", "97%", "78.6%"], ["優格冰線", "80%", "93.75%", "98%", "73.5%"], ["果醬線", "85%", "90%", "98%", "75.0%"]], "note": ""}, {"k": "calc", "kind": "oee"}], [{"k": "tool", "t": "KPI 拆解三步", "i": ["先看總指標有沒有達標", "拆成因子，找出最低的一項", "找出最低因子背後的前三大原因", "再看另一個指標有沒有被犧牲"], "script": "「這個月優格冰線 OEE 73.5%，三個因子中稼動率 80% 最低，主要是換線 28 小時。下個月我們先把換線時間減半，預估 OEE 可到 77.5%；同時排程會先保達交，不會為了 OEE 只做大單。」", "back": ["找出本廠每月的 OEE 或達交率報表，試著拆一次。"]}]], "prod-15-2": [[{"k": "head", "t": "KPI：達交率與 OEE", "g": "能算對達交率，並算出改善單一因子後的 OEE。"}, {"k": "adv", "t": "KPI 拆解", "i": ["稼動率＝實際運轉時間 ÷ 計畫生產時間；損失看停機原因。", "性能率損失看小停頓與降速；良率損失看不良分類。", "達交率要同時看「準時」與「足量」，部分出貨也算未達交。", "改善單一因子後，要重新相乘計算 OEE，不能只看那一個因子。"]}], [{"k": "table", "t": "9 月訂單（示意）", "head": ["項目", "張數"], "rows": [["總訂單", "120"], ["準時出貨", "110"], ["其中部分出貨（數量不足）", "4"]], "note": ""}, {"k": "quiz", "key": "q-prodR15a", "star": 2, "q": "9 月的達交率是多少？", "o": ["約 91.7%", "約 88.3%", "約 95.0%"], "a": 1, "y": "達交要準時又足量：110 − 4＝106 張，106 ÷ 120≈88.3%。91.7% 是把部分出貨也算進去。"}], [{"k": "table", "t": "優格冰線 9 月停機 64 小時（計畫生產 320 小時）", "head": ["原因", "小時"], "rows": [["換線", "28"], ["故障", "18"], ["清潔", "12"], ["待料", "6"]], "note": ""}, {"k": "quiz", "key": "q-prodR15b", "star": 3, "q": "如果換線時間減半，其他不變，優格冰線的 OEE 約變成多少？", "o": ["約 73.5%，不變", "約 77.5%", "約 84.4%"], "a": 1, "y": "停機 64 → 50 小時，稼動率＝270 ÷ 320≈84.4%；OEE＝84.4% × 93.75% × 98%≈77.5%。84.4% 只是新的稼動率，還要乘上性能率與良率。"}, {"k": "reflect", "q": "你的產線三個 OEE 因子中，哪一個最低？達交率有沒有被犧牲？"}]], "prod-16-0": [[{"k": "head", "t": "從排程看成本", "g": "能說出排程決策怎麼影響每杯成本，並估算一次換線的成本。"}, {"k": "ben", "me": "懂成本的生管，往更高職位的路會走得更穩。", "co": "每一張排程，都在幫公司守住毛利。"}, {"k": "predict", "key": "p-prodR16", "q": "產量只有計畫的一半時，每杯分攤到的固定費用會？", "o": ["不變", "約變成兩倍", "減半"], "a": 1, "r": "廠房、折舊不隨產量變；產量減半，每杯分攤的固定費用約變成兩倍。"}], [{"k": "points", "h": "產品成本三大塊", "i": ["直接材料：BOM 用量 × 單價，含損耗。", "直接人工：投入人時 × 工資率 ÷ 良品數。", "製造費用：折舊、水電、維修等，按產量分攤。"]}, {"k": "diagram", "kind": "tree", "title": "每杯成本從哪來", "root": "每杯成本", "kids": [["材料", ["原料", "包材", "損耗"]], ["人工", ["正常工時", "加班"]], ["製造費用", ["折舊", "水電", "維修"]]]}], [{"k": "points", "h": "排程怎麼影響成本", "i": ["換線越多：停機時間、清洗耗材、損耗都增加。", "產量越低：固定費用分攤到每杯越多。", "加班與報廢：直接推高人工與材料成本。"]}, {"k": "flip", "key": "f-prodR16", "x": "成本是會計在算的，跟排程無關。", "r": "排程決定換線次數、加班與報廢，這些都直接反映在每杯成本上。"}], [{"k": "fact", "t": "不良品的成本不會消失，而是由良品吸收：單位成本＝總成本 ÷ 良品數。良率下降，每杯成本就跟著上升。"}, {"k": "take", "t": "生管排的每一張單，最後都會變成財務報表上的數字。"}]], "prod-16-1": [[{"k": "head", "t": "從排程看成本", "g": "能用成本數字回應「小量多樣」的訂單需求。"}, {"k": "story", "who": "生管", "t": "業務希望下個月推 6 種季節口味，每種只做 2,000 杯，「讓貨架看起來更豐富」。生管算了一下：這代表優格線每月要多換線 6 次，每次停機 80 分鐘。"}, {"k": "points", "h": "生管該怎麼做", "i": ["估算一次換線的成本：停機的固定費用、人工、清洗耗材。", "算出多換線 6 次的總成本，換算成每杯增加多少。", "提出選項：合併口味、加大每批數量，或調整售價。"]}], [{"k": "table", "t": "雪坊 9 月：優格線成本（示意）", "head": ["項目", "計算", "每杯"], "rows": [["材料", "—", "9.00 元"], ["人工", "560,000 ÷ 251,424", "2.23 元"], ["製造費用", "900,000 ÷ 251,424", "3.58 元"], ["合計", "—", "約 14.81 元"]], "note": ""}], [{"k": "tool", "t": "換線成本估算", "i": ["停機時數 × 每小時固定費用分攤", "＋停機期間的人工（人數 × 時數 × 每人時成本）", "＋清洗耗材與損耗", "× 每月換線次數"], "script": "「業務經理，6 種口味每種 2,000 杯，每月要多換線 6 次，每次約 6,300 元，一個月多約 3.8 萬元，換算每杯季節口味多約 3 元。如果改成 3 種口味、每種 4,000 杯，換線次數和成本都少一半。您看哪一個比較符合行銷目標？」", "back": ["向會計確認本廠每小時製造費用的分攤標準。"]}]], "prod-16-2": [[{"k": "head", "t": "從排程看成本", "g": "能算出產量下降與換線對每杯成本的影響。"}, {"k": "adv", "t": "排程與成本", "i": ["單位成本＝（材料＋人工＋製造費用）÷ 良品數；不良品的成本由良品吸收。", "固定費用（折舊、廠房）不隨產量變動，產量越低，每杯分攤越多。", "一次換線的成本＝停機時間 × 每小時固定費用分攤＋停機人工＋清洗耗材＋損耗。", "生管能影響成本的槓桿：減少換線次數、穩定排程、降低報廢。"]}], [{"k": "table", "t": "優格線 10 月（原料延遲）", "head": ["項目", "數值"], "rows": [["良品", "200,000 杯"], ["材料", "每杯 9 元"], ["人工總額", "520,000 元"], ["製造費用", "900,000 元"]], "note": ""}, {"k": "quiz", "key": "q-prodR16a", "star": 3, "q": "10 月每杯成本約是多少？", "o": ["約 14.8 元", "約 16.1 元", "約 11.6 元"], "a": 1, "y": "人工 520,000 ÷ 200,000＝2.6 元；製造費用 900,000 ÷ 200,000＝4.5 元；合計 9＋2.6＋4.5＝16.1 元，比 9 月高約 1.3 元。11.6 元漏算了製造費用。"}], [{"k": "table", "t": "一次換線（示意）", "head": ["項目", "數值"], "rows": [["停機時間", "80 分鐘"], ["每小時固定費用分攤", "2,500 元"], ["線上人數", "10 人"], ["每人時成本", "200 元"], ["清洗耗材", "300 元"]], "note": ""}, {"k": "quiz", "key": "q-prodR16b", "star": 2, "q": "一次換線的成本約是多少？", "o": ["約 3,633 元", "約 6,300 元", "約 2,967 元"], "a": 1, "y": "固定費用 80/60 × 2,500≈3,333 元；人工 80/60 × 10 × 200≈2,667 元；耗材 300 元；合計約 6,300 元。3,633 元漏了人工；2,967 元漏了固定費用。"}, {"k": "reflect", "q": "你負責的產品中，哪一項費用最影響成本？"}]], "qa-2-0": [[{"k": "head", "t": "優格冰流程：PRP 與 OPRP", "g": "說得出優格冰為什麼靠 OPRP 管控，以及熱水清洗的標準。"}, {"k": "ben", "me": "懂 PRP 和 OPRP，你就能說清楚優格冰依本廠 HACCP 計畫怎麼管控、靠什麼保證安全。", "co": "優格冰的安全，守在每一次開工前。"}, {"k": "predict", "key": "p-qa2", "q": "優格冰的安全，主要靠什麼守住？", "o": ["最後的急速冷凍", "原料、清洗、溫度與時間等前提方案", "包裝"], "a": 1, "r": "冷凍只能停止細菌生長，不能殺菌。優格冰依本廠 HACCP 計畫管控，原料、清洗、溫度等每一道前提方案都要守住。"}], [{"k": "diagram", "kind": "flow", "title": "優格冰產線", "steps": [["開工熱水清洗", "oprp"], ["備料", ""], ["秤料", ""], ["均質", ""], ["冷藏備用", ""], ["製冰", ""], ["裝填秤重", ""], ["急速冷凍", ""], ["換口味清洗", "clean"], ["入庫", ""], ["出貨", ""]], "note": "橘色為 OPRP；實際分類以本廠 HACCP 計畫為準。"}, {"k": "points", "h": "OPRP：開工熱水清洗", "i": ["依本廠規定的溫度，使用煮過的熱水流過冰淇淋機內部。", "在出水口確認水溫達本廠規定的下限，記錄水溫與時間。", "出水未達下限不得投產，要重新清洗並通知衛管。"]}], [{"k": "points", "h": "其他要守的關卡", "i": ["原料：乳原料與乳酸菌要符合規格，驗收看效期與溫度。", "冷藏備用：7°C 以下並遵守存放時限，先做先用。", "環境：冷凍、潮濕的充填區，要特別注意李斯特菌。"]}, {"k": "flip", "key": "f-qa2", "x": "冷凍就能殺菌，所以優格冰比較安全。", "r": "冷凍只讓多數細菌停止生長，回溫後可能再長；李斯特菌在低溫下也能存活。"}, {"k": "take", "t": "優格冰的安全，靠的是依本廠 HACCP 計畫做好每一次清洗、驗收與溫度控制。"}]], "qa-2-1": [[{"k": "head", "t": "優格冰流程：PRP 與 OPRP", "g": "OPRP 未達標時，知道怎麼處理。"}, {"k": "story", "who": "衛管", "t": "週一早上 07:50，衛管檢查開工紀錄：熱水溫度符合規定，但出水溫度比本廠規定的下限低了 2°C，操作員已經準備投料。"}, {"k": "table", "t": "開工熱水清洗紀錄（示意）", "head": ["時間", "熱水溫度", "出水溫度", "判定"], "rows": [["07:40", "符合規定", "低於下限 2°C", "未達標"], ["07:55", "符合規定", "高於下限 1°C", "符合"]], "note": "第一次出水未達標，重新清洗後才符合。"}], [{"k": "points", "h": "衛管怎麼處理", "i": ["叫停投料：出水未達下限，不得投產。", "找原因：熱水量不夠、管路太長散熱、流過時間太短。", "重新清洗、確認達標並記錄後，才讓產線開工。"]}, {"k": "tool", "t": "OPRP 開工三確認", "i": ["熱水是煮過的、溫度符合本廠規定嗎？", "出水口量到的溫度有沒有達本廠規定的下限？", "紀錄有沒有寫溫度、時間、確認人？"], "back": ["拿出本廠的開工清洗紀錄表與 HACCP 計畫，確認熱水與出水溫度的規定值，以及這三項都有欄位可以填。"]}]], "qa-2-2": [[{"k": "head", "t": "優格冰流程：PRP 與 OPRP", "g": "能判讀 OPRP 偏離，也會算膨脹率。"}, {"k": "adv", "t": "膨脹率與重量", "i": ["膨脹率＝（成品體積 − 混合液體積）÷ 混合液體積 × 100%。", "用重量換算：同一個容器，膨脹率＝（混合液重 − 成品重）÷ 成品重 × 100%。", "膨脹率越高，同一杯越輕；太高可能不符標示淨重。"]}], [{"k": "table", "t": "同一個杯子裝滿後秤重", "head": ["內容物", "重量"], "rows": [["混合液（製冰前）", "100 g"], ["成品優格冰", "50 g"]], "note": ""}, {"k": "quiz", "key": "q-qa2a", "star": 2, "q": "這批優格冰的膨脹率是多少？", "o": ["50%", "100%", "200%"], "a": 1, "y": "膨脹率＝（100 − 50）÷ 50 × 100%＝100%。選 50% 是把分母誤用成混合液重。"}], [{"k": "quiz", "key": "q-qa2b", "star": 3, "q": "出水未達標的那 10 分鐘，產線已經用這台機器做了一桶混合液。正確處置是？", "o": ["已經要冷凍了，沒關係", "隔離那一桶，重新清洗達標後再生產，並交衛管評估", "把紀錄改成符合下限的數字"], "a": 1, "y": "OPRP 未達行動準則時，受影響的產品要隔離評估；冷凍不能殺菌，竄改紀錄更是嚴重違規。"}], [{"k": "reflect", "q": "你們的開工清洗紀錄，最可能在哪一步出現漏洞？"}]], "qa-3-0": [[{"k": "head", "t": "果醬流程與 CCP", "g": "能說明糖度、pH、加熱如何一起保護果醬，並判讀烹煮紀錄。"}, {"k": "ben", "me": "懂糖、酸、果膠的原理，你就能參與新品與降糖產品的討論。", "co": "降糖新品也能安全上市，客訴與發霉退貨變少。"}, {"k": "predict", "key": "p-qaR3", "q": "果醬可以常溫保存，主要靠什麼？", "o": ["防腐劑", "高糖度、低 pH，加上加熱", "真空包裝"], "a": 1, "r": "糖降低可用水分、酸抑制微生物、加熱殺菌，三者一起作用。"}], [{"k": "points", "h": "三道防線", "i": ["糖度（Brix）：降低可用水分，抑制微生物，也幫助凝膠。", "酸度（pH）：pH 4.6 以下，肉毒桿菌不易生長；一般果醬的 pH 遠低於 4.6。", "加熱：烹煮（CCP）負責濃縮與殺菌，並讓果膠形成凝膠。"]}, {"k": "diagram", "kind": "flow", "title": "雪坊果醬流程（示意）", "steps": [["驗收", ""], ["挑選", ""], ["清洗", ""], ["再挑選", ""], ["烹煮", "ccp"], ["糖度／pH", ""], ["熱充填", ""], ["倒置冷卻", ""]], "note": "紅色＝CCP。實際以本廠 HACCP 計畫為準。"}], [{"k": "points", "h": "容易被忽略的環節", "i": ["兩道挑選：清洗前挑腐爛與破損，清洗後挑異物與昆蟲。", "農藥殘留在驗收時把關，要有檢驗報告或快篩紀錄。", "熱充填後倒置，可以利用產品熱度處理瓶蓋內側；封蓋要確認完整。"]}, {"k": "flip", "key": "f-qaR3", "x": "果醬糖這麼多，不會壞。", "r": "糖度不足、封蓋不良或開封後汙染，都可能發霉；降糖產品的風險更高。"}], [{"k": "fact", "t": "pH 4.6 是食品安全的重要分界：pH 4.6 以下的酸性食品，肉毒桿菌不易生長並產生毒素。"}, {"k": "take", "t": "果醬能常溫保存，靠的是糖度、酸度與加熱三者一起作用。"}]], "qa-3-1": [[{"k": "head", "t": "果醬流程與 CCP", "g": "能從一份烹煮紀錄判斷哪一批要隔離，並說明原因。"}, {"k": "story", "who": "衛管", "t": "這週果醬線換了一家新果農的草莓，果實比較多汁。衛管抽看烹煮紀錄時發現 J3 的 Brix 只有 60.2，產線說：「顏色和口感都正常，應該沒關係吧？」"}, {"k": "points", "h": "衛管該怎麼做", "i": ["J3 先隔離，不因外觀正常就放行。", "和產線確認烹煮時間與終點判斷：多汁的原料需要更長的濃縮時間。", "評估 J3 能否回鍋重煮或降級處理，並記錄矯正措施。"]}], [{"k": "table", "t": "9 月果醬烹煮紀錄（示意，規格：Brix ≥ 62、pH ≤ 3.5）", "head": ["批次", "Brix", "pH"], "rows": [["J1", "64.5", "3.2"], ["J2", "63.8", "3.3"], ["J3", "60.2", "3.4"], ["J4", "65.0", "3.1"]], "note": ""}], [{"k": "tool", "t": "果醬批次放行三看", "i": ["Brix 有沒有達規格", "pH 有沒有在範圍內", "烹煮溫度與時間紀錄是否完整", "封蓋與倒置是否確實"], "script": "「各位，這週草莓比較多汁，烹煮的終點不要只看時間，一定要量 Brix，達到規格才能停火。量到不夠的，先跟我說，不要直接充填。」", "back": ["確認本廠果醬的 Brix 與 pH 規格寫在哪份文件、由誰量測與簽核。"]}]], "qa-3-2": [[{"k": "head", "t": "果醬流程與 CCP", "g": "能判斷不合格批次，並算出濃縮後的成品重量。"}, {"k": "adv", "t": "糖、酸、果膠的平衡", "i": ["傳統果醬靠高糖度、低 pH 與果膠共同形成凝膠，並幫助保存。", "高甲氧基果膠需要高糖度與較低 pH 才能凝膠；低糖果醬常改用低甲氧基果膠，靠鈣離子形成凝膠。", "水果的酸度與果膠含量會隨品種、成熟度變化，同一配方每批結果可能不同，所以糖度與 pH 要每批量測。", "降糖產品少了一道防線，常要搭配更嚴格的加熱、封蓋與冷藏條件。"]}], [{"k": "table", "t": "同一份烹煮紀錄（規格：Brix ≥ 62、pH ≤ 3.5）", "head": ["批次", "Brix", "pH"], "rows": [["J1", "64.5", "3.2"], ["J2", "63.8", "3.3"], ["J3", "60.2", "3.4"], ["J4", "65.0", "3.1"]], "note": ""}, {"k": "quiz", "key": "q-qaR3a", "star": 1, "q": "哪一批要先隔離評估？", "o": ["J2", "J3", "全部合格"], "a": 1, "y": "J3 糖度 60.2 低於規格 62；pH 雖然在範圍內，糖度不足仍會影響保存性與凝膠。"}], [{"k": "table", "t": "烹煮濃縮試算（示意）", "head": ["項目", "數值"], "rows": [["果泥加糖後重量", "200 kg"], ["烹煮前 Brix", "40"], ["目標 Brix", "64"]], "note": "假設烹煮只蒸發水分，可溶性固形物重量不變。"}, {"k": "quiz", "key": "q-qaR3b", "star": 3, "q": "煮到 Brix 64 時，鍋內約剩多少 kg？", "o": ["約 80 kg", "約 125 kg", "約 160 kg"], "a": 1, "y": "可溶性固形物＝200 × 40%＝80 kg；80 ÷ 64%＝125 kg，要蒸發約 75 kg 水分。80 kg 是只剩固形物的重量；160 kg 是蒸發量算太少。濃縮不足，Brix 就達不到規格。"}, {"k": "reflect", "q": "兩道挑選的人，知道自己要找什麼嗎？有樣品或照片可以對照嗎？"}]], "qa-4-0": [[{"k": "head", "t": "病原菌與殺菌原理", "g": "能說出常見病原菌的特性，以及加熱擋得住什麼、擋不住什麼。"}, {"k": "ben", "me": "懂病原菌，你的食安判斷會有科學根據，說服產線也更有力。", "co": "預防重於檢驗，降低重大食安事件的風險。"}, {"k": "predict", "key": "p-qaR4n", "q": "冷凍庫跳電，優格冰回溫一段時間後又重新凍硬，外觀正常。怎麼判斷？", "o": ["重新凍硬後，菌會回到冷凍時的狀態，可以放行", "回溫過的冷凍品一律報廢", "依回溫的時間與溫度紀錄評估，必要時抽驗再判定"], "a": 2, "r": "冷凍只讓多數細菌停止生長，不會殺死它們；回溫期間菌可能已經繁殖，再凍硬也不會減少。依紀錄評估、交衛管判定，處置依本廠規定；一律報廢則看不到真正的影響範圍。"}], [{"k": "points", "h": "衛管常見微生物：四類", "i": ["好菌：乳酸菌。製程要它長，雜菌搶先它就會失敗。", "腐敗菌：酵母菌、黴菌。讓產品變質、脹杯、發霉，多數不會讓人急性生病。", "指標菌：總生菌數、大腸桿菌群、大腸桿菌。像衛生的「體溫計」，用來判斷有沒有殺菌不足或再汙染。", "病原菌：李斯特菌、沙門氏菌、金黃色葡萄球菌。會讓人生病，是危害分析的重點。"]}, {"k": "fact", "t": "判定是否合格，依《食品中微生物衛生標準》與本廠規定；各品項要檢驗哪些項目並不相同。"}], [{"k": "table", "t": "好菌與腐敗菌", "head": ["微生物", "從哪裡來／危害", "加熱與避免"], "rows": [["乳酸菌", "菌種投入。把乳糖變成乳酸，讓優格變酸、凝固", "加熱：殺菌後才接菌。\n避免：菌種批號、投入量、發酵溫度與時間照規定"], ["酵母菌", "空氣、水果、設備、手。耐酸耐糖，造成脹杯、脹蓋、酒味", "加熱：一般加熱可殺死。\n避免：防止殺菌後再汙染、冷鏈不斷、封口確實"], ["黴菌", "空氣中的孢子、腐爛水果。表面長斑；部分會產生黴菌毒素", "加熱：少數孢子耐熱；毒素多半耐熱。\n避免：原料挑除腐爛、封蓋密封、避免冷凝水"]], "note": "黴菌毒素一旦產生，加熱也不容易去除，所以原料挑選是第一道防線。"}], [{"k": "table", "t": "指標菌：看衛生，不一定致病", "head": ["項目", "代表什麼", "檢出時想到"], "rows": [["總生菌數", "整體微生物量，反映衛生與保存狀況", "原料品質、清潔、溫度管理"], ["大腸桿菌群", "不耐熱；環境中常見", "殺菌不足，或殺菌後再汙染"], ["大腸桿菌", "多與糞便汙染有關；少數菌株會致病（如 O157:H7）", "人員衛生、用水、原料汙染"]], "note": "優格本身含大量乳酸菌，總生菌數高不代表不衛生；判讀要看該品項規定的檢驗項目。"}, {"k": "flip", "key": "f-qaR4b", "x": "大腸桿菌群陰性，就代表沒有病原菌。", "r": "指標菌只能反映衛生狀況；李斯特菌這類病原菌要另外依計畫檢驗與環境監測。"}], [{"k": "table", "t": "病原菌：會讓人生病", "head": ["病原菌", "從哪裡來／特性", "加熱與避免"], "rows": [["李斯特菌", "潮濕環境、排水孔；冷藏溫度下仍能生長，孕婦、新生兒、年長者風險高", "加熱：可殺死。\n避免：乾濕分區、排水孔清潔、環境監測"], ["沙門氏菌", "生乳、蛋、禽肉；也可能來自未再加熱的乾性配料", "加熱：可殺死。\n避免：原料規格與驗收、後段加入的配料要確認來源"], ["金黃色葡萄球菌", "人的手、鼻腔、傷口；在溫度不當時大量生長並產生腸毒素", "加熱：菌會死，毒素耐熱。\n避免：洗手、傷口回報、半成品不在室溫久放"]], "note": "實際要管控的微生物危害，以本廠危害分析與 HACCP 計畫為準。"}], [{"k": "points", "h": "加熱殺得死的", "i": ["李斯特菌：能在冷藏溫度下緩慢生長，對孕婦、新生兒、年長者風險高；喜歡潮濕的冷藏冷凍環境。", "沙門氏菌：常與生乳、蛋、禽肉相關，引起發燒、腹瀉；充分加熱可殺滅。", "腸道出血性大腸桿菌（如 O157:H7）：少量就能致病，可能引起血便。"]}, {"k": "diagram", "kind": "tree", "title": "加熱擋得住、擋不住", "root": "加熱", "kids": [["擋得住", ["李斯特菌", "沙門氏菌", "O157:H7"]], ["擋不住", ["金黃色葡萄球菌毒素", "仙人掌桿菌孢子", "殺菌後再汙染"]]]}], [{"k": "points", "h": "加熱也擋不住的", "i": ["金黃色葡萄球菌：來自人的手、鼻腔與傷口，會產生耐熱腸毒素。", "仙人掌桿菌：會形成耐熱孢子，嘔吐型毒素也耐熱，乳品中可能出現。", "肉毒桿菌：毒素毒性極強；在低酸（pH 高於 4.6）、缺氧環境可能生長。"]}, {"k": "flip", "key": "f-qaR4", "x": "檢驗合格，就代表整批安全。", "r": "抽樣檢驗只看得到樣品；安全要靠製程管制（CCP、GHP、環境監測）一起保證。"}], [{"k": "fact", "t": "金黃色葡萄球菌的毒素耐熱，所以「最後有加熱」不能取代人員衛生。這也是 GHP 要求洗手、傷口管理的原因。"}, {"k": "take", "t": "有些菌加熱就死，有些菌留下的毒素，加熱也破壞不了。"}]], "qa-4-1": [[{"k": "head", "t": "病原菌與殺菌原理", "g": "能說明雪坊三條線分別靠什麼抑制病原菌，以及哪一段最怕再汙染。"}, {"k": "story", "who": "衛管", "t": "產線組長問衛管：「優格都已經殺菌了，充填區的人為什麼還要這麼嚴格洗手？」衛管想了想，決定用三條線的差異來解釋。"}, {"k": "points", "h": "衛管可以這樣說明", "i": ["優格：生乳加熱殺菌後才接菌，殺菌之後的充填、封口是再汙染的關鍵。", "優格冰：依本廠 HACCP 計畫管控，OPRP 熱水清洗與人員衛生是重點，手和設備就是防線。", "果醬：靠烹煮、高糖、低 pH；熱充填後封蓋不良，也可能讓黴菌進入。"]}], [{"k": "table", "t": "雪坊三條線靠什麼抑制病原菌（示意）", "head": ["產品", "主要防線", "最怕什麼"], "rows": [["優格", "加熱殺菌、低 pH、冷藏", "殺菌後再汙染"], ["優格冰", "OPRP 熱水清洗、人員衛生、冷凍", "設備殘留、人員汙染"], ["果醬", "烹煮、高糖、低 pH", "糖度不足、封蓋不良"]], "note": "實際以本廠 HACCP 計畫為準。"}], [{"k": "table", "t": "三條線各要注意哪些菌（示意）", "head": ["產品", "最要注意", "衛管看什麼"], "rows": [["優格", "大腸桿菌群、酵母菌、黴菌（殺菌後再汙染）", "充填封口衛生、冷鏈、脹杯客訴"], ["優格冰", "李斯特菌、金黃色葡萄球菌、沙門氏菌（配料）", "環境監測、人員衛生、配料規格"], ["果醬", "酵母菌、黴菌、黴菌毒素", "原料挑選、糖度與 pH、封蓋密封"]], "note": "依本廠 HACCP 計畫管控；此表為學習示意。"}, {"k": "recall", "key": "r-qaR4a", "q": "為什麼「最後有加熱」，還是擋不住金黃色葡萄球菌？", "a": "菌會被殺死，但它先前產生的腸毒素耐熱，加熱也破壞不了；所以要靠洗手、傷口管理與溫度時間控制。"}, {"k": "recall", "key": "r-qaR4b", "q": "殺菌後驗出大腸桿菌群，第一個要想到什麼？", "a": "大腸桿菌群不耐熱：殺菌紀錄正常時，最可能是殺菌後再汙染，要查充填設備、人員與環境。"}], [{"k": "tool", "t": "危害快速判斷卡", "i": ["這個菌能被加熱殺死嗎？", "它會產生耐熱毒素或孢子嗎？", "它能在冷藏溫度下生長嗎？", "殺菌之後，還有哪些步驟會碰到產品？"], "script": "「各位，殺菌只能殺死生乳裡原本的菌。殺菌之後，手、充填頭、杯子碰到產品，就沒有第二次加熱了。尤其金黃色葡萄球菌的毒素加熱也破壞不了，所以手上有傷口一定要先跟我說。」", "back": ["對照本廠危害分析表，看各產品列了哪些微生物危害。"]}]], "qa-4-2": [[{"k": "head", "t": "病原菌與殺菌原理", "g": "能用對數減少計算殺菌後的殘留，理解原料品質的重要。"}, {"k": "adv", "t": "對數減少（log reduction）", "i": ["1-log 減少＝菌數減少 90%；2-log＝99%；5-log＝99.999%。", "加熱效果和初始菌量有關：同樣減少 5-log，原料菌量高 10 倍，殘留也高 10 倍。", "D 值：在特定溫度下，讓菌數減少 1-log 所需的時間；溫度越高，D 值越短。", "所以原料驗收、冷藏與衛生，和殺菌一樣重要。"]}, {"k": "extra", "t": "檢驗方式", "i": ["指標菌：生菌數、大腸桿菌群、大腸桿菌，用來判斷整體衛生狀況。", "培養法通常需要數天；PCR 等快速方法約一天可篩檢，陽性仍需確認。", "判定依據：《食品中微生物衛生標準》；委外檢驗選擇通過認證的實驗室。"]}], [{"k": "table", "t": "加熱殺菌試算", "head": ["項目", "數值"], "rows": [["加熱前菌數", "1,000,000 CFU/g"], ["加熱效果", "減少 5-log"]], "note": ""}, {"k": "quiz", "key": "q-qaR4a", "star": 2, "q": "加熱後約剩多少菌？", "o": ["0 CFU/g", "10 CFU/g", "100,000 CFU/g"], "a": 1, "y": "減少 5-log 是降到原本的十萬分之一：1,000,000 ÷ 100,000＝10。加熱不會讓菌數歸零，所以初始菌量越低越安全。"}], [{"k": "quiz", "key": "q-qaR4c", "star": 2, "q": "優格成品驗出大腸桿菌群，但同批殺菌紀錄全部符合。最可能代表什麼？", "o": ["殺菌溫度不夠", "殺菌後再汙染：查充填設備、人員與環境", "乳酸菌太多造成誤判"], "a": 1, "y": "大腸桿菌群不耐熱，殺菌紀錄正常時，最可能是殺菌之後的充填、封口或環境再汙染。乳酸菌不會被算成大腸桿菌群。"}, {"k": "quiz", "key": "q-qaR4d", "star": 2, "q": "客訴：果醬未開封，瓶內表面有白色絨毛斑點。最可能是哪一類？下一步？", "o": ["指標菌，加做大腸桿菌群", "黴菌：查封蓋密封、原料挑選，並追同批留樣", "乳酸菌，屬正常現象"], "a": 1, "y": "表面絨毛斑點是黴菌的典型樣子。未開封就發霉，要懷疑封蓋不良或原料孢子，追同批留樣與封蓋紀錄。"}], [{"k": "quiz", "key": "q-qaR4e", "star": 3, "q": "組員手上有傷口沒回報，處理已殺菌的半成品；半成品在室溫放了好幾個小時，之後再加熱一次。這批安全嗎？", "o": ["安全，再加熱就殺菌了", "不一定：金黃色葡萄球菌可能已產生耐熱毒素，要交衛管評估", "只要之後冷藏就安全"], "a": 1, "y": "再加熱能殺死菌，但破壞不了已產生的腸毒素。傷口、室溫久放兩個條件同時出現，就要評估這批產品，並檢討傷口回報規則。"}], [{"k": "quiz", "key": "q-qaR4b", "star": 3, "q": "如果生乳在常溫多放了幾小時，菌數變成 10,000,000 CFU/g，同樣減少 5-log，殘留約多少？", "o": ["10 CFU/g", "100 CFU/g", "1,000 CFU/g"], "a": 1, "y": "10,000,000 ÷ 100,000＝100 CFU/g，是原本的 10 倍。殺菌條件不變時，原料菌數越高，殘留就越高；這就是生乳驗收與冷藏要嚴格把關的原因。"}, {"k": "reflect", "q": "雪坊三條線中，哪一個步驟最可能發生「殺菌後再汙染」？"}]], "qa-5-0": [[{"k": "head", "t": "GHP：人員與環境", "g": "能指出進廠流程中最容易被跳過的步驟，並用數據帶動改善。"}, {"k": "ben", "me": "能帶動現場的衛生習慣，是衛管最有影響力的工作。", "co": "從源頭減少汙染，稽查時最常被抓的人員缺失也跟著減少。"}, {"k": "predict", "key": "p-qaR5n", "q": "充填站組員戴著新手套作業，中途幫忙推了一下料車，回來想繼續充填。正確做法是？", "o": ["依本廠規定更換手套後再作業", "手套還是新的，沒有破就可以繼續", "脫掉手套直接用手作業，比較好控制"], "a": 0, "r": "手套碰到料車、門把、手機這類非食品接觸面後，外側一樣會汙染產品。戴手套前要洗手，手套破損或碰到非食品物就要更換。"}], [{"k": "points", "h": "人員衛生的基本要求", "i": ["新進人員要先經健康檢查合格才能任用，在職人員每年至少檢查一次。", "不得蓄留指甲、塗指甲油、配戴飾物；進作業區要更衣、洗手、消毒。", "有外傷、手部皮膚病、腹瀉等可能汙染食品的狀況，不得從事接觸食品的工作。"]}, {"k": "diagram", "kind": "flow", "title": "進廠流程", "steps": [["更衣", ""], ["戴髮網口罩", ""], ["洗手", "kw"], ["擦乾", ""], ["消毒", ""], ["滾毛", ""], ["進作業區", ""]], "note": "洗手要包含指縫、指尖、手腕，搓洗至少 20 秒。實際以本廠規定為準。"}], [{"k": "points", "h": "最常被忽略的人", "i": ["訪客、維修人員、送貨人員：同樣要遵守進廠規定。", "主管與資深人員：大家看主管怎麼做。", "趕時間的人：交班、補料時最常跳過洗手。"]}, {"k": "flip", "key": "f-qaR5", "x": "戴手套就不用洗手。", "r": "手套外側一樣會被汙染。戴手套前要洗手，破損或碰到非食品物就要換。"}], [{"k": "fact", "t": "人員健康檢查與衛生要求，是《食品良好衛生規範準則》明文規定的，不只是公司內規。"}, {"k": "take", "t": "稽查最常抓到的缺失，往往不是設備，而是人。"}]], "qa-5-1": [[{"k": "head", "t": "GHP：人員與環境", "g": "能用觀察數據找出最該改善的洗手問題，並處理維修人員進廠。"}, {"k": "story", "who": "衛管", "t": "衛管在更衣室外觀察了一個早上：40 人中只有 26 人完整洗手。10:00 維修師傅趕著修充填機，直接戴著手錶走進充填區，組員也不好意思攔他。"}, {"k": "points", "h": "衛管該怎麼做", "i": ["當場請維修師傅回到更衣室，照進廠流程再進來。", "把觀察結果分類，找出人數最多的問題先改善。", "和維修主管約定：維修人員進廠流程和產線人員一樣，並列入訓練。"]}], [{"k": "table", "t": "進廠洗手觀察紀錄（示意，一個早上）", "head": ["結果", "人數"], "rows": [["完整洗手", "26"], ["時間不足", "9"], ["未洗手", "3"], ["未擦乾", "2"], ["合計", "40"]], "note": "完整洗手率 26 ÷ 40＝65%。"}], [{"k": "tool", "t": "5 分鐘進廠觀察", "i": ["洗手有沒有搓滿時間（至少 20 秒）", "有沒有配戴飾物、指甲過長", "髮網、口罩是否確實", "訪客與維修人員是否照流程"], "script": "「大家早。上週我觀察了一個早上，40 個人有 9 個洗手時間不夠。洗手台上我貼了計時提醒，大家搓到唱完一首生日快樂歌，大約就是 20 秒。維修和訪客也一樣，看到沒照流程的，請直接請他回更衣室，我支持你。」", "back": ["對照本廠的進廠衛生規定，確認觀察項目一致。"]}]], "qa-5-2": [[{"k": "head", "t": "GHP：人員與環境", "g": "能算出改善哪一項才能達標，並判斷有傷口的人員能不能上線。"}, {"k": "adv", "t": "人員衛生的細節", "i": ["健康檢查項目與頻率依《食品良好衛生規範準則》與公司規定。", "洗手台要有清潔劑與擦手設備；設備不足，再多宣導也沒用。", "手套不能取代洗手；手套破損或接觸非食品物後要更換。", "觀察要定期、不預告，結果用比例追蹤趨勢，不點名。"]}], [{"k": "table", "t": "同一份觀察紀錄", "head": ["結果", "人數"], "rows": [["完整洗手", "26"], ["時間不足", "9"], ["未洗手", "3"], ["未擦乾", "2"]], "note": ""}, {"k": "quiz", "key": "q-qaR5a", "star": 2, "q": "目標是完整洗手率 85%。如果只改善一項，改善哪一項才能達成？", "o": ["未洗手", "時間不足", "未擦乾"], "a": 1, "y": "85% × 40＝34 人。只有改善「時間不足」（9 人）能讓合格達 35 人；改善未洗手只到 29 人。未洗手的風險最高，仍要當場糾正。"}], [{"k": "quiz", "key": "q-qaR5b", "star": 2, "q": "充填站組員早上切到手指，已經包紮好，想照常上充填線。最恰當的處理是？", "o": ["包紮好就可以上線", "戴手套就可以上線", "先調到不直接接觸食品的工作，並回報衛管評估"], "a": 2, "y": "依《食品良好衛生規範準則》，有外傷等可能汙染食品的狀況，不得從事與食品接觸的工作。傷口可能帶有金黃色葡萄球菌，手套破損時毒素無法靠加熱破壞。"}, {"k": "reflect", "q": "你們的進廠流程中，哪一步最常被跳過？誰最常跳過？"}]], "qa-6-0": [[{"k": "head", "t": "環境監測與李斯特菌", "g": "能規劃分區採樣點，並說出陽性時的處置順序。"}, {"k": "ben", "me": "能規劃環境監測，是食安專業的進階能力，也是冰品廠稽核的重點。", "co": "及早發現藏匿點，避免汙染進到產品。"}, {"k": "predict", "key": "p-qaR10n", "q": "環境監測連續半年全部陰性，檢視後發現採樣點都在每天清潔的平面。下一步最合理的是？", "o": ["維持現狀：結果穩定代表環境很好", "降低採樣頻率，把人力用在別處", "加入排水溝、設備底部、潮濕死角等難清的點位"], "a": 2, "r": "有效的監測要去「找問題」，選最難清、最潮濕的位置採樣；只採容易清的地方，陰性也不代表安全。"}], [{"k": "points", "h": "為什麼要做環境監測", "i": ["李斯特菌喜歡潮濕、低溫的環境，能在冷藏溫度下生長。", "它會藏在排水孔、輸送帶下方、潮濕死角，形成生物膜。", "環境監測的目的，是在汙染進入產品前就找到它。"]}, {"k": "diagram", "kind": "tree", "title": "環境監測分區", "root": "分區", "kids": [["Zone 1", ["充填頭", "料斗內壁", "接觸面"]], ["Zone 2", ["機台外框", "控制面板", "輸送帶下方"]], ["Zone 3", ["地面", "排水孔", "牆面"]], ["Zone 4", ["走廊", "更衣室", "倉庫"]]]}], [{"k": "points", "h": "陽性時的處置", "i": ["加強清潔消毒，並在原點與周圍擴大採樣。", "往接觸面追查：Zone 1 陽性通常要評估產品。", "連續數次陰性才結案，次數依公司程序。"]}, {"k": "flip", "key": "f-qaR10", "x": "環境監測全部陰性，代表很好。", "r": "長期全陰性，可能是採樣點選得太安全；有效的監測會找到並清除藏匿點。"}], [{"k": "fact", "t": "2015 年美國 Blue Bell 冰淇淋李斯特菌事件後，冰品廠的環境監測更受重視。優格冰依本廠 HACCP 計畫管控，環境與設備的管控是重要防線。"}, {"k": "take", "t": "冷藏冷凍的潮濕環境，正是李斯特菌喜歡的地方。"}]], "qa-6-1": [[{"k": "head", "t": "環境監測與李斯特菌", "g": "能檢討現有的採樣計畫，把採樣點改到「找得到問題」的地方。"}, {"k": "story", "who": "衛管", "t": "衛管整理優格冰充填區過去 3 個月的環境監測：全部陰性。她仔細一看，採樣點都是清潔消毒後的不鏽鋼檯面，排水孔和輸送帶下方從來沒採過。"}, {"k": "points", "h": "衛管該怎麼做", "i": ["畫出充填區平面圖，依 Zone 1–4 重新規劃採樣點。", "加入最難清、最潮濕的位置：排水孔、輸送帶下方、門邊。", "除了清潔後，也在生產進行一段時間後採樣，才看得到藏匿點。"]}], [{"k": "table", "t": "雪坊 9 月：環境監測（示意）", "head": ["項目", "結果"], "rows": [["採樣", "120 點"], ["陽性 1", "優格冰充填區排水孔（Zone 3）"], ["陽性 2", "輸送帶下方（Zone 2）"]], "note": ""}], [{"k": "tool", "t": "陽性處置順序", "i": ["加強清潔消毒", "原點與周圍擴大採樣", "往接觸面追查，評估產品", "連續陰性才結案"], "script": "「各位，這個月排水孔和輸送帶下方驗出陽性。這不代表產品有問題，但代表這兩個地方有菌藏著。這週清潔時，排水孔蓋要拆起來刷，輸送帶下方要用專用刷具，刷完我會再採樣。清排水孔的工具不能拿去碰設備。」", "back": ["確認本廠環境監測計畫的分區與陽性處置程序。"]}]], "qa-6-2": [[{"k": "head", "t": "環境監測與李斯特菌", "g": "能判斷陽性後的下一步，並選對採樣時機。"}, {"k": "adv", "t": "環境監測分區與追蹤", "i": ["Zone 1 陽性最嚴重，通常要評估產品；Zone 3、4 陽性代表環境有藏匿點，要加強清潔並追蹤。", "採樣要「找問題」：選最難清、最潮濕的位置，不是挑最乾淨的地方。", "清潔後採樣是驗證清潔效果；生產中採樣才看得到藏匿點被帶出來。", "陽性後追蹤：在原點與周圍擴大採樣，連續數次陰性才結案。"]}], [{"k": "table", "t": "輸送帶下方陽性後的追蹤採樣", "head": ["位置", "分區", "結果"], "rows": [["輸送帶下方", "Zone 2", "陰性"], ["輸送帶側框", "Zone 2", "陽性"], ["充填頭接觸面", "Zone 1", "尚未採樣"]], "note": ""}, {"k": "quiz", "key": "q-qaR10a", "star": 3, "q": "下一步最優先的是？", "o": ["輸送帶下方已轉陰，可以結案", "立即採樣充填頭等接觸面，並評估受影響產品", "只加強排水孔清潔"], "a": 1, "y": "側框仍是陽性，汙染可能往接觸面擴散；接觸面還沒採樣，就無法排除產品風險。"}], [{"k": "quiz", "key": "q-qaR10b", "star": 2, "q": "為了找出 Zone 2、Zone 3 的藏匿點，什麼時候採樣最有意義？", "o": ["清潔消毒後馬上採樣", "生產進行一段時間後採樣", "只在客戶稽核前採樣"], "a": 1, "y": "清潔消毒後馬上採樣，只能證明清潔有效，菌通常已被暫時壓下；生產進行一段時間後，藏在縫隙裡的菌才會被水氣、震動帶出來，比較找得到問題。"}, {"k": "reflect", "q": "你們的採樣點有包含排水孔與輸送帶下方嗎？是在什麼時候採的？"}]], "qa-7-0": [[{"k": "head", "t": "原料驗收與 COA 判讀", "g": "會逐欄判讀 COA，依四類標準決定原料能不能放行。"}, {"k": "ben", "me": "會讀 COA、懂標準，你的放行判斷就站得住腳。", "co": "不合格原料擋在門外，後面的產品才安全。"}, {"k": "predict", "key": "p-qa7n", "q": "供應商的 COA 寫「合格」，但少了一項我們規格要求的檢驗項目（示意）。最合適的處置是？", "o": ["其他項目都合格，可以放行", "暫不放行，請供應商補件或由本廠抽驗，並記錄", "打電話請供應商口頭確認後放行"], "a": 1, "r": "COA 是供應商的自我聲明；衛管要確認它是這一批、驗了該驗的項目，結果也符合我們的規格。缺的項目不能用口頭確認取代。"}], [{"k": "points", "h": "COA 逐欄怎麼看", "i": ["身分：品名、批號、生產日期，要和這批貨一致。", "內容：檢驗項目、方法、單位、結果、判定標準。", "可信度：檢驗單位（自主或第三方、是否通過認證）、報告日期、簽核。"]}, {"k": "table", "t": "COA 範例（虛構格式）", "head": ["欄位", "內容"], "rows": [["品名／批號", "冷凍草莓／SB-1015"], ["檢驗單位", "第三方實驗室（通過認證）"], ["農藥殘留", "依《農藥殘留容許量標準》判定"], ["微生物", "依規格書項目判定"], ["報告日期", "與到貨批號對應"]], "note": "範例只示意格式，實際項目依本廠原料規格書。"}], [{"k": "points", "h": "四類標準", "i": ["微生物：《食品中微生物衛生標準》。原本的「乳品類衛生標準」已廢止，乳品的微生物項目已整合進這份標準。", "農藥：《農藥殘留容許量標準》，水果原料最重要。", "動物用藥：《動物用藥殘留標準》，生乳要特別注意抗生素殘留。"]}, {"k": "fact", "t": "發酵乳在《食品中微生物衛生標準》中的檢驗項目，包括腸桿菌科、沙門氏菌、單核球增生性李斯特菌與金黃色葡萄球菌腸毒素；乳品的成分規格另有國家標準（CNS）。實際項目與限量以最新公告為準。"}], [{"k": "flip", "key": "f-qa7", "x": "供應商有給檢驗報告，就不用再檢查。", "r": "要核對報告的批號、日期與項目是否和這批貨一致，並定期抽驗，確認報告可信。"}, {"k": "take", "t": "COA 是供應商的承諾，放行是我們的責任。"}, {"k": "srcs", "s": [["衛福部：乳品類衛生標準廢止，整合入食品中微生物衛生標準", "https://mohw.gov.tw/cp-16-61684-1.html"]]}]], "qa-7-1": [[{"k": "head", "t": "原料驗收與 COA 判讀", "g": "發現報告不符時，知道怎麼處理。"}, {"k": "story", "who": "衛管", "t": "一批冷凍草莓到廠，附上的檢驗報告日期是去年，批號也和外箱對不上。倉庫說：「上次也是這家，都沒問題。」"}, {"k": "table", "t": "驗收核對（示意）", "head": ["項目", "外箱", "檢驗報告"], "rows": [["品項", "冷凍草莓", "冷凍草莓"], ["批號", "SB-0915", "SB-0402"], ["報告日期", "—", "去年 4 月"], ["判定", "—", "報告與這批貨不符"]], "note": ""}], [{"k": "diagram", "kind": "flow", "title": "原料放行流程", "steps": [["到貨", ""], ["暫收待驗", ""], ["文件核對 COA", ""], ["現場檢查", ""], ["抽驗或快篩", ""], ["判定", ""], ["合格放行", "clean"]], "note": "未放行前一律留在待驗區，不得投料。"}, {"k": "points", "h": "衛管怎麼處理", "i": ["先暫收並放在待驗區，不投入生產。", "請供應商補這一批的檢驗報告。", "依風險送驗或快篩，結果合格才放行。"]}], [{"k": "tool", "t": "原料放行三關", "i": ["文件關：COA 是這一批、項目齊全、結果合格", "現場關：溫度、效期、外觀、包裝完整", "判定關：簽名放行，貼上「合格」標示才能移到可用區"], "back": ["確認本廠原料規格書要求的 COA 項目，以及放行簽核的權責。"]}]], "qa-7-2": [[{"k": "head", "t": "原料驗收與 COA 判讀", "g": "能用數據比較供應商風險，判斷缺項的 COA。"}, {"k": "adv", "t": "供應商管理", "i": ["供應商評核：看品質紀錄、稽核結果、異常回應速度。", "高風險原料（例如水果、生乳）要提高抽驗頻率。", "同一供應商連續異常時，要啟動矯正要求或更換供應商。"]}], [{"k": "table", "t": "冷凍草莓三家供應商一年紀錄（示意）", "head": ["供應商", "交貨批數", "快篩異常", "報告不符"], "rows": [["A", "48", "0", "1"], ["B", "36", "2", "4"], ["C", "24", "0", "0"]], "note": ""}, {"k": "quiz", "key": "q-qa7a", "star": 2, "q": "哪一家最需要優先要求改善或提高抽驗？", "o": ["A", "B", "C"], "a": 1, "y": "B 的快篩異常率 2 ÷ 36≈5.6%、報告不符率 4 ÷ 36≈11%，都是三家最高。"}], [{"k": "quiz", "key": "q-qa7c", "star": 3, "q": "COA 批號一致、日期在到貨前 3 天，但少了規格書要求的動物用藥項目。怎麼判？", "o": ["少一項沒關係，放行", "暫不放行，請供應商補驗或自行抽驗，結果合格才放行", "退貨並立刻停止往來"], "a": 1, "y": "缺項代表無法證明符合規格，要先補足證據；不必一次就終止合作，但要記錄並追蹤供應商改善。"}, {"k": "quiz", "key": "q-qa7bn", "star": 2, "q": "生乳驗收抗生素快篩呈陽性，司機說牧場剛換藥，下一車就會正常。最正確的處置是？", "o": ["和其他生乳混合稀釋後使用", "這一車拒收或隔離並記錄、通知供應商；後續車次加強檢驗", "這一車退回就好，不必記錄，以免影響供應商評鑑"], "a": 1, "y": "抗生素殘留不能靠稀釋處理，也會影響發酵；要拒收或隔離並留下紀錄。紀錄正是供應商評鑑的依據，不能為了關係省略。"}], [{"k": "reflect", "q": "你們哪一項原料的 COA 最常有問題？是缺項、批號不符，還是日期太舊？"}]], "qa-8-0": [[{"k": "head", "t": "設備校正與量測可信度", "g": "知道為什麼要校正，儀器異常時會評估影響。"}, {"k": "ben", "me": "懂量測可信度，你的判定就有科學依據。", "co": "CCP 與 OPRP 的紀錄真正可信。"}, {"k": "predict", "key": "p-qa8n", "q": "兩支溫度計同時量同一桶熱水，一支顯示 75.0°C、一支 73.5°C（示意）。該相信哪一支？", "o": ["數位顯示、小數點比較多的那一支", "讀數比較低的那一支，判定比較保守", "都還不能確定，要和經過校正的標準溫度計比對"], "a": 2, "r": "量測儀器會漂移；顯示位數多不代表準，挑低的也只是猜。要和標準溫度計比對，才知道誤差多少；沒有校正，紀錄寫得再完整也可能是錯的。"}], [{"k": "points", "h": "為什麼要校正", "i": ["CCP、OPRP 的判定都靠量測；儀器不準，判定就失效。", "校正：和可追溯到國家標準的標準器比對，確認誤差。", "查核：日常用簡單方法確認儀器正常，例如用冰水確認溫度計。"]}, {"k": "points", "h": "雪坊要管的儀器", "i": ["溫度計：殺菌、熱水清洗、冷藏、冷凍。", "秤：秤料與淨重抽檢。", "pH 計、糖度計，以及金屬檢測機的測試片確認。"]}], [{"k": "flip", "key": "f-qa8", "x": "校正標籤還沒過期，儀器就一定準。", "r": "標籤只代表上次校正合格；摔過、修過或讀值異常時，要立即查核或重新校正。"}, {"k": "fact", "t": "pH 計每次使用前，通常要用標準緩衝液校準；電極老化時，讀值會變慢、變不穩。"}, {"k": "take", "t": "量不準的數字比沒有數字更危險，因為它會讓你以為一切正常。"}]], "qa-8-1": [[{"k": "head", "t": "設備校正與量測可信度", "g": "查核發現誤差時，知道怎麼處理。"}, {"k": "story", "who": "衛管", "t": "衛管用冰水查核熱水清洗用的溫度計，讀值是 2.5°C。這支溫度計上週剛記錄過出水「剛好達到下限」。"}, {"k": "table", "t": "冰水查核（示意，冰水點應為 0°C）", "head": ["溫度計", "讀值", "誤差", "判定"], "rows": [["T-01（熱水清洗）", "2.5°C", "+2.5°C", "超出容許誤差"], ["T-02（冷藏庫）", "0.3°C", "+0.3°C", "符合"]], "note": "容許誤差依本廠規定，此處以 ±1°C 示意。"}], [{"k": "points", "h": "衛管怎麼處理", "i": ["停用 T-01，改用合格的溫度計。", "評估影響：讀值偏高 2.5°C，實際出水可能比下限低了約 2.5°C。", "回溯上次查核合格之後的紀錄，評估受影響的產品。"]}, {"k": "tool", "t": "儀器異常三步", "i": ["停用並標示「停用」", "評估：從上次確認正常到現在，量到的數據還可靠嗎？", "重新校正或更換，記錄處理結果"], "back": ["找出本廠的儀器清冊，確認每支儀器的校正週期與到期日。"]}]], "qa-8-2": [[{"k": "head", "t": "設備校正與量測可信度", "g": "能用誤差修正讀值，判斷是否符合標準。"}, {"k": "adv", "t": "校正與查核", "i": ["看校正報告：標準器的追溯性、量測誤差、量測不確定度。", "查核頻率依風險訂定：用在 CCP、OPRP 的儀器頻率要較高。", "儀器清冊：編號、用途、校正週期、到期日、負責人。"]}], [{"k": "table", "t": "熱水清洗紀錄與溫度計誤差", "head": ["項目", "數值"], "rows": [["溫度計讀值偏高", "2.5°C"], ["紀錄上的出水溫度", "剛好等於下限"], ["行動準則", "出水達本廠規定的下限"]], "note": ""}, {"k": "quiz", "key": "q-qa8a", "star": 2, "q": "修正誤差後，實際出水溫度約是多少？是否符合？", "o": ["比下限高 2.5°C，符合", "比下限低 2.5°C，不符合", "剛好等於下限，符合"], "a": 1, "y": "讀值偏高 2.5°C，實際溫度＝讀值 − 2.5°C，所以比下限低了 2.5°C，不符合。選「比下限高」是把誤差方向弄反了。"}], [{"k": "quiz", "key": "q-qa8bn", "star": 1, "q": "下列三項，哪一項最需要優先納入定期校正？", "o": ["包材倉的溫濕度計", "OPRP 熱水清洗確認用的溫度計", "研發試做用的小秤"], "a": 1, "y": "用來判定 CCP、OPRP 的儀器，量測錯誤會直接影響食安判定，要優先納入校正；其他儀器依用途與風險排定。"}], [{"k": "reflect", "q": "你們哪一支儀器最久沒有查核？"}]], "qa-9-0": [[{"k": "head", "t": "偏離處置與損失擴大", "g": "能照四步處置偏離，並算出一次偏離會影響多少產品。"}, {"k": "ben", "me": "偏離處置做得好，你就是現場最可靠的判斷者。", "co": "隔離範圍精準，不多報廢、也不漏放。"}, {"k": "predict", "key": "p-qaR9", "q": "CCP 每 30 分鐘監控一次，發現偏離時，受影響的產品可能是多久生產的？", "o": ["只有發現當下", "至少從上一次確認正常算起", "整天"], "a": 1, "r": "範圍從上一次確認正常開始算；監控間隔越長，受影響的產品越多。"}], [{"k": "points", "h": "偏離時的原則", "i": ["立即停止或隔離，不能為了趕產量關閉檢測或略過管制。", "受影響範圍：從「上一次確認正常」算到「確認恢復」。", "放行要有依據：重新檢驗、科學評估或主管審核，不能憑感覺。"]}, {"k": "diagram", "kind": "flow", "title": "偏離處置四步", "steps": [["控制產品", "kw"], ["矯正原因", ""], ["評估影響", ""], ["紀錄與驗證", ""]], "note": "四步都要留下紀錄，稽核時才證明得了。"}], [{"k": "points", "h": "矯正要找根本原因", "i": ["只把參數調回來，問題下次還會發生。", "問「為什麼」直到找到可以改的地方：設備、方法、人員訓練或監控頻率。", "矯正後要驗證：有沒有再發生？"]}, {"k": "flip", "key": "f-qaR9", "x": "偏離一下子就恢復，產品應該沒問題。", "r": "只要無法證明符合管制界限，就要隔離評估；「應該沒問題」不能作為放行依據。"}], [{"k": "fact", "t": "監控頻率越低，一次異常影響的產品就越多，因為受影響範圍是從上一次確認正常的時間點開始算。連續監控（自動記錄）可以把範圍縮到分鐘。"}, {"k": "take", "t": "異常本身不可怕，可怕的是晚發現、晚隔離。"}]], "qa-9-1": [[{"k": "head", "t": "偏離處置與損失擴大", "g": "能在產線說「已經恢復了」時，堅持正確的隔離範圍。"}, {"k": "story", "who": "衛管", "t": "10:00 優格線殺菌溫度監控低於管制界限，產線調整後 10:20 恢復。組長跟衛管說：「只低了一下，而且已經恢復，10:00 以後的隔離就好了吧？」上一次確認正常是 09:30。"}, {"k": "points", "h": "衛管該怎麼做", "i": ["隔離範圍從 09:30 算到 10:20，不是只從 10:00 開始。", "調閱設備自動紀錄，確認溫度實際是從什麼時間開始偏低，有機會縮小範圍。", "找出原因（例如蒸汽壓力不穩），寫入矯正措施並驗證。"]}], [{"k": "calc", "kind": "loss"}], [{"k": "tool", "t": "偏離處置四步卡", "i": ["控制產品：隔離並標示", "矯正原因：找出為什麼偏離", "評估影響：從上次正常算到確認恢復", "紀錄與主管審核"], "script": "「組長，09:30 是最後一次確認正常，所以 09:30 到 10:20 的產品都要先隔離，大約 750 杯。我現在去調設備的溫度紀錄，如果能證明 09:50 前都正常，範圍就可以縮小。」", "back": ["拿出本廠的矯正措施紀錄表，看四步是否都有欄位。"]}]], "qa-9-2": [[{"k": "head", "t": "偏離處置與損失擴大", "g": "能算出隔離數量，並評估提高監控頻率的效果。"}, {"k": "adv", "t": "偏離處置", "i": ["偏離處置四步：控制產品、矯正原因、評估影響、紀錄與驗證。", "受影響範圍取決於監控頻率；連續監控的產線，範圍可以縮到分鐘。", "監控頻率要考慮：偏離的可能性、每小時產量、一次偏離的損失。", "矯正措施要找根本原因，不只是把參數調回來。"]}], [{"k": "table", "t": "優格線 CCP 偏離（示意）", "head": ["項目", "數值"], "rows": [["實際產出速度", "900 杯/h"], ["監控頻率", "每 30 分鐘"], ["上一次正常", "09:30"], ["發現偏離", "10:00"], ["確認恢復", "10:20"]], "note": ""}, {"k": "quiz", "key": "q-qaR9a", "star": 2, "q": "需要隔離評估的產品約有幾杯？", "o": ["300 杯", "750 杯", "900 杯"], "a": 1, "y": "從 09:30 算到 10:20，共 50 分鐘，900 × 50 ÷ 60＝750 杯。只算 10:00 之後（300 杯）會低估。"}], [{"k": "quiz", "key": "q-qaR9b", "star": 3, "q": "不算恢復時間，在最壞情況下（剛確認正常就開始偏離），監控頻率從每 30 分鐘改成每 15 分鐘，一次偏離要評估的產品會從多少杯變成多少杯？", "o": ["450 杯 → 225 杯", "900 杯 → 450 杯", "300 杯 → 150 杯"], "a": 0, "y": "每 30 分鐘：900 × 30 ÷ 60＝450 杯；每 15 分鐘：900 × 15 ÷ 60＝225 杯。監控頻率加倍，最壞情況的損失減半；要和增加的監控人力一起評估。"}, {"k": "reflect", "q": "你們的 CCP 監控頻率下，一次異常最多會影響多少產品？"}]], "qa-10-0": [[{"k": "head", "t": "GHP：清潔、病媒、用水", "g": "能分辨目視、ATP、微生物檢測各自的用途，並判讀結果。"}, {"k": "ben", "me": "會判讀清潔數據，你提出的要求會更有依據，產線也更服氣。", "co": "清潔確實，環境汙染與客訴風險降低。"}, {"k": "predict", "key": "p-qaR6n", "q": "清潔後 ATP 檢測全部合格，但上週同一台設備的環境監測驗出李斯特菌屬（示意）。最合理的判斷是？", "o": ["ATP 只反映有機物殘留，不能排除李斯特菌；那個點要加強清潔並複驗", "ATP 合格代表已清乾淨，李斯特菌也一起清掉了", "把 ATP 的合格標準改嚴一點就夠了"], "a": 0, "r": "ATP 判斷清潔程度，不能判斷有沒有特定病原菌，標準再嚴也一樣。兩種檢測各有用途，驗出李斯特菌屬要針對點位追蹤。"}], [{"k": "points", "h": "清潔的程序", "i": ["前沖洗 → 清潔劑 → 沖洗 → 消毒，每一步都有目的。", "先清潔去除汙垢，消毒才有效；汙垢會保護細菌。", "清潔後要有確認方式，不能只靠「看起來乾淨」。"]}, {"k": "diagram", "kind": "tree", "title": "三種清潔確認方式", "root": "清潔確認", "kids": [["目視", ["看得見的殘留", "每次都做"]], ["ATP", ["有機物殘留", "幾分鐘出結果"]], ["微生物", ["特定菌", "需要數天"]]]}], [{"k": "points", "h": "病媒與用水", "i": ["病媒防治要監測並記錄，看趨勢：同一點連續上升，比單次高值更值得追查。", "用水要符合飲用水水質標準並定期檢驗、保存報告。", "水塔與儲水槽要定期清洗，避免成為汙染源。"]}, {"k": "flip", "key": "f-qaR6", "x": "消毒劑濃一點，清潔就可以省略。", "r": "汙垢會保護細菌並降低消毒效果；沒有先清潔，消毒效果會大打折扣。"}], [{"k": "fact", "t": "ATP 檢測的結果用 RLU（相對光單位）表示，數字越高代表殘留越多；合格標準要依設備與表面自訂並驗證，不同廠牌的數值不能直接比較。"}, {"k": "take", "t": "「看起來乾淨」不等於「真的乾淨」。"}]], "qa-10-1": [[{"k": "head", "t": "GHP：清潔、病媒、用水", "g": "能在 ATP 不合格時堅持重洗，並說服產線。"}, {"k": "story", "who": "衛管", "t": "早上 7:50，優格冰充填機的 ATP 抽測結果出來，料斗內壁 310 RLU，超過 150 的標準。產線組長說：「其他三點都合格，平均也差不多 150，8:00 就要開線了。」"}, {"k": "points", "h": "衛管該怎麼做", "i": ["逐點判定：料斗不合格，就不能開機，不用平均值掩蓋單點問題。", "請產線重新清潔料斗，再測一次，合格後簽名記錄。", "事後追查：料斗為什麼沒洗乾淨？是清潔步驟、工具還是時間不足？"]}], [{"k": "table", "t": "優格冰充填機 ATP 抽測（示意，合格 ≤ 150 RLU）", "head": ["位置", "RLU"], "rows": [["充填頭", "80"], ["輸送帶", "120"], ["料斗內壁", "310"], ["封蓋模具", "95"]], "note": ""}], [{"k": "tool", "t": "清潔確認判讀", "i": ["逐點判定，不用平均值", "不合格就重新清潔再測", "記錄位置與數值，看趨勢", "同一點反覆不合格，檢討清潔方法"], "script": "「組長，料斗 310，重洗大概 15 分鐘。料斗的殘留會直接進到產品裡，我們不能賭。重洗後我馬上再測，合格就開線，延後的時間我會跟生管說明。」", "back": ["確認本廠 ATP 的合格標準與抽測頻率。"]}]], "qa-10-2": [[{"k": "head", "t": "GHP：清潔、病媒、用水", "g": "能正確判定 ATP 結果，並從病媒趨勢找出要追查的點。"}, {"k": "adv", "t": "清潔確認的判讀", "i": ["ATP 合格標準要依設備與表面自訂並驗證。", "清潔與消毒是兩件事：先清潔去除汙垢，消毒才有效。", "病媒監測看趨勢：同一點連續上升，比單次高值更值得追查；要找來源，不只是加藥。", "用水要定期檢驗並保存報告；水塔與儲水槽要定期清洗。"]}], [{"k": "table", "t": "同一次抽測與重測", "head": ["位置", "第一次", "重新清潔後"], "rows": [["充填頭", "80", "—"], ["輸送帶", "120", "—"], ["料斗內壁", "310", "140"], ["封蓋模具", "95", "—"]], "note": ""}, {"k": "quiz", "key": "q-qaR6a", "star": 2, "q": "正確的判定是？", "o": ["料斗第一次不合格，重新清潔、重測合格後才可開機", "四點平均約 151，整台不合格", "只有一點不合格，可以直接開機"], "a": 0, "y": "ATP 要逐點判定。料斗 310 超過 150，重新清潔後 140 合格才能開機。用平均值會掩蓋單點問題。"}], [{"k": "table", "t": "捕蟲燈每週捕獲數（示意）", "head": ["位置", "W1", "W2", "W3", "W4"], "rows": [["倉庫門口", "8", "7", "9", "8"], ["果醬線入口", "2", "3", "6", "11"], ["優格充填區", "1", "0", "1", "1"]], "note": ""}, {"k": "quiz", "key": "q-qaR6b", "star": 3, "q": "哪一個位置最需要優先追查？", "o": ["倉庫門口，因為數量最多", "果醬線入口，因為連續上升", "優格充填區，因為最靠近產品"], "a": 1, "y": "倉庫門口數量高但穩定，代表一直是這個水準；果醬線入口從 2 升到 11，四週增加超過 5 倍，可能有新的入侵途徑，例如門縫破損或附近有孳生源，要先追查來源。"}, {"k": "reflect", "q": "你們的清潔確認是用目視還是 ATP？結果有被拿來分析趨勢嗎？"}]], "qa-11-0": [[{"k": "head", "t": "添加物、標示與效期", "g": "會查添加物的使用範圍、限量，算對用量，並確認標示方式。"}, {"k": "ben", "me": "熟悉法規查詢，你就是公司的法規把關者。", "co": "產品合規，避免違規下架與罰鍰。"}, {"k": "predict", "key": "p-qaR11n", "q": "供應商推薦一款「天然萃取」色素，說不是化學合成、不用管添加物規定。衛管該怎麼判斷？", "o": ["天然來源就不算食品添加物，可以直接使用", "先確認它是否屬於食品添加物；屬於的話，就要符合使用範圍與限量規定", "請供應商提供「天然來源證明」就可以使用"], "a": 1, "r": "是否受規範看它是不是食品添加物，和來源是否天然無關；天然證明不能取代法規判定。"}], [{"k": "points", "h": "添加物三件事", "i": ["品項：台灣食品添加物分為 17 類，例如防腐劑、著色劑、香料、黏稠劑。", "範圍與限量：每一品項都規定了可以用在哪類食品、最多用多少。", "標示：用品名或通用名稱；防腐劑、抗氧化劑、甜味劑還要同時標示功能性名稱。"]}, {"k": "diagram", "kind": "flow", "title": "查詢添加物的步驟", "steps": [["品項准用？", ""], ["可用在這類食品？", ""], ["限量換算", "kw"], ["標示方式", ""], ["保存紀錄", ""]], "note": "依據：衛福部《食品添加物使用範圍及限量暨規格標準》。"}], [{"k": "points", "h": "標示與效期", "i": ["包裝食品的品名、內容物、淨重、廠商資訊、有效日期、過敏原等，依《食品安全衛生管理法》第 22 條與相關規定標示。", "有效日期要依保存試驗結果設定；配方、包材或製程改變時要重新評估。", "效期噴印要清楚、不易脫落；換批、換日時一定要做首件確認。"]}, {"k": "flip", "key": "f-qaR11", "x": "天然來源的添加物，不用管限量。", "r": "只要屬於食品添加物，就要符合使用範圍與限量，跟來源是否天然無關。"}], [{"k": "fact", "t": "果醬凝膠靠的果膠，在法規中屬於「黏稠劑（糊料）」類。"}, {"k": "take", "t": "「別家都這樣用」不是依據，法規原文才是。"}]], "qa-11-1": [[{"k": "head", "t": "添加物、標示與效期", "g": "能在換供應商或換原料時，完成添加物與標示的確認。"}, {"k": "story", "who": "衛管", "t": "研發想把果醬的色素換成一款「天然萃取色素」，供應商說：「天然的不用管限量，也不用改標示。」研發已經準備好試產。"}, {"k": "points", "h": "衛管該怎麼做", "i": ["先確認它在法規上是不是食品添加物、屬於哪一類。", "查使用範圍與限量，換算成每批投料量。", "確認標示方式；有改內容物，就要更新標籤，並保存查詢紀錄與供應商規格書。"]}], [{"k": "table", "t": "限量換算範例（示意，限量 1.0 g/kg）", "head": ["項目", "數值"], "rows": [["一批成品", "500 kg"], ["最多可用", "500 g"], ["實際投料", "450 g"], ["換算", "0.9 g/kg，合格"]], "note": "限量以成品重量計算；換算成每批投料量來管制。"}], [{"k": "tool", "t": "添加物與標示三查", "i": ["品項准用嗎？可以用在這類食品嗎？", "用量換算成 g/kg，有沒有超過限量？", "標示有沒有同時寫功能性名稱與品名？", "換供應商時，規格書有沒有重新確認？"], "script": "「謝謝您提供資料。不管來源是不是天然，只要屬於食品添加物，就要符合使用範圍與限量。麻煩提供這款色素的品名、規格書與建議用量，我們確認合規後才能試產。」", "back": ["抽一個本廠產品，對照法規確認添加物與標示。"]}]], "qa-11-2": [[{"k": "head", "t": "添加物、標示與效期", "g": "能換算單方與複方添加物的用量，判斷是否超標。"}, {"k": "adv", "t": "添加物限量換算", "i": ["限量單位常是 g/kg，以成品重量計算。", "複方添加物要拆解成分，逐一確認每一個品項的限量。", "內容物依含量由高到低標示；防腐劑等需同時標示功能性名稱。", "法規會修正，要定期對照最新版本，並保存查詢日期。"]}], [{"k": "table", "t": "某添加物（示意，限量 0.5 g/kg）", "head": ["項目", "數值"], "rows": [["一批果醬成品", "800 kg"], ["配方投料", "450 g"]], "note": ""}, {"k": "quiz", "key": "q-qaR11a", "star": 2, "q": "這批是否超標？", "o": ["合格，450 g 小於 500 g", "超標，約 0.56 g/kg", "合格，約 0.45 g/kg"], "a": 1, "y": "450 g ÷ 800 kg≈0.56 g/kg，超過 0.5。另外兩個選項都是誤用 1,000 kg 計算。"}], [{"k": "table", "t": "複方添加物（示意）", "head": ["項目", "數值"], "rows": [["複方中某防腐劑含量", "10%"], ["每批複方投料", "4 kg"], ["每批成品", "600 kg"], ["該防腐劑限量", "0.5 g/kg"]], "note": ""}, {"k": "quiz", "key": "q-qaR11b", "star": 3, "q": "這批成品的防腐劑含量約多少？是否超標？", "o": ["約 0.67 g/kg，超標", "約 6.7 g/kg，超標", "複方不用逐項計算，合格"], "a": 0, "y": "防腐劑＝4 kg × 10%＝400 g；400 g ÷ 600 kg≈0.67 g/kg，超過 0.5。6.7 g/kg 是忘了乘 10%；複方一定要拆解成分逐項計算。"}, {"k": "reflect", "q": "你們現有產品的添加物清單，最近一次對照法規是什麼時候？"}]], "qa-12-0": [[{"k": "head", "t": "過敏原管理", "g": "能說出 11 類過敏原，並設計共線的排程、清線與標籤核對。"}, {"k": "ben", "me": "過敏原管理是客戶稽核的重點，做好就是你的實績。", "co": "保護過敏的消費者，也保護品牌，避免回收。"}, {"k": "predict", "key": "p-qaR12", "q": "台灣包裝食品必須標示的過敏原中，有一項是很多國家沒有的，是哪一項？", "o": ["花生", "芒果", "牛奶"], "a": 1, "r": "芒果在台灣的過敏原標示範圍內，這點和許多國家不同。"}], [{"k": "points", "h": "台灣須標示的 11 類", "i": ["甲殼類、芒果、花生、牛奶羊奶、蛋、堅果類。", "芝麻、含麩質穀物、大豆、魚類。", "使用亞硫酸鹽類等，終產品殘留濃度每公斤 10 毫克以上。"]}, {"k": "diagram", "kind": "flow", "title": "過敏原管理五環節", "steps": [["原料驗收", ""], ["儲存隔離", ""], ["排程順序", ""], ["清線確認", "kw"], ["標籤核對", ""]], "note": "任何一環斷掉，過敏原就可能進到不該有的產品。"}], [{"k": "points", "h": "共線生產的原則", "i": ["排程：不含過敏原的先做，含過敏原的後做。", "清線：拆洗難清的部位，再用目視與快篩確認。", "標籤：首件核對過敏原標示，是最後一道防線。"]}, {"k": "flip", "key": "f-qaR12", "x": "有清洗，就不會殘留過敏原。", "r": "清洗程序要經過驗證，並在換線後確認；否則難清的部位仍可能殘留。"}], [{"k": "fact", "t": "芒果在台灣的過敏原標示範圍內，這點和許多國家不同；出口產品要另外對照輸入國的規定。"}, {"k": "take", "t": "優格和優格冰本身就含過敏原：牛奶。"}]], "qa-12-1": [[{"k": "head", "t": "過敏原管理", "g": "能在業務要求調整順序時，守住過敏原排程原則。"}, {"k": "story", "who": "衛管", "t": "週一業務急著要花生口味優格冰，希望一開線就先做，接著做原味和草莓。生管問衛管：「花生做完徹底清洗就好了吧？」"}, {"k": "points", "h": "衛管該怎麼做", "i": ["說明花生排第一，後面每換一次線都要做過敏原清線與確認，風險和成本都增加。", "提出替代方案：前一天收工前做花生，或當天最後做。", "若一定要先做，清線後必須快篩確認陰性才能做下一個口味。"]}], [{"k": "table", "t": "某天要生產的三種優格冰", "head": ["口味", "過敏原"], "rows": [["原味", "牛奶"], ["草莓", "牛奶"], ["花生", "牛奶、花生"]], "note": ""}], [{"k": "tool", "t": "換線過敏原檢查", "i": ["排程：無過敏原先、有過敏原後", "清線：拆洗難清部位，目視確認", "快篩：方法事先驗證，陰性才開線", "首件：核對過敏原標示"], "script": "「花生排第一的話，後面原味和草莓都可能殘留花生，對花生過敏的人可能有嚴重反應。我建議花生排在今天最後做，或明天第一批前我們先完成清線快篩。這樣出貨時間只差半天，您看可以嗎？」", "back": ["確認本廠過敏原清線的確認方式與紀錄。"]}]], "qa-12-2": [[{"k": "head", "t": "過敏原管理", "g": "能排出正確的生產順序，並判斷清線快篩的結果。"}, {"k": "adv", "t": "過敏原管理五環節", "i": ["原料驗收：確認原料規格書中的過敏原，換供應商或配方時要重新確認。", "儲存隔離：含過敏原原料分區存放、標示清楚，放在下層避免掉落。", "清線確認可以用目視加上過敏原快篩；方法要事先驗證。", "共線產品若無法完全排除交叉接觸，是否加註警語要依法規與公司政策決定。"]}], [{"k": "table", "t": "同一份口味清單", "head": ["口味", "過敏原"], "rows": [["原味", "牛奶"], ["草莓", "牛奶"], ["花生", "牛奶、花生"]], "note": ""}, {"k": "quiz", "key": "q-qaR12a", "star": 1, "q": "最合適的生產順序是？", "o": ["花生 → 原味 → 草莓", "原味 → 草莓 → 花生", "草莓 → 花生 → 原味"], "a": 1, "y": "過敏原較少的先做，含花生的放最後，只需要在最後收工時完整清線。花生排在前面或中間，都要多一次過敏原清線與確認。"}], [{"k": "quiz", "key": "q-qaR12b", "star": 3, "q": "花生口味做完後清線，花生快篩結果仍是陽性，但原味已經排定 10 分鐘後開線。最恰當的做法是？", "o": ["快篩只是參考，照原定時間開線", "重新清潔難清部位再快篩，陰性才開線，並記錄延誤原因", "開線後把原味標上「可能含花生」"], "a": 1, "y": "快篩陽性代表清線沒有達到效果，必須重新清潔再確認。臨時加註警語不能取代清線，也會讓原味產品失去對過敏者的價值。"}, {"k": "reflect", "q": "你們換線時，由誰確認過敏原清線與標籤版本？"}]], "qa-13-0": [[{"k": "head", "t": "非登不可、非追不可與模擬回收", "g": "說得出登錄與追溯的意義，會主導模擬回收。"}, {"k": "ben", "me": "熟悉登錄與追溯，你就能在食安事件時穩住局面。", "co": "依法營業，出事時能快速、精準地處理。"}, {"k": "predict", "key": "p-qa13n", "q": "工廠要新增一個產品類別。下列哪一件事是法規要求、而不是自願的？", "o": ["取得 ISO 22000 驗證", "確認食品業者登錄資料是否需要變更", "加入產業公會"], "a": 1, "r": "依《食品安全衛生管理法》第 8 條，公告類別與規模的食品業者要完成登錄才可以營業，登錄內容變動也要依規定辦理；ISO 是自願性驗證。實際作業依主管機關公告。"}], [{"k": "points", "h": "非登不可：食品業者登錄", "i": ["依食安法第 8 條，公告類別與規模的業者要完成登錄才能營業。", "登錄後要定期申報確認登錄內容，期間依《食品業者登錄辦法》最新規定。", "登錄資料不實，依食安法第 47 條可處新臺幣 3 萬元以上 300 萬元以下罰鍰。"]}, {"k": "points", "h": "非追不可：追溯追蹤", "i": ["依食安法第 9 條，公告類別與規模的業者要建立追溯追蹤制度。", "部分業者要以電子方式申報到「非追不可」系統。", "本廠適用的範圍與申報項目，請依衛福部最新公告確認。"]}], [{"k": "flip", "key": "f-qa13", "x": "登錄一次就好，之後不用再管。", "r": "地址、產品、負責人等有變動要更新，也要定期申報確認登錄內容。"}, {"k": "take", "t": "登錄讓主管機關找得到你；追溯讓你找得到你的產品。"}, {"k": "srcs", "s": [["食力：食品業者登錄與罰則", "https://www.foodnext.net/news/newsnow/paper/5975405533"], ["衛福部：食品追溯追蹤公告說明", "https://www.mohw.gov.tw/cp-2632-14660-1.html"]]}]], "qa-13-1": [[{"k": "head", "t": "非登不可、非追不可與模擬回收", "g": "會規劃並計時一次模擬回收。"}, {"k": "story", "who": "衛管", "t": "主管機關來電，說某批果醬原料有疑慮，要求兩小時內提供用了這批原料的產品與出貨對象。"}, {"k": "table", "t": "追溯結果（示意）", "head": ["成品批號", "用量", "已出貨", "庫存"], "rows": [["JM0915A", "原料 R-07 共 600 kg", "5,000 瓶", "1,000 瓶"], ["JM0916B", "原料 R-07 共 300 kg", "1,000 瓶", "2,000 瓶"]], "note": ""}], [{"k": "points", "h": "模擬回收怎麼演練", "i": ["隨機選一個成品批號，開始計時。", "往前追：投料批號與供應商；往後追：出貨客戶與數量。", "記錄每一段花的時間與卡關的地方，演練後做改善。"]}, {"k": "tool", "t": "模擬回收計時表", "i": ["成品批號 → 工單（○分鐘）", "工單 → 原料批號與供應商（○分鐘）", "成品 → 出貨客戶與數量（○分鐘）", "卡關原因與改善"], "back": ["確認本廠的追溯與回收程序，以及上次演練花了多久。"]}]], "qa-13-2": [[{"k": "head", "t": "非登不可、非追不可與模擬回收", "g": "能從追溯資料算出回收與隔離的範圍。"}, {"k": "adv", "t": "回收分級與演練檢討", "i": ["回收依風險分級，處理時限不同，依主管機關規定辦理。", "演練結果要做矯正：例如紀錄分散，就整合到同一份表單。", "申報的追溯資料要和實際出貨一致，否則追溯時會對不上。"]}], [{"k": "table", "t": "同一份追溯結果", "head": ["成品批號", "已出貨", "庫存"], "rows": [["JM0915A", "5,000 瓶", "1,000 瓶"], ["JM0916B", "1,000 瓶", "2,000 瓶"]], "note": ""}, {"k": "quiz", "key": "q-qa13a", "star": 2, "q": "需要通知客戶回收的瓶數，以及要直接隔離的庫存，各是多少？", "o": ["回收 6,000 瓶、隔離 3,000 瓶", "回收 9,000 瓶、隔離 0 瓶", "回收 5,000 瓶、隔離 1,000 瓶"], "a": 0, "y": "已出貨 5,000＋1,000＝6,000 瓶要追回；庫存 1,000＋2,000＝3,000 瓶直接隔離。只算一批會漏掉 JM0916B。"}], [{"k": "quiz", "key": "q-qa13b", "star": 1, "q": "登錄資料不實，依食安法第 47 條的罰鍰範圍是？", "o": ["3 千至 3 萬元", "3 萬至 300 萬元", "300 萬至 3,000 萬元"], "a": 1, "y": "依食安法第 47 條，可處新臺幣 3 萬元以上 300 萬元以下罰鍰；實際以最新條文為準。"}], [{"k": "reflect", "q": "如果明天就要做模擬回收，你覺得哪一段最容易卡住？"}]], "qa-14-0": [[{"k": "head", "t": "成品檢驗、放行與留樣", "g": "知道成品放行要看什麼，會用留樣協助判斷客訴。"}, {"k": "ben", "me": "守住放行，你就是工廠最後一道把關的人。", "co": "不合格品不出廠，客戶與品牌都受到保護。"}, {"k": "predict", "key": "p-qa14n", "q": "客戶明天一早要貨，這批優格的檢驗結果下午才出來，外觀與感官都正常。衛管最合適的回應是？", "o": ["結果出來、確認合格才放行；同時和業務確認能否先出前一批已放行的庫存", "感官正常就先出貨，報告出來再補", "請客戶簽切結書後先出貨"], "a": 0, "r": "確認合格才出貨，叫做「正向放行」。先出貨再補驗，一旦結果不合格，就得從客戶手上追回來；切結書不能免除工廠的責任。"}], [{"k": "points", "h": "成品放行要看什麼", "i": ["製程紀錄：CCP、OPRP 紀錄完整，沒有未處理的偏離。", "檢驗結果：微生物、pH、感官、重量、標示與效期。", "放行簽核：由授權人員判定並簽名，貼上放行標示。"]}, {"k": "diagram", "kind": "flow", "title": "成品放行流程", "steps": [["生產完成", ""], ["待驗區", ""], ["紀錄審查", ""], ["檢驗", ""], ["判定", ""], ["放行", "clean"], ["出貨", ""]], "note": "未放行的成品一律留在待驗區。"}], [{"k": "points", "h": "留樣制度", "i": ["每批成品保留樣品，存放條件和市售相同，例如冷藏、冷凍。", "保存到產品有效日期之後一段時間，期間依本廠規定。", "客訴時用留樣比對：是產品本身的問題，還是出廠後的運輸或保存造成。"]}, {"k": "flip", "key": "f-qa14", "x": "檢驗只是抽樣，所以紀錄沒那麼重要。", "r": "抽樣只能代表一部分；紀錄證明整批都在管制中，兩者缺一不可。"}], [{"k": "fact", "t": "微生物檢驗常需要數天才有結果，所以優格的出貨時程要把放行時間排進去；這也是生管和衛管要一起排程的原因。"}, {"k": "take", "t": "沒有放行，就沒有出貨。"}]], "qa-14-1": [[{"k": "head", "t": "成品檢驗、放行與留樣", "g": "遇到「先出貨」的壓力時，知道怎麼回應。"}, {"k": "story", "who": "衛管", "t": "業務來電：客戶急著要這批優格，但微生物檢驗結果明天才出來，能不能先出？"}, {"k": "table", "t": "這批優格的放行狀態（示意）", "head": ["項目", "狀態"], "rows": [["CCP 紀錄", "完整，無偏離"], ["pH 與感官", "符合"], ["重量與標示", "符合"], ["微生物檢驗", "明天出結果"], ["判定", "待驗，不得出貨"]], "note": ""}], [{"k": "points", "h": "衛管怎麼回覆", "i": ["說明原因：微生物結果還沒出來，無法證明安全。", "提供選項：先出上一批已放行的庫存，或和客戶協調延後一天。", "把放行所需時間回饋給生管，下次排程預留。"]}, {"k": "tool", "t": "成品放行三查", "i": ["紀錄查：CCP、OPRP 有沒有空白或未處理的偏離", "檢驗查：該驗的項目都出結果且合格了嗎", "標示查：效期、批號、過敏原是否正確"], "back": ["確認本廠成品放行的權責人員與簽核方式，以及留樣的保存期間。"]}]], "qa-14-2": [[{"k": "head", "t": "成品檢驗、放行與留樣", "g": "能用留樣與數據判讀問題出在哪一段。"}, {"k": "adv", "t": "放行與科學化判讀", "i": ["正向放行：確認合格才放行，是食品安全管理系統的基本要求。", "判讀檢驗報告先看方法、單位、檢出限量與判定標準，再看數字。", "相關不等於因果：要有對照或重複驗證，才能確認原因。"]}], [{"k": "table", "t": "同一份數據", "head": ["運輸時間", "批次", "到貨 pH"], "rows": [["2–3 小時", "1、3、5", "4.40–4.45"], ["6–7 小時", "2、4、6", "4.18–4.22"]], "note": ""}, {"k": "quiz", "key": "q-qa14a", "star": 3, "q": "哪一個結論最合理？", "o": ["天氣熱造成優格變酸", "運輸時間長的批次 pH 較低，下一步應查運輸溫度紀錄", "發酵終點設定錯誤"], "a": 1, "y": "數據顯示運輸時間和 pH 有關，但這只是相關，還不是原因。下一步要查運輸溫度確認。天氣與發酵終點在數據中都看不出來。"}], [{"k": "quiz", "key": "q-qa14bn", "star": 2, "q": "客戶反映優格冰有異味，同批留樣風味正常，客戶的冷凍櫃上週曾故障。最合理的下一步是？", "o": ["查出貨後的冷鏈紀錄與客戶保存狀況，再回覆客戶處理方式", "整批回收，避免事情擴大", "留樣正常，直接回覆客戶產品沒有問題"], "a": 0, "y": "留樣和出貨品是同一批、在正確條件下保存；留樣正常，代表問題較可能在出廠之後。但仍要查冷鏈紀錄確認，不能只靠留樣就結案。"}], [{"k": "reflect", "q": "你們的成品放行，最常卡在哪一個環節？"}]], "qa-15-0": [[{"k": "head", "t": "稽查、不符合事項與客訴", "g": "能事先找出稽查最常被抓到的缺失，並寫出有根本原因的回覆。"}, {"k": "ben", "me": "能帶領團隊通過稽查，是衛管最被看見的成果。", "co": "稽核順利，客戶與主管機關更信任，訂單也更穩。"}, {"k": "predict", "key": "p-qaR15n", "q": "稽查前一天，發現上週一張 CCP 紀錄漏簽，當班人員說他記得當時溫度都正常。最好的做法是？", "o": ["請當班人員依記憶補簽，日期寫當天", "保留原狀，寫偏差說明與矯正措施，並評估該時段的產品", "把那張表重新整理抄寫一份"], "a": 1, "r": "事後補簽或重抄都等於造假。保留原狀、誠實說明、做矯正並評估產品，才是稽核員想看到的。"}], [{"k": "points", "h": "稽查最常抓到的缺失", "i": ["紀錄：漏填、事後補填、塗改未簽名、紀錄與實際不符；CCP 偏離後沒有矯正紀錄。", "人員：配戴飾物、指甲過長、口罩沒蓋住口鼻、未洗手。", "環境、文件與儀器：離牆離地不足、積水、現場 SOP 不是核准版本、校正過期。"]}, {"k": "diagram", "kind": "tree", "title": "不符合事項回覆四要素", "root": "回覆", "kids": [["根本原因", ["為什麼發生"]], ["矯正措施", ["這次怎麼處理"]], ["預防措施", ["怎麼不再發生"]], ["完成期限", ["誰、何時"]]]}], [{"k": "points", "h": "稽查的重點：說、寫、做一致", "i": ["SOP 怎麼寫、紀錄怎麼記、現場怎麼做，三者要一致。", "紀錄寫錯時劃線更正並簽名、註明日期；不可塗改或撕頁。", "平時的內部稽核，就是外部稽核最好的預演。"]}, {"k": "flip", "key": "f-qaR15", "x": "稽查前把紀錄補齊就好。", "r": "事後補填是嚴重缺失。紀錄要即時填寫；缺漏要誠實說明，並做矯正。"}], [{"k": "fact", "t": "不符合事項通常分級（例如主要、次要），依對食品安全與系統的影響判定；同一類缺失反覆出現，可能被升級。"}, {"k": "take", "t": "稽查員看的，不是你說了什麼，而是紀錄寫了什麼、現場做了什麼。"}]], "qa-15-1": [[{"k": "head", "t": "稽查、不符合事項與客訴", "g": "能用上次內稽的缺失，排出這次稽查前的檢查重點。"}, {"k": "story", "who": "衛管", "t": "客戶稽核前一天，衛管抽查紀錄，發現上週二的殺菌紀錄有一格沒簽名。組長說：「那天是我值班，我記得溫度都正常，我現在補簽就好。」"}, {"k": "points", "h": "衛管該怎麼做", "i": ["不補簽：補簽等於證明一件當時沒有確認的事。", "調閱設備自動紀錄，評估那段時間的產品，寫成矯正措施。", "稽核時主動說明：發現了什麼、怎麼處理、怎麼預防。"]}], [{"k": "table", "t": "上次內稽缺失分類（示意）", "head": ["類別", "件數"], "rows": [["紀錄", "7"], ["人員衛生", "4"], ["環境", "3"], ["文件版本", "2"], ["儀器校正", "2"], ["合計", "18"]], "note": "紀錄類占約 39%，是這次稽查前最該先檢查的。"}], [{"k": "tool", "t": "稽查前 10 分鐘自檢", "i": ["CCP／OPRP 紀錄有沒有空白", "儀器校正標籤有沒有過期", "現場 SOP 是不是最新版", "人員衛生與環境"], "script": "「稽核員您好，我們在稽核前自主檢查時，發現上週二殺菌紀錄有一格漏簽。我們已調閱設備自動紀錄，確認當時溫度符合管制界限，並把簽名欄移到記錄時一定會經過的位置，這是矯正紀錄。」", "back": ["對照本廠上次稽核的缺失，優先檢查同類問題。"]}]], "qa-15-2": [[{"k": "head", "t": "稽查、不符合事項與客訴", "g": "能找出缺失的根本原因，並掌握客訴與食品防護的做法。"}, {"k": "adv", "t": "不符合事項與客訴", "i": ["回覆不符合事項要寫：根本原因、矯正措施、預防措施、完成期限。", "「人員疏忽」不是根本原因；要再問為什麼會疏忽：表單、流程、訓練還是時間不夠。", "客訴處理：收件記錄 → 保留樣品 → 調查同批次 → 找原因 → 矯正預防 → 回覆客戶。", "客訴樣品與調查紀錄都要保存，作為改善依據。"]}, {"k": "extra", "t": "補充：食品防護與食品詐欺", "i": ["食品防護（food defense）：防止有人蓄意破壞或汙染，例如門禁管理、原料與化學品上鎖、可疑行為通報。", "食品詐欺（food fraud）：防止原料被摻假或以次充好，例如評估哪些原料容易被摻假，提高高風險原料的檢驗。", "FSSC 22000 要求針對這兩項做弱點評估，並訂出防範措施。"]}], [{"k": "table", "t": "紀錄類 7 件的明細", "head": ["表單", "漏填件數"], "rows": [["充填重量紀錄", "5"], ["殺菌紀錄", "1"], ["清潔紀錄", "1"]], "note": ""}, {"k": "quiz", "key": "q-qaR15an", "star": 2, "q": "最有效的改善是？", "o": ["每天開工前由衛管再提醒一次", "在月會公布漏填名單", "檢討充填重量紀錄的設計與填寫時機，簡化欄位並放在作業位置旁"], "a": 2, "y": "同一張表反覆漏填，代表表單或流程有問題。只靠提醒或公布名單，很難根本改善。"}], [{"k": "quiz", "key": "q-qaR15b", "star": 3, "q": "回覆「充填重量紀錄漏填」的不符合事項時，哪一個最像真正的根本原因？", "o": ["人員疏忽", "紀錄表放在離秤 5 公尺的辦公桌，作業中無法即時填寫", "已口頭提醒相關人員"], "a": 1, "y": "「人員疏忽」只描述了結果；「已口頭提醒」是矯正措施，不是原因。表單位置讓人無法即時填寫，才是可以改、改了就不容易再發生的根本原因。"}, {"k": "reflect", "q": "你們最近一次稽查，最多的缺失是哪一類？根本原因找到了嗎？"}]], "qa-16-0": [[{"k": "head", "t": "教育訓練與跨部門溝通", "g": "會設計 15 分鐘的教育訓練，並讓產線願意配合。"}, {"k": "ben", "me": "會教、會溝通的衛管，最容易升任管理職。", "co": "食安要求真正落實在每一班。"}, {"k": "predict", "key": "p-qa16n", "q": "要推新的過敏原清線做法。下面三種訓練方式，哪一種最可能讓現場真的做到？", "o": ["集中上課 1 小時，發講義並筆試", "把新程序貼在產線，請大家簽名表示已閱讀", "早會示範、每人實際做一次，隔週到現場觀察"], "a": 2, "r": "訓練的目的是改變現場做法。筆試和簽閱只能證明「看過」；實際做一次、隔週觀察，才確認大家會做而且有在做。"}], [{"k": "points", "h": "衛管的教育訓練三步", "i": ["先說為什麼：用真實事件或本廠數據說明風險。", "再教怎麼做：示範，並讓學員親手做一次。", "最後確認：抽問或現場觀察，留下訓練與評核紀錄。"]}, {"k": "points", "h": "請產線配合的溝通法", "i": ["先算出對方的代價：停線時間、人力、產能。", "提出降低代價的做法，例如併入既有的清潔時間。", "和生產主管一起訂做法，讓他成為推動者。"]}], [{"k": "flip", "key": "f-qa16", "x": "食安最重要，所以產線本來就應該配合。", "r": "食安確實優先，但不說明原因、不考慮產線的代價，執行品質會打折；讓對方理解並一起設計做法，才會落實。"}, {"k": "take", "t": "好的訓練不是講完，而是現場真的照做。"}]], "qa-16-1": [[{"k": "head", "t": "教育訓練與跨部門溝通", "g": "能選出不影響產線、又記得住的訓練方式。"}, {"k": "story", "who": "衛管", "t": "衛管要讓兩班作業員都學會新的熱水清洗紀錄方式，但產線說：「趕單中，沒空上課。」"}, {"k": "table", "t": "兩種訓練方式（示意）", "head": ["", "集中上課 1 小時", "早會 10 分鐘 × 3 天"], "rows": [["停線時間", "1 小時", "0（利用早會）"], ["記住程度", "當天多、隔週少", "分次重複，較容易記住"], ["確認方式", "筆試", "現場示範＋抽問"]], "note": ""}], [{"k": "tool", "t": "15 分鐘教案架構", "i": ["3 分鐘：為什麼（事件或數據）", "7 分鐘：怎麼做（示範＋學員做一次）", "3 分鐘：確認（抽問或現場觀察）", "2 分鐘：Q&A 與紀錄"], "back": ["確認本廠教育訓練紀錄表要記錄的欄位。"]}]], "qa-16-2": [[{"k": "head", "t": "教育訓練與跨部門溝通", "g": "會評估訓練成效，並用數據說服產線。"}, {"k": "adv", "t": "訓練成效的四個層次", "i": ["第一層：學員滿不滿意。", "第二層：學會了沒有（測驗、示範）。", "第三層：現場有沒有照做（觀察、紀錄）。", "第四層：結果有沒有改善（缺失、客訴減少）。這是常用的柯克派翠克四層次評估。"]}], [{"k": "table", "t": "增加清線 ATP 檢測的影響估算（示意）", "head": ["項目", "數值"], "rows": [["每次停線", "15 分鐘"], ["每天換線", "3 次"], ["每月工作天", "20 天"], ["每月多停機", "15 小時"], ["產能影響", "15 × 600＝9,000 瓶"]], "note": ""}, {"k": "quiz", "key": "q-qa16a", "star": 2, "q": "和生管、生產主管溝通時，最有說服力的說法是？", "o": ["這是規定，一定要做", "每月約多停 15 小時、約 9,000 瓶產能，但能降低過敏原與異物風險；我們可以討論併入既有換線時間", "只要產線配合就好"], "a": 1, "y": "先算出代價，再說明效益與可行做法，對方才能一起評估。"}], [{"k": "quiz", "key": "q-qa16bn", "star": 2, "q": "訓練後一週，現場觀察 10 位作業員，只有 6 位照新方式記錄。下一步最合適的是？", "o": ["再上一次一樣的課，加深印象", "找出 4 位沒做到的原因（不會、不知道、還是表單不好用），再針對原因處理", "請做到的 6 位去提醒另外 4 位"], "a": 1, "y": "沒照做的原因不一定是態度；先找原因，才知道要再教、改表單，還是調整流程。"}], [{"k": "reflect", "q": "你最近辦的一次訓練，現場真的有照做嗎？"}]], "line-2-0": [[{"k": "head", "t": "工作教導 JI（一）", "g": "能完成一份工作分解，並用 JI 前兩步教會新人一個作業。"}, {"k": "ben", "me": "會教人的主管，才帶得起團隊；你教出來的人，就是你的分身。", "co": "新人更快上手、品質更穩，資深人員不用一直被叫去救火。"}, {"k": "predict", "key": "p-lineR2n", "q": "新人看你示範一次封口檢查後說「我會了」，也確實做對一次。接下來最合適的是？", "o": ["請他邊做邊說出要點和理由，再換一個狀況讓他判斷", "他做對了，可以排他獨立上線", "再示範兩次給他看，加深印象"], "a": 0, "r": "能做出動作不代表理解；說得出要點和理由，換個狀況才不會出錯。"}], [{"k": "points", "h": "JI 是什麼", "i": ["源自二戰時期美國的 TWI（產業內訓練），目的是在短時間內把大量新手教成熟手。", "四個步驟：①讓學員準備好 ②示範說明 ③讓學員試做 ④上線後追蹤。", "教之前要先做「工作分解」，否則每個師傅教的都不一樣。"]}, {"k": "diagram", "kind": "flow", "title": "JI 四步驟", "steps": [["① 準備學員", ""], ["② 示範說明", ""], ["③ 試做", ""], ["④ 追蹤", ""]], "note": "這週先學 ①②，下週學 ③④。"}], [{"k": "points", "h": "工作分解三欄", "i": ["主要步驟：做什麼。用「動詞＋對象」，一步只做一件事。", "要點：怎麼做才做得好。只抓三類：影響成敗、影響安全、讓工作更容易做。", "理由：為什麼要這樣做。寫具體後果，學員才記得住。"]}, {"k": "flip", "key": "f-lineR2", "x": "資深員工自然會帶新人。", "r": "會做不等於會教。沒有工作分解，新人學到的常是師傅的個人習慣，而不是標準。"}], [{"k": "fact", "t": "JI 建議一次只教學員吸收得了的份量；主要步驟超過 7–8 個時，先拆成兩段分開教。"}, {"k": "take", "t": "學員沒學會，是教的人沒教會。"}]], "line-2-1": [[{"k": "head", "t": "工作教導 JI（一）", "g": "能把一個作業寫成工作分解表，並照表示範。"}, {"k": "story", "who": "生產主管", "t": "新人第一天到優格充填站。老師傅邊做邊說：「就這樣換杯匣，很簡單，你看一次就會。」五分鐘後新人自己換杯，沒確認停機就伸手，杯匣卡榫也沒扣好，接下來 20 杯封口偏移。"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["先把「換杯匣」寫成工作分解表，讓每位師傅教的內容一致。", "示範時一次只講一個主要步驟，第二輪再加要點，第三輪再講理由。", "把「確認停機」列為安全要點，不只示範，還要說出不做的後果。"]}], [{"k": "table", "t": "工作分解表：優格充填機換杯匣（示意）", "head": ["主要步驟", "要點", "理由"], "rows": [["按停機並確認停止", "看指示燈轉紅、輸送帶停住", "避免夾手"], ["取下空杯匣", "雙手平拉", "避免杯匣變形"], ["放入新杯匣", "杯口朝上，推到聽見卡榫聲", "避免封口偏移"], ["試充填 1 杯", "檢查封口與重量", "確認換杯後品質"]], "note": "示意內容，實際以本廠作業標準為準。"}], [{"k": "tool", "t": "示範說明的三輪講法", "i": ["第 1 輪：只講主要步驟，邊做邊說「現在做什麼」", "第 2 輪：再做一次，加上每一步的要點", "第 3 輪：再做一次，加上要點的理由", "每輪結束問：「哪一步你還不確定？」"], "script": "「這個作業有 4 個步驟。我先完整做一次給你看，只講步驟；第二次我會講每一步要注意的地方；第三次講為什麼。看完你不用馬上會，有問題隨時問我。」", "back": ["挑本廠一份最常教新人的作業標準，試著改寫成三欄工作分解表。", "確認本廠新人訓練紀錄上，有沒有記錄是誰教、教了哪一項。"]}]], "line-2-2": [[{"k": "head", "t": "工作教導 JI（一）", "g": "能看出工作分解表哪裡寫得不好，並判斷新人能不能上線。"}, {"k": "adv", "t": "教之前的四項準備", "i": ["排訓練預定表：誰、在什麼時候、學會哪一項作業。", "做好工作分解：主要步驟、要點、理由。", "備齊用具與材料：教到一半去找工具，學員的注意力就散了。", "整理好現場：讓學員看到的就是標準的樣子。", "步驟太多時先拆段，一段練熟再教下一段。"]}], [{"k": "table", "t": "一份待修改的工作分解表", "head": ["列", "主要步驟", "要點", "理由"], "rows": [["A", "按停機並確認停止", "看指示燈轉紅", "避免夾手"], ["B", "取下空杯匣、放入新杯匣", "小心操作", "比較好"], ["C", "試充填 1 杯", "檢查封口與重量", "確認換杯後品質"]], "note": ""}, {"k": "quiz", "key": "q-lineR2a", "star": 2, "q": "哪一列最需要改寫？", "o": ["A 列", "B 列", "C 列"], "a": 1, "y": "B 列把兩個動作放在同一步，要點「小心操作」和理由「比較好」都沒有具體內容。改成兩個步驟，並寫出「杯口朝上、聽到卡榫聲」與「避免封口偏移」。"}], [{"k": "table", "t": "新人第一天學換杯匣的紀錄", "head": ["次數", "結果"], "rows": [["第 1 次試做", "漏掉「確認停止」"], ["第 2 次試做", "步驟全對，但說不出「杯口朝上」的理由"]], "note": ""}, {"k": "quiz", "key": "q-lineR2b", "star": 3, "q": "你下一步怎麼做？", "o": ["步驟都對了，讓他上線", "說明「杯口朝上」的理由，請他再試做一次並說出要點與理由，確認後才上線", "給他作業標準自己看"], "a": 1, "y": "能做對但說不出理由，代表還在模仿動作，換個狀況就容易出錯。下週會學到：JI 第 3 步要確認學員能說出要點與理由，才算真的懂。"}], [{"k": "reflect", "q": "你帶新人時，最常省略「示範說明」的哪一輪？"}]], "line-3-0": [[{"k": "head", "t": "工作教導 JI（二）", "g": "能用 JI 第 3、4 步確認新人真的會，並安排好追蹤頻率。"}, {"k": "ben", "me": "追蹤做得好，你就能放心把工作交出去，自己去處理更重要的事。", "co": "新人能獨立作業，人力調度更有彈性。"}, {"k": "predict", "key": "p-lineR3n", "q": "新人第一週每天有人陪，都沒出錯。第二週怎麼安排最合適？", "o": ["完全放手：第一週已經證明他會了", "繼續全程陪同一週，比較保險", "改成固定時段抽查，看減少追蹤後還能不能維持"], "a": 2, "r": "追蹤頻率降低後的表現，才看得出能不能獨立作業；一直全程陪同，反而看不出來。"}], [{"k": "points", "h": "第 3 步：讓學員試做", "i": ["先讓他做一次，錯了當場溫和更正，不要等做完才講。", "第二次請他邊做邊說出主要步驟。", "第三次再請他說出要點與理由；說得出理由，才代表真的理解。"]}, {"k": "diagram", "kind": "flow", "title": "試做的三個層次", "steps": [["做得出動作", ""], ["說得出步驟", ""], ["說得出理由", "kw"]], "note": "停在第一層就上線，換個狀況最容易出錯。"}], [{"k": "points", "h": "第 4 步：上線與追蹤", "i": ["讓他上線，並指定一位可以求助的人。", "追蹤頻率由密到疏：全程 → 每小時 → 每班兩次。", "鼓勵他發問；確認穩定後，在技能盤點表記下「可獨立作業」的日期。"]}, {"k": "flip", "key": "f-lineR3", "x": "新人第一週沒出錯，就可以放手。", "r": "要確認追蹤減少後仍能守住要點；頻率一降就出錯，代表還沒內化。"}], [{"k": "fact", "t": "JI 的口訣是「讓他做、讓他說、讓他教」：能把作業教給別人，才是真的學會。"}, {"k": "take", "t": "讓學員自己做一次，比你講十次還有用。"}]], "line-3-1": [[{"k": "head", "t": "工作教導 JI（二）", "g": "能規劃新人第一週的追蹤，並在出錯時正確處理。"}, {"k": "story", "who": "生產主管", "t": "新人在優格冰裝箱站做了三天都沒出錯， 常聲音，已經停機，原因還不知道。最合適的回報方式是？", "o": ["先拆開查清楚原因，再一次完整回報", "先報已知事實（時間、已停機、可能受影響的產品），查到原因再補報", "先請組員判斷嚴不嚴重，再決定要不要報"], "a": 1, "r": "等待期間損失可能擴大；先報已知的事實，主管才能及早決定要不要調排程或通知其他部門。"}], [{"k": "points", "h": "哪些事要立即上報", "i": ["食安：CCP 或 OPRP 偏離、異物、過敏原混線、標籤錯誤。", "工安：有人受傷、虛驚事件、設備冒煙或漏電。", "停線與品質：停線超過規定時間、整批不良、可能影響交期。"]}, {"k": "diagram", "kind": "tree", "title": "立即上報清單", "root": "馬上報", "kids": [["食安", ["偏離", "異物", "過敏原", "標籤"]], ["工安", ["受傷", "虛驚", "設備異常"]], ["營運", ["停線", "整批不良", "交期"]]]}], [{"k": "points", "h": "回報四要素", "i": ["發生什麼：時間、地點、現象。", "影響多少：數量、停多久、影響哪張單。", "已經做了什麼、需要什麼支援。"]}, {"k": "flip", "key": "f-lineR4", "x": "等查清楚再報，比較不會報錯。", "r": "等待期間損失可能擴大。先報已知的事實，查到更多再補報，結案時再報一次。"}], [{"k": "fact", "t": "很多異常會擴大，不是沒人發現，而是發現的人覺得「不嚴重」。所以上報清單要寫明確，不靠個人判斷。"}, {"k": "take", "t": "好的回報，讓主管 30 秒內就知道要不要介入。"}]], "line-4-1": [[{"k": "head", "t": "回報：何時報、報什麼", "g": "能把一則模糊的回報改寫成四要素回報。"}, {"k": "story", "who": "生產主管", "t": "21:10 優格線 2 號包裝機開始封口不良。生產主管先叫了維修，在群組留言：「包裝機怪怪的，已經叫維修。」生管隔天早上才知道工單延後，來不及通知客戶，衛管也不知道有 300 杯要評估。"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["先停機、隔離產品，再用四要素回報，並同時通知生管與衛管。", "影響要量化：隔離幾杯、預估停多久、影響哪張工單。", "修好後再回報一次：原因、對策、復機時間、首件結果。"]}], [{"k": "table", "t": "同一件事的兩種回報", "head": ["要素", "好的回報"], "rows": [["發生什麼", "優格線 2 號包裝機 21:10 起封口不良"], ["影響多少", "已隔離約 300 杯；停機中，工單預估延後 1 小時"], ["已經做了什麼", "停機、隔離產品、通知衛管"], ["需要什麼", "維修支援；請生管評估交期"]], "note": "不好的回報：「包裝機怪怪的，已經叫維修。」"}], [{"k": "tool", "t": "回報四要素卡", "i": ["發生什麼（時間、地點、現象）", "影響多少（數量、時間、訂單）", "已經做了什麼", "需要什麼支援、要誰決定"], "script": "「報告，優格線 2 號包裝機 21:10 開始封口不良。已經停機，隔離約 300 杯，工單大約延後 1 小時。衛管我已經通知了。需要維修支援，也請生管看一下交期。修好我再回報。」", "back": ["確認本廠的立即上報清單、回報對象與聯絡方式。"]}]], "line-4-2": [[{"k": "head", "t": "回報：何時報、報什麼", "g": "能算出「影響多少」，並看出回報缺了什麼。"}, {"k": "adv", "t": "回報的品質", "i": ["影響範圍從「上一次確認正常」開始算，不是從發現的那一刻。", "先報再查：用已知的資訊先回報，查到更多再補報。", "回報對象要完整：影響交期找生管，影響食安找衛管，兩者都要就同時報。", "結案時再回報一次：原因、對策、會不會再發生。"]}], [{"k": "table", "t": "封口不良的時間線（示意）", "head": ["時間", "事件"], "rows": [["20:40", "封口抽檢正常"], ["21:10", "發現封口不良，停機"], ["—", "產線速度：每分鐘 60 杯"]], "note": ""}, {"  ["風乾與檢查", "kw"]], "note": "順序不能顛倒：有殘留物時消毒效果會大打折扣。實際以本廠清潔作業標準為準。"}], [{"k": "flip", "key": "f-line6", "x": "消毒劑濃一點，清潔就可以省略。", "r": "汙垢會保護細菌、降低消毒效果；先清潔去除汙垢，消毒才有效。"}, {"k": "fact", "t": "生物膜是細菌附著在表面、包上一層保護膜的狀態，一般沖洗很難去除，要靠刷洗與正確的清潔劑。"}, {"k": "take", "t": "看不到的地方，才是清潔真正的考驗。"}]], "line-6-1": [[{"k": "head", "t": "清潔死角與離牆離地", "g": "會巡查死角，維持倉儲擺放。"}, {"k": "story", "who": "生產主管", "t": "稽核前一天，生產主管蹲下來檢查輸送帶下方，發現一層黏黏的殘留；冷凍庫裡的紙箱也直接貼著牆放。"}, {"k": "points", "h": "離牆離地為什麼重要", "i": ["離地：避免濕氣、積水與汙染，清掃時掃得到底部。", "離牆：留出檢查與清掃通道，看得到蟲鼠跡象。", "冷凍庫靠牆堆放，會擋住冷氣循環，造成局部回溫。"]}], [{"k": "table", "t": "冷凍庫巡檢紀錄（示意）", "head": ["位置", "量測"], "rows": [["庫溫顯示", "−20°C"], ["走道中央棧板", "產品表面 −19°C"], ["靠牆堆放的箱子", "產品表面 −15°C"]], "note": ""}, {"k": "tool", "t": "清潔死角巡檢 5 點", "i": ["輸送帶下方", "排水孔周圍", "拆下的零件與管路內部", "牆角與地面交界", "冷凍庫靠牆處"], "back": ["對照本廠的清潔計畫，看這 5 點有沒有列入。"]}]], "line-6-2": [[{"k": "head", "t": "清潔死角與離牆離地", "g": "能從巡檢數據判斷原因與處置。"}, {"k": "adv", "t": "清潔的四個要素", "i": ["清潔劑濃度、溫度、時間、沖刷力，少一項效果就打折。", "清潔順序：先清除大塊殘渣、清潔劑刷洗、沖洗，最後消毒。", "清潔效果要確認：目視、ATP，必要時做微生物檢測。"]}], [{"k": "table", "t": "同一份冷凍庫巡檢", "head": ["位置", "產品表面溫度"], "rows": [["走道中央棧板", "−19°C"], ["靠牆堆放的箱子", "−15°C"]], "note": ""}, {"k": "quiz", "key": "q-line6a", "star": 2, "q": "最可能的原因與處置是？", "o": ["溫度計故障，換一支", "靠牆堆放擋住冷氣循環；重新擺放、留出間距，並追蹤這批產品溫度", "把庫溫設定再調低"], "a": 1, "y": "同一個庫內只有靠牆的箱子偏高，代表冷氣循環不良。調低庫溫治標不治本，也無法處理已經回溫的產品。"}], [{"k": "quiz", "key": "q-line6bn", "star": 2, "q": "輸送帶下方發現黏膩殘留，最好的處理是？", "o": ["停機後拆開刷洗、用清潔劑處理再消毒，並把這個點加入例行清潔", "用高壓熱水沖到看不見殘留", "噴消毒劑後擦乾"], "a": 0, "y": "黏膩殘留可能已形成生物膜，只沖水或只消毒都去不掉；處理完還要把這個點納入例行清潔，才不會再發生。"}], [{"k": "reflect", "q": "你的產線哪一個死角最常被忽略？"}]], "line-7-0": [[{"k": "head", "t": "交叉汙染與零件遺失", "g": "分得清三種交叉汙染，零件少了知道怎麼處理。"}, {"k": "ben", "me": "管好零件與工具，你就擋下了最常見的客訴。", "co": "減少異物客訴與回收，保護品牌。"}, {"k": "predict", "key": "p-line7n", "q": "清潔後組回機器，發現少一顆小螺絲，組員說「應該之前就掉了」，產線在等開機。最正確的做法是？", "o": ["先開機，生產中再派人找", "先不開機，找到為止；找不到就評估上一批產品並通報", "有金屬檢測把關，可以先開機"], "a": 1, "r": "找不到的零件，可能已經在產品裡；金屬檢測也不一定擋得住所有尺寸與位置。這是異物客訴最常見的來源之一。"}], [{"k": "points", "h 。"}, {"k": "ben", "me": "讓每個人平安回家，是主管最重要的責任。", "co": "零職災，團隊更安心，也避免停工與法律責任。"}, {"k": "predict", "key": "p-lineR8n", "q": "清潔時刷子卡進還在慢速轉動的輸送帶，組員想伸手拿出來。你該怎麼做？", "o": ["慢速沒關係，戴好手套小心拿", "先切到寸動模式再拿", "停機並上鎖掛牌，確認完全停止才伸手"], "a": 2, "r": "夾捲事故常發生在「一下子」；慢速、寸動都還會動，設備沒停止、沒上鎖，就不能伸手。"}], [{"k": "points", "h": "食品廠三大職安風險", "i": ["冷凍庫：低溫、地面結冰滑倒、門被關住受困。", "機械：充填機、輸送帶的夾捲；清潔與排除卡料時最危險。", "化學品：清潔劑、消毒劑噴濺或混用產生有害氣體。"]}, {"k": "diagram", "kind": "flow", "title": "上鎖掛牌（LOTO）", "steps": [["通知", ""], ["停機", ""], ["隔離能源", ""], ["上鎖掛牌", "kw"], ["確認無能量", ""], ["作業", ""], ["解除", ""]], "note": "「確認無能量」最常被省略：按一下啟動鈕，確認真的不會動。"}], [{"k": "points", "h": "主管要守住的三件事", "i": ["冷凍庫：防寒衣物、限時作業、內部開門裝置與緊急鈴要定期測試。", "機械：清潔與排除卡料一律停機上鎖，鑰匙由作業者本人保管。", "化學品：依安全資料表（SDS）使用，戴防護具，不同清潔劑不混用。"]}, {"k": "flip", "key": "f-lineR8", "x": "老手經驗多，不用上鎖掛牌也很安全。", "r": "經驗多的人反而最常「省一下」。規則要人人一致，主管自己先做到。"}], [{"k": "fact", "t": "依《職業安全衛生法》第 37 條，發生死亡、罹災 3 人以上，或罹災 1 人以上需住院治療的職災，雇主應於 8 小時內通報勞動檢查機構。"}, {"k": "take", "t": "冷凍庫與清潔時段，是食品廠最容易出事的兩個場景。"}]], "line-8-1": [[{"k": "head", "t": "職安：冷凍庫、機械、化學品", "g": "遇到違規當下知道怎麼制止，並讓它不再發生。"}, {"k": "story", "who": "生產主管", "t": "生產主管巡線時看到組員把手伸進還在運轉的充填機，想把卡住的杯子拿出來。組員說：「停機重開要 10 分鐘，我手很快，不會怎樣。」"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["當下立即制止，先停機，不在現場責罵。", "事後問原因：是不是重開機太麻煩、產量壓力太大？從根本改善。", "在早會用這件事（不點名）重申：排除卡料一律停機上鎖，產量損失由主管承擔。"]}], [{"k": "table", "t": "9 月虛驚事件（示意）", "head": ["事件", "次數", "可能後果"], "rows": [["冷凍庫地面結冰滑倒（未受傷）", "3", "骨折"], ["排除卡料時未停機就伸手", "1", "夾傷、截肢"], ["清潔劑噴濺（有戴護目鏡）", "1", "眼睛灼傷"], ["堆高機倒車未注意", "2", "撞傷"]], "note": ""}], [{"k": "tool", "t": "早會 1 分鐘講稿：停機再伸手", "i": ["冷凍庫：防寒衣、同行或定時聯絡、確認內部開門裝置", "化學品：戴防護具，看安全資料表", "排除卡料：停機、上鎖、確認不會動"], "script": "「大家早。上週有人在充填機運轉時伸手拿卡杯，還好沒受傷。我要說清楚：排除卡料一定要停機上鎖，停機的 10 分鐘產量，我負責。手受傷了，誰都賠不起。有人做不到，我也會當場請他停下來。謝謝大家。」", "back": ["確認本廠上鎖掛牌的鎖具與標籤放在哪裡、誰可以解除。", "確認冷凍庫內部開門裝置與緊急鈴上次測試的日期。"]}]], "line-8-2": [[{"k": "head", "t": "職安：冷凍庫、機械、化學品", "g": "能用風險矩陣排出處理的優先順序。"}, {"k": "adv", "t": "風險排序", "i": ["風險＝發生可能性 × 嚴重程度；次數少但後果嚴重的，一樣要優先處理。", "改善順序（控制層級）：消除 → 替代 → 工程控制（防護罩、連鎖裝置）→ 管理（規定、訓練）→ 個人防護具。", "虛驚事件要記錄，是預防重大事故最好的機會。", "不同清潔劑混用可能產生有害氣體，例如含氯漂白劑不能和酸性清潔劑混用。"]}], [{"k": "table", "t": "虛驚事件風險評分（示意，1–5 分）", "head": ["事件", "可能性", "嚴重度", "風險分數"], "rows": [["地面結冰滑倒", "4", "3", "?"], ["未停機伸手", "2", "5", "?"], ["清潔劑噴濺", "2", "4", "?"], ["堆高機倒車", "2", "4", "?"]], "note": "風險分數＝可能性 × 嚴重度。"}, {"k": "quiz", "key": "q-lineR8a", "star": 2, "q": "依風險分數，哪一項最高？", "o": ["地面結冰滑倒", "未停機伸手", "堆高機倒車"], "a": 0, "y": "結冰 4×3＝12 最高，未停機 2×5＝10，噴濺與堆高機都是 2×4＝8。分數只是排序工具：未停機伸手的嚴重度是 5（可能截肢），雖然分數第二，也要同時處理。"}], [{"k": "quiz", "key": "q-lineR8b", "star": 3, "q": "想降低「排除卡料時伸手」的風險，哪一個做法效果最好？", "o": ["再辦一次教育訓練", "加裝連鎖裝置，防護門一打開機器就停", "要求戴防割手套"], "a": 1, "y": "依控制層級，工程控制（連鎖裝置）不依賴人的記憶；訓練屬於管理控制，手套是最後一道防線，對夾捲幾乎沒有保護效果。"}, {"k": "reflect", "q": "你的產線哪一個動作最容易受傷？目前靠的是哪一層控制？"}]], "line-9-0": [[{"k": "head", "t": "異常處理與損失擴大", "g": "能說明「晚發現」會讓損失放大多少，並照順序處理異常。"}, {"k": "ben", "me": "敢停線、會判斷，你就是現場最重要的防線。", "co": "每一次提早發現，都替公司省下大筆損失。"}, {"k": "predict", "key": "p-lineR9", "q": "同一個標籤錯誤，在首件就發現和出貨後才發現，成本差多少？", "o": ["差不多", "約 10 倍", "可能差到上百倍"], "a": 2, "r": "雪坊的示意例子裡，首件發現約 1,000 元，出貨後約 200,000 元，差 200 倍。"}], [{"k": "points", "h": "損失怎麼放大", "i": ["發現時間越晚：線上即時 → 交班 → 隔日品檢 → 出貨後客訴。", "每晚一個階段，受影響的產品、追溯範圍、處理成本都倍增。", "出貨後還要加上物流回收、客戶罰款與商譽損失。"]}, {"k": "diagram", "kind": "flow", "title": "異常處理順序", "steps": [["人員安全", ""], ["停止／隔離", "kw"], ["通知", ""], ["排除", ""], ["確認恢復", ""], ["紀錄", ""]], "note": "不能自行略過檢測或關閉警報；復機前確認設備正常、首件合格、紀錄完整。"}], [{"k": "points", "h": "主管的責任", "i": ["讓組員「敢停線、會回報」：規則明確，主管當場支持。", "不責怪通報的人；責怪會讓下一次的異常被藏起來。", "每次異常後分享「提早發現省下多少」，強化好行為。"]}, {"k": "flip", "key": "f-lineR9", "x": "停線會被罵，先做完這批再說。", "r": "晚發現的損失，遠大於停線的損失。主管要建立「發現異常可以停線」的共識。"}], [{"k": "fact", "t": "品質管理常用「1-10-100 法則」說明：源頭預防花 1，廠內發現修正花 10，到客戶端才發現要花 100。"}, {"k": "take", "t": "「先做完這批再說」，常常是損失擴大的起點。"}]], "line-9-1": [[{"k": "head", "t": "異常處理與損失擴大", "g": "能算出不同發現時間點的損失，說服組員敢停線。"}, {"k": "story", "who": "生產主管", "t": "14:00 優格線封口溫度偏低，組員跟生產主管說：「這批只剩 40 分鐘就做完，要不要做完再修？」生產主管想到這週的出貨很緊，有點猶豫。"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["立刻停線：可疑產品每多做一分鐘就多一批要評估。", "隔離從上一次確認正常到現在的產品，通知衛管與生管。", "交期壓力交給生管調整，不由產線用「先做完」來扛。"]}], [{"k": "table", "t": "同一個標籤錯誤，在不同時間點發現（示意）", "head": ["發現時間點", "處理", "成本"], "rows": [["首件檢查", "調整後重貼 1 杯", "約 1,000 元（含停機）"], ["入庫前", "重貼 2,000 杯", "約 8,000 元"], ["出貨後", "回收與重新配送", "約 200,000 元"]], "note": ""}, {"k": "calc", "kind": "loss"}], [{"k": "tool", "t": "早會 1 分鐘講稿：敢停線", "i": ["發現異常：先停、先隔離", "通知：主管、衛管、生管", "不自己關警報、不略過檢測", "復機前：設備正常、首件合格、紀錄完整"], "script": "「大家早。今天想說一件事：發現異常，你可以停線。停線幾分鐘的損失很小，等到出貨後才發現，可能要回收整批。只要是為了食安和品質停線，我一定支持你。停下來之後，第一時間告訴我。」", "back": ["確認本廠產線的停線權責與通報對象。"]}]], "line-9-2": [[{"k": "head", "t": "異常處理與損失擴大", "g": "能算出「先做完再修」會多出多少可疑產品。"}, {"k": "adv", "t": "讓損失停在最小", "i": ["損失＝受影響數量 × 單位處理成本；越晚發現，兩者都變大。", "可疑範圍從「上一次確認正常」算起，所以監控頻率決定了最壞情況。", "出貨後的成本還包括：物流回收、客戶罰款、商譽。", "每次異常都要寫下：發現時間、隔離數量、處理成本，累積起來就是說服大家停線的數據。"]}], [{"k": "table", "t": "封口溫度偏低（示意）", "head": ["項目", "數值"], "rows": [["上一次確認正常", "13:30"], ["發現偏低", "14:00"], ["產線速度", "每分鐘 50 杯"], ["這批剩下時間", "40 分鐘"]], "note": ""}, {"k": "quiz", "key": "q-lineR9a", "star": 3, "q": "如果決定「先做完這批再修」，需要評估的可疑產品會從多少杯變成多少杯？", "o": ["1,500 杯 → 2,000 杯", "1,500 杯 → 3,500 杯", "2,000 杯 → 3,500 杯"], "a": 1, "y": "立即停線：13:30–14:00 共 30 分鐘 × 50＝1,500 杯。再做 40 分鐘多 2,000 杯，合計 3,500 杯，可疑產品變成 2.3 倍。"}], [{"k": "table", "t": "同一份比較", "head": ["發現時間點", "成本"], "rows": [["首件檢查", "約 1,000 元"], ["出貨後", "約 200,000 元"]], "note": ""}, {"k": "quiz", "key": "q-lineR9b", "star": 1, "q": "出貨後才發現，成本是首件就發現的幾倍？", "o": ["約 8 倍", "約 200 倍", "約 2,000 倍"], "a": 1, "y": "200,000 ÷ 1,000＝200 倍。這就是首件檢查和「敢停線」這麼重要的原因。"}, {"k": "reflect", "q": "你的組員敢主動停線嗎？如果不敢，原因是什麼？"}]], "line-10-0": [[{"k": "head", "t": "良率與損耗", "g": "能算對良率、分類損耗，用柏拉圖找出前三大不良原因。"}, {"k": "ben", "me": "會用數據改善良率，你就有拿得出手的改善成果。", "co": "不良減少，每月省下可觀的原料與人工成本。"}, {"k": "predict", "key": "p-lineR10", "q": "良率報表 97% 很好看，原料卻常常不夠用，可能漏了什麼？", "o": ["沒有漏", "換線、試機、清線的損耗沒有算進投入數", "良品算太多"], "a": 1, "r": "沒被記錄的損耗，會讓良率看起來很好、成本卻很高。"}], [{"k": "points", "h": "良率與損耗", "i": ["良率＝良品數 ÷ 投入數；投入數要包含試機、換線、清線丟掉的量。", "損耗分四類：原料、包材、不良品、清線與換線損耗。", "不良要分兩層：現象（封口不良）與原因（封口溫度不足）。"]}, {"k": "diagram", "kind": "tree", "title": "損耗從哪裡來", "root": "投入", "kids": [["良品", ["入庫"]], ["不良品", ["封口", "重量", "破損", "標籤"]], ["製程損耗", ["試機", "換線", "清線"]]]}], [{"k": "points", "h": "柏拉圖怎麼用", "i": ["依數量由多到少排列，算出累計占比。", "通常少數幾個原因造成大部分不良，累計約八成的前幾項是改善重點。", "先改第一名，改善後至少追蹤兩週，確認不良率穩定下降。"]}, {"k": "flip", "key": "f-lineR10", "x": "良率 97% 已經很好了。", "r": "優格線 9 月總產出 259,200 杯，3% 就是 7,776 杯；以每杯約 15 元計，約 11.7 萬元（示意）。"}], [{"k": "fact", "t": "柏拉圖源自「80/20 法則」，是品質管理七大手法之一。"}, {"k": "take", "t": "良率報表很漂亮，原料卻一直不夠用，數字一定漏了什麼。"}]], "line-10-1": [[{"k": "head", "t": "良率與損耗", "g": "能整理一週的不良數據，找出第一個要改善的項目。"}, {"k": "story", "who": "生產主管", "t": "生產主管被生管追問：「報表良率 97%，為什麼生乳每週都多用了快 3%？」生產主管翻了紀錄才發現，每次換口味前的試機杯和清線丟掉的優格，都沒有人記。"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["在交班紀錄加上「試機、換線、清線丟棄量」欄位，連續記一週。", "用正確的投入數重算良率，和生管對一次數字。", "把不良品依現象分類，畫柏拉圖，先改第一名。"]}], [{"k": "table", "t": "雪坊 9 月：優格線不良分類（示意）", "head": ["項目", "數量", "占比"], "rows": [["封口不良", "3,420", "44.0%"], ["重量不足", "1,944", "25.0%"], ["杯體破損", "1,166", "15.0%"], ["標籤錯誤", "778", "10.0%"], ["其他", "468", "6.0%"]], "note": "前兩項合計 69%，是優先改善的重點。"}], [{"k": "tool", "t": "不良分類與改善卡", "i": ["先分現象：封口、重量、破損、標籤", "再分原因：人、機、料、法", "排出前三大，先改第一名", "改善後追蹤兩週，用同一個算法比較"], "script": "「大家早。這個月封口不良占了所有不良的四成多，是第一名。這兩週請大家把封口不良的杯子放在紅色箱，不要直接丟，我每天會統計。我們先把這一項降下來。」", "back": ["看本廠的不良紀錄有沒有分類欄位，以及試機、換線損耗有沒有被記錄。"]}]], "line-10-2": [[{"k": "head", "t": "良率與損耗", "g": "能算出真實良率與改善後的良率。"}, {"k": "adv", "t": "不良分析", "i": ["良率失真最常見的原因：投入數只算正式生產，漏了試機與換線。", "柏拉圖要用同一段期間、同一種分類，否則前後無法比較。", "改善效果用實際數字算：減少多少杯、省多少錢，不要只說「有改善」。", "改善時同時看成本：多花的檢查人力，有沒有比省下的不良還多。"]}], [{"k": "table", "t": "一天的生產紀錄（示意）", "head": ["項目", "杯數"], "rows": [["報表上的投入", "10,000"], ["良品", "9,700"], ["試機與換線丟棄（未記錄）", "300"]], "note": ""}, {"k": "quiz", "key": "q-lineR10a", "star": 2, "q": "把試機與換線丟棄算進投入數後，真實良率約是多少？", "o": ["97.0%", "約 94.2%", "約 91.0%"], "a": 1, "y": "真實投入＝10,000＋300＝10,300 杯，9,700 ÷ 10,300≈94.2%。只看報表的 97%，會低估將近 3 個百分點的損耗。"}], [{"k": "table", "t": "改善假設", "head": [ B", "—", "可教人", "學習中", "可獨立"], ["C", "可獨立", "—", "—", "可教人"], ["D", "—", "學習中", "—", "可獨立"], ["E", "—", "—", "可獨立", "可獨立"]], "note": "可教人＞可獨立＞學習中＞—（不會）"}], [{"k": "tool", "t": "人力配置檢查", "i": ["每個關鍵站有幾人能獨立作業？", "有沒有只有一人會的站？它是不是瓶頸或食安關鍵站？", "旺季前的多能工訓練排好了嗎？", "本月加班時數離上限還有多少？"], "script": "「各位，上週 E 請假那天，我們整條線加班 2 小時。這不是 B 的問題，是我們只有一個人會急速冷凍。接下來兩週，我會安排 B 和 C 輪流學這一站，學的時候產量會慢一點，請大家互相支援。」", "back": ["用本廠的人員名單，畫一張自己產線的技能矩陣。", "向人資確認本廠加班的計算方式與每月上限。"]}]], "line-11-2": [[{"k": "head", "t": "人力配置與人力成本", "g": "能決定訓練的優先順序，並算對加班費。"}, {"k": "adv", "t": "技能矩陣與訓練優先順序", "i": ["技能矩陣常用四級：不會、學習中、可獨立作業、可以教人。", "訓練優先順序：只有一人會的站 → 瓶頸站 → 食安關鍵站（例如 CCP、OPRP 監控）。", "多能工訓練排在淡季，旺季才有人可以支援。", "每人時成本＝每月總人力成本 ÷ 每月總工時；它比時薪高，因為包含勞健保、勞退與福利。", "人員流失的成本常被忽略：招募、訓練期間產能較低、資深員工帶教的時間。"]}], [{"k": "table", "t": "各站可獨立作業以上的人數", "head": ["工站", "人數", "是否瓶頸"], "rows": [["製冰", "2", "否"], ["充填", "2", "否"], ["急速冷凍", "1", "是"], ["裝箱", "5", "否"]], "note": ""}, {"k": "quiz", "key": "q-lineR11a", "star": 2, "q": "哪一站最需要優先培養第二人選？", "o": ["充填", "急速冷凍", "裝箱"], "a": 1, "y": "急速冷凍只有 E 可以獨立作業，又是瓶頸；E 請假，整條線產量就直接受影響。充填已有兩人，裝箱人數最多。"}], [{"k": "table", "t": "加班試算（示意）", "head": ["項目", "數值"], "rows": [["平日每小時工資", "200 元"], ["當天加班", "3 小時"]], "note": ""}, {"k": "quiz", "key": "q-lineR11b", "star": 3, "q": "依《勞動基準法》第 24 條，這位組員當天的加班費至少約多少？", "o": ["600 元", "800 元", "約 867 元"], "a": 2, "y": "前 2 小時：200 × 4/3 × 2≈533 元；第 3 小時：200 × 5/3≈333 元；合計約 867 元。600 元是沒有加給；800 元是 3 小時都只加三分之一，漏了第 3 小時要加給三分之二。"}, {"k": "reflect", "q": "你的產線哪一站最怕某個人請假？這個月可以先安排誰去學？"}]], "line-12-0": [[{"k": "head", "t": "回饋與獎懲", "g": "能用「情境－行為－影響」給出具體回饋，並清楚交辦工作。"}, {"k": "ben", "me": "會給回饋，你的團隊會越來越強，你也越來越輕鬆。", "co": "好行為被放大，問題被及早修正，人員更願意留下來。"}, {"k": "predict", "key": "p-lineR12n", "q": "組員這週兩次換線都沒核對標籤。下面哪一句最能讓他改進？", "o": ["「週二和週四換線都沒核對標籤，200 杯要重貼（示意）。下次換線後先核對再開機，可以嗎？」", "「你最近太粗心了，要專心一點。」", "「大家都有核對，只有你沒有。」"], "a": 0, "r": "具體的情境、行為、影響，對方才知道要改什麼；和別人比較只會讓人防衛。"}], [{"k": "points", "h": "交辦四要素", "i": ["目的：為什麼要做。", "標準：做到什麼程度算完成。", "期限與回報時間：什麼時候完成、什麼時候先跟我說進度。"]}, {"k": "diagram", "kind": "flow", "title": "SBI 回饋", "steps": [["情境", ""], ["行為", ""], ["影響", ""], ["下一步", "kw"]], "note": "在什麼時候、你做了什麼、造成什麼影響、希望下次怎麼做。"}], [{"k": "points", "h": "回饋的原則", "i": ["對事不對人：說行為，不說個性。", "正面回饋也要具體，對方才知道什麼該持續做。", "及時、私下講改進；公開、具體講表揚。"]}, {"k": "flip", "key": "f-lineR12", "x": "回饋就是挑毛病。", "r": "回饋也包括肯定做對的事；具體的正面回饋，會讓好行為重複出現。"}], [{"k": "fact", "t": "依《勞動基準法》第 70 條，僱用勞工 30 人以上的事業單位要訂立工作規則，獎懲是其中一項。主管的獎懲要依工作規則，不能自訂。"}, {"k": "take", "t": "回饋要說「行為和影響」，不要說「你這個人」。"}]], "line-12-1": [[{"k": "head", "t": "回饋與獎懲", "g": "能把一句情緒化的話，改成能讓人改進的回饋。"}, {"k": "story", "who": "生產主管", "t": "組員這個月第二次換線沒核對標籤，200 杯要重貼。生產主管當著全線的人說：「你到底有沒有在用心？」組員之後整天都不講話，隔天還請了假。"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["找私下的時間，先問組員當時發生了什麼事。", "用 SBI 描述事實，不評價個性。", "一起訂出改善做法與追蹤時間，例如換線首件由組員念出標籤版本。"]}], [{"k": "table", "t": "把回饋改寫成 SBI", "head": ["原本說法", "改成 SBI"], "rows": [["你很粗心", "今天 10:00 換口味時，你沒核對標籤版本，造成 200 杯要重貼；下次請先對照首件清單。"], ["做得不錯", "昨天你發現封口溫度偏低就立刻回報，避免了約 300 杯不良；這就是我們要的做法。"]], "note": ""}], [{"k": "tool", "t": "SBI 回饋卡", "i": ["情境：什麼時候、在哪裡", "行為：他具體做了什麼（看得到、聽得到的）", "影響：造成了什麼結果", "下一步：希望下次怎麼做，什麼時候再確認"], "script": "「有件事想跟你聊。今天 10:00 換口味的時候，標籤版本沒有核對到，有 200 杯要重貼。我想先聽聽看當時是什麼狀況？……下次換線時，請你在首件時把標籤版本念出來，我明天換線時會在旁邊一起確認。」", "back": ["確認本廠工作規則中，獎懲的程序與權責。"]}]], "line-12-2": [[{"k": "head", "t": "回饋與獎懲", "g": "能安排一次面談的順序，並判斷獎懲的做法是否恰當。"}, {"k": "adv", "t": "回饋與獎懲的分寸", "i": ["一次面談只談一個要改進的行為，太多會讓人只記得被罵。", "懲處依工作規則：事前告知、事實有紀錄、處理一致。", "《勞動基準法》第 26 條規定雇主不得預扣工資作為違約金或賠償費用；主管不能口頭自訂罰則或扣薪。", "處理流程：提醒 → 書面紀錄 → 依規處理，並與人資確認。", "表揚要具體、及時、公開，強化好的行為。"]}], [{"k": "table", "t": "一位組員本月紀錄", "head": ["項目", "次數"], "rows": [["換線時漏核對標籤", "2"], ["主動回報異常", "3"], ["首件檢查", "全部完成"]], "note": ""}, {"k": "quiz", "key": "q-lineR12a", "star": 2, "q": "面談時最合適的開場是？", "o": ["先講漏核對標籤的問題", "先具體肯定主動回報 3 次與首件全部完成，再用 SBI 談標籤核對", "只肯定，不提問題"], "a": 1, "y": "先具體肯定做對的事，再聚焦一個要改進的行為。只批評或只肯定，都無法帶來改善。"}], [{"k": "quiz", "key": "q-lineR12b", "star": 3, "q": "組員重貼的 200 杯標籤造成損失，生產主管想「這個月獎金扣 500 元讓他記取教訓」。最恰當的做法是？", "o": ["直接扣，讓大家知道有後果", "先查工作規則有沒有這項規定，依程序與人資確認後處理", "不扣，但要他自己賠標籤錢"], "a": 1, "y": "主管不能自訂罰則；扣獎金或要求賠償，都要有工作規則依據並依程序處理。直接扣或要他賠錢，都可能違反規定，也會讓人以後不敢說出錯誤。"}, {"k": "reflect", "q": "你最近一次給的回饋，是對事還是對人？"}]], "line-13-0": [[{"k": "head", "t": "SOP 與設備基本保養", "g": "會判斷 SOP 好不好用，能推動開機點檢。"}, {"k": "ben", "me": "會維護 SOP、會推動點檢，你就能讓產線穩定運轉。", "co": "故障減少，產能與品質更穩定。"}, {"k": "predict", "key": "p-line13", "q": "照 SOP 做卻常常出錯，最可能的原因是？", "o": ["組員不認真", "SOP 寫得不清楚，或和現場不一致", "SOP 太短"], "a": 1, "r": "SOP 和現場脫節時，大家會各做各的；發現不合理要回報修訂。"}], [{"k": "points", "h": "好的 SOP 長什麼樣", "i": ["步驟清楚：一步一個動作，寫出要點。", "和現場一致：設備、工具、表單都是現在用的。", "有版本與生效日：大家用的是同一版。"]}, {"k": "points", "h": "自主保養：開機前的 5 分鐘", "i": ["清掃時順便檢查：鬆動、漏油、異音。", "照點檢表看溫度、壓力、潤滑。", "小問題自己處理，大問題回報維修。"]}], [{"k": "diagram", "kind": "flow", "title": "SOP 怎麼改版", "steps": [["現場發現差異", ""], ["提出修改", ""], ["審核核准", ""], ["發行新版、收回舊版", "kw"], ["教育訓練", ""], ["生效", ""]], "note": "舊版沒收回，就會出現兩個版本同時在用。"}], [{"k": "flip", "key": "f-line13", "x": "保養是維修人員的事。", "r": "作業員每天最接近設備，最早發現異常；日常點檢由產線做，維修處理大問題。"}, {"k": "fact", "t": "TPM（全員生產保養）的核心之一是「自主保養」：由操作設備的人負責日常清掃、點檢與潤滑。"}, {"k": "take", "t": "SOP 是大家的共同語言，點檢是設備的健康檢查。"}]], "line-13-1": [[{"k": "head", "t": "SOP 與設備基本保養", "g": "能讓點檢不流於形式。"}, {"k": "story", "who": "生產主管", "t": "冰淇淋機這個月故障 3 次，維修說都是同一個軸封磨損。生產主管發現點檢表上這一項一直打勾，但沒人真的看過。"}, {"k": "table", "t": "冰淇淋機開機點檢表（示意）", "head": ["項目", "方法", "標準"], "rows": [["軸封", "目視", "無滲漏"], ["攪拌刀", "停機後目視、手摸", "無缺角、無鬆動"], ["冷媒壓力", "看儀表", "在綠色範圍"], ["異音", "聽", "無異常聲音"]], "note": ""}], [{"k": "tool", "t": "點檢不流於形式", "i": ["每一項都寫出方法與標準，不只寫名稱", "主管每週抽查一次，請組員現場示範", "發現異常的組員要公開肯定"], "back": ["拿出本廠設備的點檢表，看每一項有沒有寫方法與標準。"]}]], "line-13-2": [[{"k": "head", "t": "SOP 與設備基本保養", "g": "能用故障數據找出最該改善的項目。"}, {"k": "adv", "t": "SOP 修訂與教材化", "i": ["發現 SOP 不合理：先回報，不要自己改做法。", "修訂時邀請現場人員一起確認，再由權責主管核准。", "把 SOP 轉成工作分解表，就是最好的教導教材。"]}], [{"k": "table", "t": "冰淇淋機一個月故障（示意）", "head": ["故障", "次數", "每次停機"], "rows": [["軸封滲漏", "3", "90 分"], ["攪拌刀鬆動", "1", "40 分"], ["感測器", "2", "20 分"]], "note": ""}, {"k": "quiz", "key": "q-line13a", "star": 2, "q": "軸封滲漏共停機多久？占全部故障停機約多少？", "o": ["270 分鐘，約 77%", "90 分鐘，約 26%", "270 分鐘，約 50%"], "a": 0, "y": "軸封 3 × 90＝270 分；總停機＝270＋40＋40＝350 分，270 ÷ 350≈77%。選 90 分鐘是只算了一次。"}], [{"k": "quiz", "key": "q-line13bn", "star": 2, "q": "依上題，最有效的改善是？", "o": ["軸封改成每次滲漏就立刻換新", "把軸封檢查寫清楚方法與標準，納入開機點檢並抽查", "請保養廠商每月來檢查一次"], "a": 1, "y": "同一個原因反覆發生，就要從日常點檢預防；壞了才換、每月一次都抓不到每天的變化。"}], [{"k": "reflect", "q": "你的產線哪一份 SOP 最需要修訂？"}]], "line-14-0": [[{"k": "head", "t": "5S、目視管理與早會", "g": "能用目視管理讓異常一眼看見，並帶好 5 分鐘早會。"}, {"k": "ben", "me": "帶得好早會、守得住 5S，你的產線會成為示範線。", "co": "異常一眼可見，效率與食安一起提升，稽核也更從容。"}, {"k": "predict", "key": "p-lineR14n", "q": "5S 推了三個月，現場很整齊，但上週一把刮刀不見了三天才被發現。這代表什麼？", "o": ["5S 做得很好，只是剛好漏了一次", "整齊但沒有定位與標示，少了東西一眼看不出來", "需要再辦一次全廠大掃除"], "a": 1, "r": "5S 的目的是讓「不正常」變得明顯。工具有定位、有標示，少了一把馬上就看得到。"}], [{"k": "points", "h": "5S 是什麼", "i": ["整理：區分要與不要，不要的移走。", "整頓：要的東西定位、標示，30 秒內拿得到。", "清掃、清潔、素養：清掃時順便檢查，訂出標準，變成習慣。"]}, {"k": "diagram", "kind": "flow", "title": "5S", "steps": [["整理", ""], ["整頓", ""], ["清掃", ""], ["清潔", ""], ["素養", "kw"]], "note": "最難的是素養：把規則變成習慣，要靠主管持續示範與追蹤。"}], [{"k": "points", "h": "目視管理三層", "i": ["一眼看出正常或異常：例如工具板上缺一把就看得到。", "知道該怎麼做：例如看板寫明異常時的處理方式。", "知道要找誰：例如每一區標示負責人。"]}, {"k": "flip", "key": "f-lineR14", "x": "5S 就是大掃除。", "r": "5S 的目的是讓異常容易被發現；重點在「標準」與「維持」，不是一次打掃乾淨。"}], [{"k": "fact", "t": "工具影子板（在板子上畫出工具輪廓）是常見的目視管理：哪一把沒歸位，一眼就知道。在食品廠，它也是防止零件與工具遺失、掉進產品的方法。"}, {"k": "take", "t": "5S 的目的不是整齊，而是讓異常一眼就看得見。"}]], "line-14-1": [[{"k": "head", "t": "5S、目視管理與早會", "g": "能帶一場有結構、5 分鐘內結束的早會。"}, {"k": "story", "who": "生產主管", "t": "生產主管的早會常常講到 15 分鐘：從昨天的產量講到停車位。組員站著聽，後面的人開始滑手機。生管抱怨：「每天開線都晚 10 分鐘。」"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["固定結構：昨日問題 1 分、今日目標 2 分、安全與食安 1 分、提問 1 分。", "只講跟今天的生產有關的事，其他事用公告或私下講。", "把重點寫在看板上，早會只講看板上的內容。"]}], [{"k": "table", "t": "果醬線 5S 每週評分（示意，滿分 100）", "head": ["週", "分數"], "rows": [["W1", "62"], ["W2", "70"], ["W3", "78"], ["W4", "74"], ["W5", "68"]], "note": ""}], [{"k": "tool", "t": "早會 5 分鐘講稿", "i": ["昨日問題（1 分）：發生什麼、怎麼處理", "今日目標（2 分）：產量、換線、特別注意事項", "安全與食安提醒（1 分）：一件就好", "提問（1 agram", "kind": "tree", "title": "稽查前自主檢查", "root": "現場", "kids": [["人", ["儀容", "洗手", "說得出理由"]], ["紀錄", ["即時填寫", "簽名"]], ["物", ["標示", "離牆離地", "工具歸位"]]]}], [{"k": "points", "h": "被問到時怎麼答", "i": ["先聽清楚問題，回答事實，不多加推測。", "不知道就說「我確認後回覆」，並記下來、真的回覆。", "當場可以改正的就改正，並記錄在矯正措施中。"]}, {"k": "flip", "key": "f-lineR16", "x": "稽查時少說少錯。", "r": "照實說明比含糊帶過更好；回答不清楚，反而會讓稽查員深入追查。"}], [{"k": "fact", "t": "依《食品安全衛生管理法》第 41 條，主管機關可以進入製造、加工、貯存等場所執行現場查核及抽樣檢驗，業者不得規避、妨礙或拒絕。"}, {"k": "take", "t": "稽查時，現場主管說的每一句話、填的每一張表，都代表整個工廠。"}]], "line-16-1": [[{"k": "head", "t": "稽查現場應對", "g": "稽查前 10 分鐘，知道先看什麼、先改什麼。"}, {"k": "story", "who": "生產主管", "t": "衛管 10 點通知：「衛生局 10:30 到廠。」生產主管巡線時發現：兩位組員口罩沒蓋到鼻子、一張當班紀錄還沒填、三包開封的果粒沒有標開封日期。組員小聲問：「上禮拜那張漏寫的，要不要現在補一補？」"}, {"k": "points", "h": "生產主管該怎麼做", "i": ["先處理人員儀容與當班紀錄（補上今天該寫的）。", "開封原料補標日期；無法確認開封時間的，先隔離交給衛管判斷。", "過去漏寫的紀錄絕對不補填；如實說明，並交給衛管列入矯正措施。"]}], [{"k": "table", "t": "稽查前 30 分鐘巡線發現（示意）", "head": ["項目", "數量"], "rows": [["口罩未覆蓋鼻子", "2 人"], ["當班紀錄未即時填寫", "1 張"], ["開封原料沒標日期", "3 包"], ["地面積水", "1 處"], ["工具未歸位", "4 件"]], "note": ""}], [{"k": "tool", "t": "稽查前 10 分鐘巡線", "i": ["人員儀容：髮網、口罩、飾物、洗手", "當班紀錄有沒有即時填寫、簽名", "開封原料有沒有標日期", "工具歸位、地面無積水、清潔用具分區"], "script": "「各位，衛生局 10:30 會到。請大家檢查自己的口罩、髮網，手上不要有飾物。稽查員問你問題，照你平常怎麼做就怎麼說；不知道的，就說會請組長確認。不要在他面前補寫任何紀錄。」", "back": ["對照本廠上次稽核的缺失，優先檢查同類問題。"]}]], "line-16-2": [[{"k": "head", "t": "稽查現場應對", "g": "能排出稽查前的處理順序，並判斷組員的回答反映了什麼。"}, {"k": "adv", "t": "稽查現場應對", "i": ["稽查員常用「追一批產品」的方式查核：從原料一路查到出貨，所以每一站的批號紀錄都要連得起來。", "稽查員常直接問作業員：「這個步驟為什麼這樣做？」能說出理由，代表訓練到位，這就是 JI 第 3 步的價值。", "不要在稽查員面前臨時補填過去的紀錄，這會從「缺失」變成「造假」。", "稽查結束後，把缺失和改善期限列成清單，交給衛管追蹤。"]}], [{"k": "table", "t": "同一份巡線結果", "head": ["項目", "數量"], "rows": [["口罩未覆蓋鼻子", "2 人"], ["當班紀錄未即時填寫", "1 張"], ["開封原料沒標日期", "3 包"], ["地面積水", "1 處"], ["工具未歸位", "4 件"]], "note": ""}, {"k": "quiz", "key": "q-lineR16a", "star": 3, "q": "最合理的處理順序是？", "o": ["工具歸位 → 地面積水 → 其他", "人員口罩與當班紀錄 → 開封原料標示 → 地面積水 → 工具歸位", "全部交給清潔人員處理"], "a": 1, "y": "直接涉及食安與紀錄的先處理，接著是可能影響產品的標示，最後才是環境與整理。當班紀錄是補上「今天」該寫的，不是補填過去的紀錄。"}], [{"k": "quiz", "k
